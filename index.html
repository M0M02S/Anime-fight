<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050510">
<title>RNG SKIN IDLE — ULTIMATE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #050510;
  --panel: #0f0f1a;
  --panel2: #181824;
  --line: #2a2a3d;
  --text: #e2e8f0;
  --muted: #64748b;
  --gold: #fbbf24;
  --green: #4ade80;
  --red: #f87171;
  --purple: #a78bfa;
  --cyan: #22d3ee;
}
html, body { height: 100%; }
body {
  font-family: 'VT323', monospace;
  font-size: 18px;
  color: var(--text);
  background: var(--bg);
  overflow-x: hidden;
  overscroll-behavior: none;
  min-height: 100vh;
  position: relative;
}
#bgCanvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: -3;
  pointer-events: none;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 15% 20%, rgba(124, 58, 237, 0.22) 0%, transparent 45%),
    radial-gradient(circle at 85% 75%, rgba(34, 211, 238, 0.18) 0%, transparent 45%),
    radial-gradient(circle at 50% 100%, rgba(236, 72, 153, 0.15) 0%, transparent 55%);
  animation: bgPulse 12s ease-in-out infinite;
  pointer-events: none;
  z-index: -2;
}
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(124, 58, 237, 0.08) 1px, transparent 1px),
    linear-gradient(90deg, rgba(124, 58, 237, 0.08) 1px, transparent 1px);
  background-size: 48px 48px;
  animation: gridScroll 25s linear infinite;
  pointer-events: none;
  z-index: -1;
}
@keyframes bgPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.65; } }
@keyframes gridScroll {
  from { background-position: 0 0, 0 0; }
  to { background-position: 48px 48px, 48px 48px; }
}
.scanlines {
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(0deg,
    rgba(0,0,0,0.18) 0px, rgba(0,0,0,0.18) 1px,
    transparent 1px, transparent 3px);
  pointer-events: none;
  z-index: 95;
  mix-blend-mode: multiply;
}
.vignette {
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.7) 100%);
  pointer-events: none;
  z-index: 94;
}
/* TOPBAR */
.topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(5, 5, 16, 0.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 2px solid var(--line);
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.topbar::after {
  content: '';
  position: absolute;
  bottom: -2px; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, #7c3aed, #22d3ee, #ec4899, #7c3aed);
  background-size: 300% 100%;
  animation: borderSlide 4s linear infinite;
}
@keyframes borderSlide { 0% { background-position: 0% 0; } 100% { background-position: 300% 0; } }
.logo {
  font-family: 'Press Start 2P', monospace;
  font-size: 11px;
  letter-spacing: 1px;
  text-shadow: 0 0 10px var(--purple), 2px 2px 0 #000;
  white-space: nowrap;
}
.logo span {
  background: linear-gradient(90deg, #fbbf24, #f97316);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.stats-bar { margin-left: auto; display: flex; gap: 6px; }
.stat-box {
  background: var(--panel);
  border: 2px solid var(--line);
  padding: 5px 10px;
  min-width: 90px;
  text-align: center;
  border-radius: 4px;
  transition: transform .15s;
}
.stat-box.bump { animation: statBump .3s ease; }
@keyframes statBump {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.12); }
}
.stat-label {
  font-family: 'Press Start 2P', monospace;
  font-size: 6px;
  color: var(--muted);
  letter-spacing: 1px;
  display: block;
  margin-bottom: 2px;
}
.stat-value {
  font-family: 'VT323', monospace;
  font-size: 20px;
  font-weight: bold;
  display: block;
  line-height: 1;
}
.stat-box.coins { border-color: var(--gold); box-shadow: 0 0 12px rgba(251,191,36,0.25); }
.stat-box.coins .stat-value { color: var(--gold); text-shadow: 0 0 6px rgba(251,191,36,0.5); }
.stat-box.cps { border-color: var(--green); }
.stat-box.cps .stat-value { color: var(--green); text-shadow: 0 0 6px rgba(74,222,128,0.5); }
/* TABS */
.tabs {
  display: flex;
  gap: 4px;
  padding: 10px 14px;
  background: rgba(5, 5, 16, 0.85);
  border-bottom: 2px solid var(--line);
  overflow-x: auto;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  font-family: 'Press Start 2P', monospace;
  font-size: 8px;
  padding: 10px 14px;
  background: var(--panel);
  color: var(--muted);
  border: 2px solid var(--line);
  cursor: pointer;
  letter-spacing: 1px;
  transition: all .15s;
  white-space: nowrap;
  border-radius: 4px;
  min-height: 44px;
  touch-action: manipulation;
}
.tab:active { transform: scale(0.95); }
.tab.active {
  background: var(--panel2);
  color: var(--gold);
  border-color: var(--gold);
  box-shadow: 0 0 0 2px rgba(251,191,36,0.2), inset 0 0 12px rgba(251,191,36,0.1);
}
/* MAIN */
main { max-width: 1200px; margin: 0 auto; padding: 14px 12px 100px; }
.view { display: none; }
.view.active { display: block; animation: fadeUp .3s ease; }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}
.section-title {
  font-family: 'Press Start 2P', monospace;
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 2px;
  margin: 22px 0 12px;
  padding-left: 10px;
  border-left: 4px solid var(--gold);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.section-title:first-child { margin-top: 0; }
.section-title .hint {
  font-family: 'VT323', monospace;
  font-size: 14px;
  color: var(--gold);
  letter-spacing: 0;
}
/* Toggle Row */
.toggle-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 14px;
  align-items: center;
}
.toggle-row label {
  font-family: 'Press Start 2P', monospace;
  font-size: 8px;
  color: var(--muted);
  letter-spacing: 1px;
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  min-height: 40px;
  padding: 6px 10px;
  background: var(--panel);
  border: 2px solid var(--line);
  border-radius: 4px;
  touch-action: manipulation;
}
.toggle-row label:active { transform: scale(0.96); }
.toggle-row input { accent-color: var(--gold); width: 16px; height: 16px; }
.reset-btn {
  font-family: 'Press Start 2P', monospace;
  font-size: 8px;
  padding: 10px 14px;
  background: #3b0a0a;
  color: var(--red);
  border: 2px solid var(--red);
  border-radius: 4px;
  cursor: pointer;
  letter-spacing: 1px;
  min-height: 40px;
  touch-action: manipulation;
  margin-left: auto;
}
.reset-btn:active { transform: scale(0.95); }
/* BOXES */
.box-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 12px;
}
.box {
  position: relative;
  background: linear-gradient(160deg, var(--c1), var(--c2));
  border: 3px solid var(--glow);
  padding: 16px 10px 12px;
  text-align: center;
  cursor: pointer;
  transition: transform .15s, box-shadow .15s;
  overflow: hidden;
  border-radius: 6px;
  touch-action: manipulation;
  min-height: 220px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  box-shadow: 0 5px 0 rgba(0,0,0,0.5), inset 0 0 30px rgba(255,255,255,0.06);
}
.box::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.22) 50%, transparent 70%);
  transform: translateX(-100%);
  transition: transform .6s;
  pointer-events: none;
}
.box.affordable { animation: boxGlow 2s ease-in-out infinite; }
@keyframes boxGlow {
  0%, 100% { box-shadow: 0 5px 0 rgba(0,0,0,0.5), 0 0 15px var(--glow), inset 0 0 30px rgba(255,255,255,0.06); }
  50% { box-shadow: 0 5px 0 rgba(0,0,0,0.5), 0 0 30px var(--glow), inset 0 0 40px rgba(255,255,255,0.15); }
}
.box:active:not(.locked) {
  transform: translateY(3px);
  box-shadow: 0 2px 0 rgba(0,0,0,0.5), inset 0 0 30px rgba(255,255,255,0.06);
}
.box.locked { filter: grayscale(0.9) brightness(0.42); cursor: not-allowed; }
.box.locked::after {
  content: "🔒";
  position: absolute;
  top: 8px; right: 8px;
  font-size: 16px;
  opacity: 0.8;
}
.box-pixel {
  width: 84px;
  height: 84px;
  margin: 0 auto 8px;
  image-rendering: pixelated;
  filter: drop-shadow(0 3px 8px rgba(0,0,0,0.7));
  animation: boxFloat 3.5s ease-in-out infinite;
}
@keyframes boxFloat {
  0%, 100% { transform: translateY(0) rotate(-1deg); }
  50% { transform: translateY(-5px) rotate(1deg); }
}
.box-name {
  font-family: 'Press Start 2P', monospace;
  font-size: 9px;
  color: #fff;
  letter-spacing: 1px;
  margin-bottom: 8px;
  text-shadow: 2px 2px 0 rgba(0,0,0,0.8);
  line-height: 1.5;
}
.box-cost {
  color: var(--gold);
  font-size: 22px;
  font-weight: bold;
  text-shadow: 0 0 10px rgba(251,191,36,0.6), 2px 2px 0 rgba(0,0,0,0.7);
  line-height: 1;
}
.box-luck {
  display: inline-block;
  background: rgba(0,0,0,0.55);
  padding: 3px 10px;
  margin-top: 8px;
  font-size: 14px;
  color: #fff;
  border: 1px solid rgba(255,255,255,0.25);
  border-radius: 3px;
  letter-spacing: 1px;
}
.box-info {
  position: absolute;
  top: 6px; left: 6px;
  width: 24px; height: 24px;
  border-radius: 50%;
  background: rgba(0,0,0,0.6);
  border: 1.5px solid rgba(255,255,255,0.4);
  color: #fff;
  font-family: 'Press Start 2P', monospace;
  font-size: 9px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2;
  transition: all .15s;
}
.box-info:active { transform: scale(0.9); background: var(--gold); color: #000; }
/* INVENTORY / COLLECTION */
.inv-grid, .collection-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 8px;
}
.skin-card {
  position: relative;
  background: linear-gradient(160deg, var(--g1), var(--g2));
  border: 2px solid var(--rc);
  padding: 10px 6px;
  text-align: center;
  overflow: hidden;
  border-radius: 4px;
  transition: transform .15s, box-shadow .15s;
  box-shadow: 0 0 12px rgba(0,0,0,0.5);
}
.skin-card:active { transform: scale(0.97); }
.skin-card.shiny { box-shadow: 0 0 20px var(--rc), 0 0 0 1px var(--rc) inset; }
.skin-pixel {
  width: 60px;
  height: 60px;
  margin: 0 auto 6px;
  image-rendering: pixelated;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.7));
}
.skin-name {
  font-family: 'Press Start 2P', monospace;
  font-size: 6px;
  color: #fff;
  letter-spacing: .5px;
  line-height: 1.6;
  margin-bottom: 4px;
  min-height: 20px;
  text-shadow: 1px 1px 0 rgba(0,0,0,0.8);
}
.skin-rarity {
  font-family: 'Press Start 2P', monospace;
  font-size: 6px;
  color: var(--rc);
  letter-spacing: .5px;
  margin-bottom: 4px;
  text-shadow: 0 0 6px var(--rc);
}
.skin-cps {
  color: var(--green);
  font-size: 15px;
  font-weight: bold;
  text-shadow: 0 0 6px rgba(74,222,128,0.5);
}
.skin-count {
  position: absolute;
  top: 3px; right: 3px;
  background: rgba(0,0,0,0.8);
  color: #fff;
  font-size: 10px;
  padding: 1px 5px;
  border: 1px solid var(--rc);
  font-family: 'Press Start 2P', monospace;
  border-radius: 2px;
}
.skin-card.shiny::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(120deg, transparent 40%, rgba(255,255,255,0.4) 50%, transparent 60%);
  transform: translateX(-100%);
  animation: shine 2.5s infinite;
  pointer-events: none;
}
@keyframes shine {
  0% { transform: translateX(-100%); }
  50% { transform: translateX(100%); }
  100% { transform: translateX(100%); }
}
.collection-grid .skin-card.unknown {
  background: #0d0d15;
  border-color: #1f1f2e;
  box-shadow: none;
}
.collection-grid .skin-card.unknown .skin-pixel { filter: brightness(0) opacity(0.25); }
.collection-grid .skin-card.unknown .skin-name,
.collection-grid .skin-card.unknown .skin-rarity,
.collection-grid .skin-card.unknown .skin-cps { color: #2a2a3d; text-shadow: none; }
/* STATS */
.stats-panel {
  background: var(--panel);
  border: 2px solid var(--line);
  padding: 16px;
  border-radius: 4px;
}
.stat-row {
  display: flex;
  justify-content: space-between;
  border-bottom: 1px dashed var(--line);
  padding: 10px 0;
  font-size: 18px;
}
.stat-row:last-child { border-bottom: none; }
.stat-row .k { color: var(--muted); }
.stat-row .v { color: var(--text); font-weight: bold; }
.stat-row .v.gold { color: var(--gold); }
.stat-row .v.green { color: var(--green); }
/* LOG */
.log {
  background: var(--panel);
  border: 2px solid var(--line);
  padding: 12px;
  max-height: 200px;
  overflow-y: auto;
  line-height: 1.8;
  border-radius: 4px;
}
.log-entry {
  padding: 3px 0;
  font-size: 16px;
  animation: slideIn .3s ease;
  border-bottom: 1px solid rgba(42,42,61,0.4);
}
.log-entry:last-child { border-bottom: none; }
@keyframes slideIn {
  from { opacity: 0; transform: translateX(-8px); }
  to { opacity: 1; transform: none; }
}
.log-entry .time { color: var(--muted); margin-right: 6px; font-size: 14px; }
/* REVEAL OVERLAY */
.reveal-overlay {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at center, rgba(5,5,16,0.85), rgba(0,0,0,0.99));
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  opacity: 1;
  transition: opacity .25s;
}
.reveal-overlay.hidden { opacity: 0; pointer-events: none; }
.reveal-stage {
  position: relative;
  width: 96vw;
  max-width: 500px;
  height: 520px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.flash {
  position: fixed;
  inset: 0;
  background: white;
  opacity: 0;
  pointer-events: none;
  z-index: 210;
}
.flash.go { animation: flashAnim .4s ease-out; }
@keyframes flashAnim {
  0% { opacity: 0; }
  12% { opacity: 1; }
  100% { opacity: 0; }
}
.shake-screen { animation: screenShake .5s ease-out; }
@keyframes screenShake {
  0%, 100% { transform: translate(0,0); }
  12% { transform: translate(-10px, 6px); }
  28% { transform: translate(10px, -6px); }
  44% { transform: translate(-8px, 8px); }
  60% { transform: translate(8px, -8px); }
  76% { transform: translate(-4px, 4px); }
}
/* Reveal Box */
.reveal-box {
  position: absolute;
  width: 170px;
  height: 170px;
  background: linear-gradient(160deg, var(--c1), var(--c2));
  border: 4px solid var(--glow);
  border-radius: 14px;
  box-shadow: 0 0 70px var(--glow), inset 0 0 40px rgba(255,255,255,0.1);
  display: flex;
  align-items: center;
  justify-content: center;
  transform: translateY(-100vh) rotate(-25deg);
  opacity: 0;
}
.reveal-box svg { width: 120px; height: 120px; image-rendering: pixelated; }
.reveal-box.enter { animation: boxEnter .6s cubic-bezier(.34,1.56,.64,1) forwards; }
@keyframes boxEnter {
  0% { transform: translateY(-100vh) rotate(-25deg); opacity: 0; }
  60% { opacity: 1; }
  100% { transform: translateY(0) rotate(0) scale(1); opacity: 1; }
}
.reveal-box.shake { animation: boxShake .7s cubic-bezier(.36,.07,.19,.97) forwards; }
@keyframes boxShake {
  0% { transform: translate(0,0) rotate(0) scale(1); }
  15% { transform: translate(-8px, 4px) rotate(-6deg) scale(1.08); }
  30% { transform: translate(8px, -4px) rotate(6deg) scale(1.16); }
  45% { transform: translate(-10px, 6px) rotate(-9deg) scale(1.24); }
  60% { transform: translate(10px, -6px) rotate(9deg) scale(1.32); }
  75% { transform: translate(-12px, 8px) rotate(-12deg) scale(1.4); }
  90% { transform: translate(8px, -4px) rotate(6deg) scale(1.45); }
  100% { transform: translate(0,0) rotate(0) scale(1.5); }
}
.reveal-box.burst { animation: boxBurst .35s ease-out forwards; }
@keyframes boxBurst {
  0% { transform: scale(1.5); opacity: 1; filter: brightness(1); }
  40% { transform: scale(2); opacity: 0.85; filter: brightness(3); }
  100% { transform: scale(3); opacity: 0; filter: brightness(6); }
}
/* Roulette */
.roulette-wrap {
  position: absolute;
  width: 100%;
  max-width: 460px;
  height: 200px;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity .3s;
}
.roulette-wrap.show { opacity: 1; }
.roulette-window {
  width: 100%;
  height: 160px;
  overflow: hidden;
  position: relative;
  background: linear-gradient(180deg, #0a0a14, #181824);
  border: 3px solid #2a2a3d;
  border-radius: 8px;
  box-shadow: inset 0 0 30px rgba(0,0,0,0.8), 0 0 40px rgba(124,58,237,0.25);
}
.roulette-window::before,
.roulette-window::after {
  content: '';
  position: absolute;
  top: 0; bottom: 0;
  width: 70px;
  z-index: 2;
  pointer-events: none;
}
.roulette-window::before { left: 0; background: linear-gradient(90deg, #0a0a14 20%, transparent); }
.roulette-window::after { right: 0; background: linear-gradient(270deg, #0a0a14 20%, transparent); }
.roulette-strip {
  display: flex;
  height: 100%;
  position: absolute;
  left: 0;
  top: 0;
  will-change: transform;
}
.roulette-item {
  width: 110px;
  height: 100%;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 8px 4px;
  border-right: 1px solid rgba(42,42,61,0.6);
  background: linear-gradient(180deg, var(--g1), var(--g2));
}
.roulette-item svg {
  width: 60px;
  height: 60px;
  image-rendering: pixelated;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
}
.roulette-item .ri-name {
  font-family: 'Press Start 2P', monospace;
  font-size: 5px;
  color: #fff;
  text-align: center;
  margin-top: 6px;
  text-shadow: 1px 1px 0 #000;
  line-height: 1.5;
  height: 18px;
  overflow: hidden;
  width: 100%;
}
.roulette-item .ri-rarity {
  font-family: 'Press Start 2P', monospace;
  font-size: 5px;
  color: var(--rc);
  margin-top: 2px;
  text-shadow: 0 0 4px var(--rc);
  letter-spacing: .5px;
}
.roulette-pointer {
  position: absolute;
  top: -6px; bottom: -6px;
  left: 50%;
  width: 3px;
  background: linear-gradient(180deg, transparent, var(--gold), var(--gold), transparent);
  transform: translateX(-50%);
  z-index: 3;
  box-shadow: 0 0 16px var(--gold), 0 0 6px var(--gold);
  pointer-events: none;
}
.roulette-pointer::before,
.roulette-pointer::after {
  content: '';
  position: absolute;
  left: 50%;
  width: 16px;
  height: 16px;
  background: var(--gold);
  transform: translateX(-50%) rotate(45deg);
  box-shadow: 0 0 12px var(--gold);
}
.roulette-pointer::before { top: -8px; }
.roulette-pointer::after { bottom: -8px; }
/* Reveal Card */
.reveal-card {
  position: absolute;
  width: 88vw;
  max-width: 270px;
  background: linear-gradient(160deg, var(--g1), var(--g2));
  border: 4px solid var(--rc);
  border-radius: 10px;
  padding: 24px 16px;
  text-align: center;
  box-shadow: 0 0 70px var(--rc), inset 0 0 50px rgba(255,255,255,0.06);
  display: none;
}
.reveal-card.show {
  display: block;
  animation: cardReveal .7s cubic-bezier(.34,1.56,.64,1) forwards;
}
@keyframes cardReveal {
  0% { transform: perspective(800px) rotateY(180deg) scale(0.2); opacity: 0; }
  60% { transform: perspective(800px) rotateY(0deg) scale(1.1); opacity: 1; }
  100% { transform: perspective(800px) rotateY(0deg) scale(1); opacity: 1; }
}
.rc-pixel {
  width: 140px;
  height: 140px;
  margin: 0 auto 12px;
  image-rendering: pixelated;
  filter: drop-shadow(0 0 16px var(--rc));
  animation: floatPx 2.5s ease-in-out infinite;
}
@keyframes floatPx {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}
.rc-rarity {
  font-family: 'Press Start 2P', monospace;
  font-size: 11px;
  color: var(--rc);
  letter-spacing: 3px;
  margin-bottom: 10px;
  text-shadow: 0 0 16px var(--rc);
  animation: pulseRarity 1s ease-in-out infinite;
}
@keyframes pulseRarity {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.65; }
}
.rc-name {
  font-family: 'Press Start 2P', monospace;
  font-size: 12px;
  color: #fff;
  letter-spacing: 1px;
  line-height: 1.8;
  margin-bottom: 12px;
  text-shadow: 2px 2px 0 rgba(0,0,0,0.8);
}
.rc-cps {
  color: var(--green);
  font-size: 24px;
  font-weight: bold;
  text-shadow: 0 0 12px rgba(74,222,128,0.6);
}
/* Particles */
.particle {
  position: absolute;
  width: 8px;
  height: 8px;
  pointer-events: none;
  z-index: 205;
}
@keyframes particleFly {
  0% { opacity: 1; transform: translate(0,0) scale(1) rotate(0); }
  100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0) rotate(var(--rot)); }
}
/* Reveal Hint */
.reveal-hint {
  position: absolute;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  font-family: 'Press Start 2P', monospace;
  font-size: 8px;
  color: var(--muted);
  letter-spacing: 2px;
  text-align: center;
  opacity: 0;
  transition: opacity .3s;
  white-space: nowrap;
}
.reveal-hint.show {
  opacity: 1;
  animation: hintBlink 1.4s ease-in-out infinite;
}
@keyframes hintBlink {
  0%, 100% { opacity: 0.4; }
  50% { opacity: 1; }
}
/* POOL MODAL */
.pool-modal {
  position: fixed;
  inset: 0;
  z-index: 180;
  background: rgba(0,0,0,0.9);
  backdrop-filter: blur(6px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  opacity: 1;
  transition: opacity .25s;
}
.pool-modal.hidden { opacity: 0; pointer-events: none; }
.pool-content {
  background: var(--panel);
  border: 3px solid var(--line);
  border-radius: 8px;
  width: 100%;
  max-width: 600px;
  max-height: 85vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 0 40px rgba(124,58,237,0.3);
}
.pool-header {
  padding: 14px 16px;
  border-bottom: 2px solid var(--line);
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--panel2);
}
.pool-title {
  font-family: 'Press Start 2P', monospace;
  font-size: 11px;
  color: var(--gold);
  letter-spacing: 1px;
}
.pool-close {
  background: none;
  border: 2px solid var(--line);
  color: var(--text);
  font-size: 20px;
  width: 34px; height: 34px;
  border-radius: 4px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: monospace;
  touch-action: manipulation;
}
.pool-close:active { background: var(--red); border-color: var(--red); }
.pool-body {
  padding: 14px;
  overflow-y: auto;
  flex: 1;
}
.pool-rarity {
  margin-bottom: 14px;
}
.pool-rarity-head {
  font-family: 'Press Start 2P', monospace;
  font-size: 9px;
  letter-spacing: 1px;
  padding: 6px 0 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px dashed var(--line);
}
.pool-rarity-prob {
  color: var(--muted);
  font-size: 8px;
}
.pool-skins {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
  gap: 6px;
  margin-top: 8px;
}
.pool-skin {
  background: var(--panel2);
  border: 1.5px solid var(--rc);
  border-radius: 4px;
  padding: 6px 4px;
  text-align: center;
}
.pool-skin svg { width: 40px; height: 40px; image-rendering: pixelated; }
.pool-skin .psn {
  font-family: 'Press Start 2P', monospace;
  font-size: 5px;
  color: #fff;
  margin-top: 4px;
  line-height: 1.4;
}
/* TOAST */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--panel2);
  color: var(--red);
  border: 2px solid var(--red);
  padding: 12px 18px;
  font-family: 'Press Start 2P', monospace;
  font-size: 8px;
  letter-spacing: 1px;
  opacity: 0;
  pointer-events: none;
  transition: all .25s;
  z-index: 250;
  border-radius: 4px;
  box-shadow: 0 0 24px rgba(248,113,113,0.4);
  max-width: 90vw;
  text-align: center;
  line-height: 1.6;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
/* FLOATING COIN */
.float-text {
  position: fixed;
  font-family: 'Press Start 2P', monospace;
  font-size: 10px;
  color: var(--gold);
  pointer-events: none;
  z-index: 150;
  text-shadow: 2px 2px 0 #000, 0 0 8px var(--gold);
  animation: floatCoin 1s ease-out forwards;
}
@keyframes floatCoin {
  0% { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(-50px) scale(1.3); }
}
/* EMPTY */
.empty-msg {
  grid-column: 1/-1;
  color: var(--muted);
  padding: 30px 20px;
  text-align: center;
  font-size: 18px;
}
/* RESPONSIVE */
@media (max-width: 600px) {
  .logo { font-size: 9px; }
  .stat-box { min-width: 75px; padding: 3px 8px; }
  .stat-value { font-size: 18px; }
  .tab { font-size: 7px; padding: 8px 10px; }
  .box-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .inv-grid, .collection-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
  .box-name { font-size: 7px; }
  .box-pixel { width: 68px; height: 68px; }
  .box { min-height: 190px; padding: 12px 8px; }
  .box-cost { font-size: 18px; }
  .skin-pixel { width: 50px; height: 50px; }
  .skin-name { font-size: 5px; }
  .rc-pixel { width: 110px; height: 110px; }
  .roulette-item { width: 90px; }
  .roulette-item svg { width: 50px; height: 50px; }
}
@media (max-width: 380px) {
  .box-grid { grid-template-columns: repeat(2, 1fr); }
  .inv-grid, .collection-grid { grid-template-columns: repeat(3, 1fr); }
}
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>
<div class="vignette"></div>
<div class="scanlines"></div>

<header class="topbar">
  <div class="logo">RNG <span>SKIN</span> IDLE</div>
  <div class="stats-bar">
    <div class="stat-box coins" id="coinBox">
      <span class="stat-label">MÜNZEN</span>
      <span class="stat-value" id="coinDisplay">100</span>
    </div>
    <div class="stat-box cps">
      <span class="stat-label">/SEK</span>
      <span class="stat-value" id="cpsDisplay">0</span>
    </div>
  </div>
</header>

<nav class="tabs">
  <button class="tab active" data-tab="play">▶ SPIEL</button>
  <button class="tab" data-tab="collection">▣ SAMMLUNG</button>
  <button class="tab" data-tab="stats">▤ STATS</button>
</nav>

<main>
  <section id="view-play" class="view active">
    <div class="toggle-row">
      <label><input type="checkbox" id="skipAnim"> SCHNELL</label>
      <label><input type="checkbox" id="soundOn" checked> SOUND</label>
      <button class="reset-btn" id="resetBtn">RESET</button>
    </div>
    <div class="section-title">BOXEN <span class="hint" id="boxHint"></span></div>
    <div id="boxGrid" class="box-grid"></div>
    <div class="section-title">INVENTAR</div>
    <div id="invGrid" class="inv-grid"></div>
    <div class="section-title">LOG</div>
    <div id="log" class="log"></div>
  </section>

  <section id="view-collection" class="view">
    <div class="section-title">SAMMLUNG <span class="hint" id="collectionCount">0/18</span></div>
    <div id="collectionGrid" class="collection-grid"></div>
  </section>

  <section id="view-stats" class="view">
    <div class="section-title">STATISTIKEN</div>
    <div id="statsPanel" class="stats-panel"></div>
  </section>
</main>

<div id="revealOverlay" class="reveal-overlay hidden">
  <div id="revealStage" class="reveal-stage">
    <div id="revealBox" class="reveal-box"></div>
    <div id="rouletteWrap" class="roulette-wrap">
      <div class="roulette-window">
        <div id="rouletteStrip" class="roulette-strip"></div>
        <div class="roulette-pointer"></div>
      </div>
    </div>
    <div id="revealCard" class="reveal-card"></div>
  </div>
  <div id="revealHint" class="reveal-hint">TIPPEN ZUM FORTFAHREN</div>
</div>

<div id="poolModal" class="pool-modal hidden">
  <div class="pool-content">
    <div class="pool-header">
      <div class="pool-title" id="poolTitle">POOL</div>
      <button class="pool-close" id="poolClose">×</button>
    </div>
    <div class="pool-body" id="poolBody"></div>
  </div>
</div>

<div id="flash" class="flash"></div>
<div id="toast" class="toast"></div>

/* ==========================================================

========================================================== */
function $(id) { return document.getElementById(id); }
function fmt(n) {
  n = Math.floor(n);
  if (n >= 1e12) return (n/1e12).toFixed(2) + 'T';
  if (n >= 1e9) return (n/1e9).toFixed(2) + 'B';
  if (n >= 1e6) return (n/1e6).toFixed(2) + 'M';
  if (n >= 1e3) return (n/1e3).toFixed(2) + 'K';
  return n.toString();
}
function getCps() {
  return SKINS.reduce((s, skin) => s + (owned[skin.id] || 0) * skin.cps, 0);
}
function getSkinCount() {
  return Object.values(owned).reduce((a, b) => a + b, 0);
}
function getDiscovered() {
  return Object.values(owned).filter(v => v > 0).length;
}
function renderPixel(art, size) {
  const { p, g } = art;
  let rects = '';
  const vb = g.length;
  for (let y = 0; y < g.length; y++) {
    const row = g[y];
    for (let x = 0; x < row.length; x++) {
      const c = row[x];
      if (c !== '.' && p[c]) {
        rects += `<rect x="${x}" y="${y}" width="1" height="1" fill="${p[c]}"/>`;
      }
    }
  }
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${vb} ${vb}" width="${size}" height="${size}" shape-rendering="crispEdges">${rects}</svg>`;
}
function renderBoxSprite(id, size) {
  return renderPixel({ p: BOX_PALETTES[id], g: BOX_SHAPE }, size);
}

/* ==========================================================
   SOUND
========================================================== */
function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audioCtx = null; }
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function playTone(freq, dur, type, vol) {
  if (!soundEnabled || !audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    const v = vol === undefined ? 0.06 : vol;
    gain.gain.setValueAtTime(v, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}
function playTick(freq) { playTone(freq, 0.04, 'square', 0.03); }
function playRarityChime(rarity) {
  const notes = [
    [220, 330],
    [330, 440, 550],
    [440, 550, 660, 880],
    [550, 660, 880, 1100],
    [660, 880, 1100, 1320, 1650],
    [880, 1100, 1320, 1650, 1980, 2200]
  ][rarity] || [440];
  notes.forEach((f, i) => setTimeout(() => playTone(f, 0.22, 'triangle', 0.08), i * 80));
}

/* ==========================================================
   RARITY ROLL
========================================================== */
function chooseRarity(luck) {
  const weights = RARITIES.map((r, i) => r.weight * Math.pow(luck, i));
  const total = weights.reduce((a, b) => a + b, 0);
  let roll = Math.random() * total;
  for (let i = 0; i < weights.length; i++) {
    roll -= weights[i];
    if (roll <= 0) return i;
  }
  return 0;
}
function randomSkinOfRarity(rarity) {
  const pool = SKINS.filter(s => s.rarity === rarity);
  return pool[Math.floor(Math.random() * pool.length)];
}

  try {
    localStorage.setItem('rng_skin_idle_v2', JSON.stringify({

    }));
  } catch (e) {}
}
function load() {
  try {
    const s = localStorage.getItem('rng_skin_idle_v2');
    if (!s) return;
    const d = JSON.parse(s);
    if (typeof d.coins === 'number') coins = d.coins;
    if (d.owned) owned = d.owned;
    if (typeof d.pityCounter === 'number') pityCounter = d.pityCounter;
    if (typeof d.totalOpened === 'number') totalOpened = d.totalOpened;
    lastDisplayedCoins = -1;
  } catch (e) {}
}

/* ==========================================================

========================================================== */
function showPool(boxIndex) {
  const box = BOXES[boxIndex];
  const weights = RARITIES.map((r, i) => r.weight * Math.pow(box.luck, i));
  const total = weights.reduce((a, b) => a + b, 0);
  const probs = weights.map(w => (w / total) * 100);
  
  $('poolTitle').textContent = box.name + ' — POOL';
  
  let html = '';
  RARITIES.forEach((r, i) => {
    const prob = probs[i];
    const skinsInRarity = SKINS.filter(s => s.rarity === i);
    if (skinsInRarity.length === 0) return;
    html += `<div class="pool-rarity">
      <div class="pool-rarity-head">
        <span style="color:${r.color};text-shadow:0 0 8px ${r.color}">${r.name}</span>
        <span class="pool-rarity-prob">${prob.toFixed(2)}%</span>
      </div>
      <div class="pool-skins">
        ${skinsInRarity.map(s => `
          <div class="pool-skin" style="--rc:${r.color}">
            ${renderPixel(ART[s.id], 40)}
            <div class="psn">${s.name}</div>
          </div>
        `).join('')}
      </div>
    </div>`;
  });
  
  $('poolBody').innerHTML = html;
  $('poolModal').classList.remove('hidden');
}

/* ==========================================================
   OPEN BOX
========================================================== */
function tryOpenBox(index) {
  if (animating) return;
  initAudio();
  
  const box = BOXES[index];
  if (coins < box.cost) {
    showToast('NICHT GENUG MÜNZEN!');
    playTone(110, 0.15, 'sawtooth', 0.05);
    return;
  }
  
  coins -= box.cost;
  totalOpened++;
  pityCounter++;
  
  let rarityIndex = chooseRarity(box.luck);
  if (pityCounter >= 15 && rarityIndex < 2) {
    rarityIndex = 2;
  }
  if (rarityIndex >= 2) pityCounter = 0;
  
  const skin = randomSkinOfRarity(rarityIndex);
  owned[skin.id] = (owned[skin.id] || 0) + 1;
  
  const r = RARITIES[rarityIndex];
  addLog(`<span style="color:${r.color};font-weight:bold">${r.name}</span> · ${skin.name} <span style="color:var(--green)">+${fmt(skin.cps)}/s</span>`);
  
  updateStats(false);
  renderBoxes();
  renderInventory();
  updateBoxHint();
  save();
  
  if ($('skipAnim').checked) {
    playRarityChime(rarityIndex);
    return;
  }
  
  playReveal(box, skin, rarityIndex);
}

/* ==========================================================
   REVEAL ANIMATION
========================================================== */
function playReveal(box, skin, rarityIndex) {
  animating = true;
  canCloseReveal = false;
  
  const overlay = $('revealOverlay');
  const stage = $('revealStage');
  const revealBox = $('revealBox');
  const revealCard = $('revealCard');
  const rouletteWrap = $('rouletteWrap');
  const hint = $('revealHint');
  
  stage.querySelectorAll('.particle').forEach(p => p.remove());
  
  // Reset
  revealBox.style.display = 'flex';
  revealBox.style.setProperty('--c1', box.c1);
  revealBox.style.setProperty('--c2', box.c2);
  revealBox.style.setProperty('--glow', box.glow);
  revealBox.innerHTML = renderBoxSprite(box.id, 120);
  revealBox.className = 'reveal-box enter';
  
  revealCard.style.display = 'none';
  revealCard.className = 'reveal-card';
  revealCard.innerHTML = '';
  
  rouletteWrap.classList.remove('show');
  rouletteWrap.style.display = 'none';
  
  hint.classList.remove('show');
  overlay.classList.remove('hidden');
  
  const r = RARITIES[rarityIndex];
  
  // Phase 1: Box enters (0.6s)
  // Phase 2: Box shakes (0.7s)
  setTimeout(() => {
    revealBox.className = 'reveal-box shake';
    for (let i = 0; i < 6; i++) {
      setTimeout(() => playTone(180 + rarityIndex * 40 + i * 15, 0.08, 'square', 0.04), i * 100);
    }
  }, 600);
  
  // Phase 3: Box bursts (0.35s)
  setTimeout(() => {
    revealBox.className = 'reveal-box burst';
    document.body.classList.add('shake-screen');
    const flash = $('flash');
    flash.classList.remove('go');
    void flash.offsetWidth;
    flash.classList.add('go');
    setTimeout(() => document.body.classList.remove('shake-screen'), 500);
  }, 1300);
  
  // Phase 4: Roulette (2.4s)
  setTimeout(() => {
    revealBox.style.display = 'none';
    rouletteWrap.style.display = 'flex';
    // Force reflow
    void rouletteWrap.offsetWidth;
    rouletteWrap.classList.add('show');
    runRoulette(box, skin, () => {
      // Phase 5: Card reveal
      rouletteWrap.classList.remove('show');
      setTimeout(() => {
        rouletteWrap.style.display = 'none';
        
        revealCard.style.setProperty('--rc', r.color);
        revealCard.style.setProperty('--g1', r.g1);
        revealCard.style.setProperty('--g2', r.g2);
        revealCard.innerHTML = `
          <div class="rc-pixel">${renderPixel(ART[skin.id], 140)}</div>
          <div class="rc-rarity">${r.name}</div>
          <div class="rc-name">${skin.name}</div>
          <div class="rc-cps">+${fmt(skin.cps)}/s</div>
        `;
        revealCard.style.display = 'block';
        revealCard.className = 'reveal-card show';
        
        playRarityChime(rarityIndex);
        if (rarityIndex >= 2) spawnParticles(rarityIndex, r.color, 14);
        if (rarityIndex >= 3) setTimeout(() => spawnParticles(rarityIndex, r.color, 20), 150);
        if (rarityIndex >= 4) setTimeout(() => spawnParticles(rarityIndex, r.color, 24), 300);
        
        hint.classList.add('show');
        canCloseReveal = true;
      }, 200);
    });
  }, 1650);
}

function runRoulette(box, winningSkin, onDone) {
  const strip = $('rouletteStrip');
  const winEl = document.querySelector('.roulette-window');
  const winWidth = winEl.offsetWidth;
  
  // Compute item width from CSS (fallback 100)
  const isMobile = window.innerWidth <= 600;
  const itemWidth = isMobile ? 90 : 110;
  
  const totalItems = 40;
  const winnerIndex = totalItems - 1;
  
  const items = [];
  for (let i = 0; i < totalItems - 1; i++) {
    const rarity = chooseRarity(box.luck);
    items.push(randomSkinOfRarity(rarity));
  }
  items.push(winningSkin);
  
  strip.innerHTML = items.map(s => {
    const r = RARITIES[s.rarity];
    return `<div class="roulette-item" style="--g1:${r.g1};--g2:${r.g2};--rc:${r.color};width:${itemWidth}px">
      ${renderPixel(ART[s.id], isMobile ? 50 : 60)}
      <div class="ri-name">${s.name}</div>
      <div class="ri-rarity">${r.name}</div>
    </div>`;
  }).join('');
  
  // Target translation
  const targetX = winWidth / 2 - (winnerIndex * itemWidth + itemWidth / 2);
  const offsetX = (Math.random() - 0.5) * (itemWidth * 0.55);
  
  // Start: first item at left edge
  strip.style.transition = 'none';
  strip.style.transform = 'translateX(0px)';
  void strip.offsetWidth;
  
  const duration = 2400;
  
  // Set transition and animate
  strip.style.transition = `transform ${duration}ms cubic-bezier(0.1, 0.85, 0.15, 1)`;
  strip.style.transform = `translateX(${targetX + offsetX}px)`;
  
  // Tick tracker
  const centerScreenBase = winEl.getBoundingClientRect().left + winWidth / 2;
  let lastIdx = -1;
  const startTime = performance.now();
  
  function trackTicks() {
    const stripRect = strip.getBoundingClientRect();
    const relX = centerScreenBase - stripRect.left;
    const idx = Math.floor(relX / itemWidth);
    if (idx !== lastIdx && idx >= 0 && idx < items.length) {
      lastIdx = idx;
      const it = items[idx];
      playTick(380 + it.rarity * 60);
    }
    if (performance.now() - startTime < duration + 200) {
      requestAnimationFrame(trackTicks);
    }
  }
  setTimeout(trackTicks, 30);
  
  // Flash + done
  setTimeout(() => {
    const flash = $('flash');
    flash.classList.remove('go');
    void flash.offsetWidth;
    flash.classList.add('go');
    onDone();
  }, duration + 100);
}

function spawnParticles(rarity, color, count) {
  count = count || 14;
  const stage = $('revealStage');
  const cx = stage.offsetWidth / 2;
  const cy = stage.offsetHeight / 2;
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const angle = Math.random() * Math.PI * 2;
    const dist = 100 + Math.random() * 220;
    p.style.setProperty('--dx', (Math.cos(angle) * dist) + 'px');
    p.style.setProperty('--dy', (Math.sin(angle) * dist) + 'px');
    p.style.setProperty('--rot', (Math.random() * 720) + 'deg');
    p.style.left = cx + 'px';
    p.style.top = cy + 'px';
    p.style.background = color;
    p.style.boxShadow = `0 0 12px ${color}`;
    p.style.animation = `particleFly 1.3s ease-out ${Math.random() * 0.15}s forwards`;
    stage.appendChild(p);
    setTimeout(() => p.remove(), 1600);
  }
}

function closeReveal() {
  if (!canCloseReveal) return;
  $('revealOverlay').classList.add('hidden');
  setTimeout(() => {
    animating = false;
    canCloseReveal = false;
  }, 300);
}

/* ==========================================================
   EVENTS
========================================================== */
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    tab.classList.add('active');
    $('view-' + tab.dataset.tab).classList.add('active');
    if (tab.dataset.tab === 'collection') renderCollection();
    if (tab.dataset.tab === 'stats') renderStats();
  });
});

$('revealOverlay').addEventListener('click', closeReveal);

$('soundOn').addEventListener('change', (e) => {
  soundEnabled = e.target.checked;
  if (soundEnabled) initAudio();
});

$('skipAnim').addEventListener('change', () => initAudio());

$('resetBtn').addEventListener('click', () => {
  if (confirm('Wirklich ALLES zurücksetzen?')) {
    coins = 100;
    owned = {};
    logEntries = [];
    pityCounter = 0;
    totalOpened = 0;
    lastDisplayedCoins = -1;
    save();
    renderBoxes();
    refreshUI();
    renderStats();
    renderCollection();
    addLog('Spiel zurückgesetzt.');
    showToast('ZURÜCKGESETZT');
  }
});

$('poolClose').addEventListener('click', () => $('poolModal').classList.add('hidden'));
$('poolModal').addEventListener('click', (e) => {
  if (e.target.id === 'poolModal') $('poolModal').classList.add('hidden');
});

/* ==========================================================
   BACKGROUND CANVAS
========================================================== */
function initBgCanvas() {
  const canvas = $('bgCanvas');
  const ctx = canvas.getContext('2d');
  let particles = [];
  const colors = ['#7c3aed', '#22d3ee', '#ec4899', '#fbbf24', '#a78bfa'];
  
  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();
  
  for (let i = 0; i < 60; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      size: Math.floor(Math.random() * 3) + 2,
      speedY: Math.random() * 0.4 + 0.1,
      speedX: (Math.random() - 0.5) * 0.2,
      color: colors[Math.floor(Math.random() * colors.length)],
      opacity: Math.random() * 0.5 + 0.15,
      blink: Math.random() * Math.PI * 2
    });
  }
  
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      p.y -= p.speedY;
      p.x += p.speedX;
      p.blink += 0.03;
      if (p.y < -10) { p.y = canvas.height + 10; p.x = Math.random() * canvas.width; }
      if (p.x < -10) p.x = canvas.width + 10;
      if (p.x > canvas.width + 10) p.x = -10;
      const a = p.opacity * (0.7 + Math.sin(p.blink) * 0.3);
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.fillRect(Math.floor(p.x), Math.floor(p.y), p.size, p.size);
    });
    ctx.globalAlpha = 1;
    requestAnimationFrame(draw);
  }
  draw();
}

/* ==========================================================
   GAME LOOP
========================================================== */
let lastTick = performance.now();
let refreshTimer = 0;
let saveTimer = 0;

function tick(now) {
  const dt = (now - lastTick) / 1000;
  lastTick = now;
  
  const cps = getCps();
  if (cps > 0) {
    coins += cps * dt;
    updateStats(false);
  }
  
  refreshTimer += dt;
  if (refreshTimer >= 1) {
    refreshTimer = 0;
    const needsRefresh = BOXES.some((b, i) => {
      const card = $('boxGrid').children[i];
      if (!card) return true;
      const wasLocked = card.classList.contains('locked');
      const nowLocked = coins < b.cost;
      return wasLocked !== nowLocked;
    });
    if (needsRefresh) renderBoxes();
    updateBoxHint();
  }
  
  saveTimer += dt;
  if (saveTimer >= 10) {
    saveTimer = 0;
    save();
  }
  
  requestAnimationFrame(tick);
}

/* ==========================================================
   INIT
========================================================== */
initBgCanvas();
load();
renderBoxes();
renderInventory();
updateStats(false);
updateBoxHint();
addLog('Willkommen! Du hast <span style="color:var(--gold)">100 Münzen</span> — öffne deine erste Holzbox!');
requestAnimationFrame(tick);

window.addEventListener('beforeunload', save);
</script>
