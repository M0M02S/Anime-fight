<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RNG SKIN IDLE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #08080f;
    --bg2: #0f0f1a;
    --panel: #16161f;
    --panel2: #1e1e2b;
    --line: #2a2a3d;
    --text: #e2e8f0;
    --muted: #64748b;
    --gold: #fbbf24;
    --green: #4ade80;
    --red: #f87171;
  }

  html, body { height: 100%; }
  body {
    font-family: 'VT323', monospace;
    font-size: 18px;
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;
    image-rendering: pixelated;
    background-image:
      linear-gradient(rgba(30, 30, 45, 0.4) 1px, transparent 1px),
      linear-gradient(90deg, rgba(30, 30, 45, 0.4) 1px, transparent 1px);
    background-size: 32px 32px;
    min-height: 100vh;
  }

  /* ==================== TOPBAR ==================== */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(15, 15, 26, 0.95);
    backdrop-filter: blur(8px);
    border-bottom: 2px solid var(--line);
    padding: 10px 20px;
    display: flex;
    align-items: center;
    gap: 24px;
    flex-wrap: wrap;
  }

  .logo {
    font-family: 'Press Start 2P', monospace;
    font-size: 13px;
    color: var(--text);
    letter-spacing: 1px;
    text-shadow: 2px 2px 0 #000, 0 0 12px #7c3aed;
    line-height: 1.6;
  }
  .logo span { color: var(--gold); }

  .tabs { display: flex; gap: 4px; }

  .tab {
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    padding: 10px 14px;
    background: var(--panel);
    color: var(--muted);
    border: 2px solid var(--line);
    cursor: pointer;
    letter-spacing: 1px;
    transition: all .15s;
    image-rendering: pixelated;
  }
  .tab:hover { color: var(--text); border-color: #3a3a55; }
  .tab.active {
    background: var(--panel2);
    color: var(--gold);
    border-color: var(--gold);
    box-shadow: 0 0 0 2px rgba(251, 191, 36, 0.15), inset 0 0 12px rgba(251, 191, 36, 0.1);
  }

  .stats-bar {
    margin-left: auto;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .stat-box {
    background: var(--panel);
    border: 2px solid var(--line);
    padding: 6px 12px;
    min-width: 100px;
    text-align: right;
  }
  .stat-label {
    font-family: 'Press Start 2P', monospace;
    font-size: 7px;
    color: var(--muted);
    letter-spacing: 1px;
    display: block;
    margin-bottom: 4px;
  }
  .stat-value {
    font-family: 'VT323', monospace;
    font-size: 22px;
    font-weight: bold;
    color: var(--text);
    display: block;
    line-height: 1;
  }
  .stat-box.coins .stat-value { color: var(--gold); text-shadow: 0 0 8px rgba(251, 191, 36, 0.4); }
  .stat-box.cps .stat-value { color: var(--green); text-shadow: 0 0 8px rgba(74, 222, 128, 0.4); }

  /* ==================== MAIN ==================== */
  main {
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px 20px 60px;
  }

  .view { display: none; animation: fadeUp .3s ease; }
  .view.active { display: block; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: none; }
  }

  .section-title {
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 2px;
    margin: 24px 0 14px;
    padding-left: 8px;
    border-left: 4px solid var(--gold);
  }
  .section-title:first-child { margin-top: 0; }

  /* ==================== BOXES ==================== */
  .box-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
  }

  .box {
    position: relative;
    background: linear-gradient(160deg, var(--c1), var(--c2));
    border: 3px solid var(--glow);
    padding: 18px 14px;
    text-align: center;
    cursor: pointer;
    transition: transform .15s, box-shadow .15s;
    image-rendering: pixelated;
    overflow: hidden;
  }
  .box::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.15) 50%, transparent 70%);
    transform: translateX(-100%);
    transition: transform .5s;
    pointer-events: none;
  }
  .box:hover:not(.locked) {
    transform: translateY(-3px);
    box-shadow: 0 0 24px var(--glow), 0 8px 24px rgba(0,0,0,0.5);
  }
  .box:hover:not(.locked)::before { transform: translateX(100%); }
  .box.locked { filter: grayscale(0.85) brightness(0.5); cursor: not-allowed; }

  .box-pixel {
    width: 72px;
    height: 72px;
    margin: 0 auto 10px;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.6));
  }

  .box-name {
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    color: #fff;
    letter-spacing: 1px;
    margin-bottom: 8px;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.5);
  }
  .box-cost {
    color: var(--gold);
    font-size: 22px;
    font-weight: bold;
    text-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
  }
  .box-luck {
    display: inline-block;
    background: rgba(0,0,0,0.4);
    padding: 2px 10px;
    margin-top: 6px;
    font-size: 14px;
    color: #fff;
    border: 1px solid rgba(255,255,255,0.2);
  }

  /* ==================== INVENTORY ==================== */
  .inv-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px;
  }

  .skin-card {
    position: relative;
    background: linear-gradient(160deg, var(--g1), var(--g2));
    border: 2px solid var(--rc);
    padding: 12px 8px;
    text-align: center;
    overflow: hidden;
    transition: transform .15s, box-shadow .15s;
  }
  .skin-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 16px var(--rc);
  }
  .skin-pixel {
    width: 64px;
    height: 64px;
    margin: 0 auto 6px;
    image-rendering: pixelated;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,0.6));
  }
  .skin-name {
    font-family: 'Press Start 2P', monospace;
    font-size: 7px;
    color: #fff;
    letter-spacing: .5px;
    line-height: 1.6;
    margin-bottom: 4px;
    min-height: 22px;
  }
  .skin-rarity {
    font-family: 'Press Start 2P', monospace;
    font-size: 6px;
    color: var(--rc);
    letter-spacing: 1px;
    margin-bottom: 4px;
  }
  .skin-cps {
    color: var(--green);
    font-size: 15px;
    font-weight: bold;
  }
  .skin-count {
    position: absolute;
    top: 4px;
    right: 4px;
    background: rgba(0,0,0,0.6);
    color: #fff;
    font-size: 12px;
    padding: 1px 6px;
    border: 1px solid var(--rc);
    font-family: 'Press Start 2P', monospace;
  }
  .skin-card.shiny::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(120deg, transparent 40%, rgba(255,255,255,0.3) 50%, transparent 60%);
    transform: translateX(-100%);
    animation: shine 3s infinite;
    pointer-events: none;
  }
  @keyframes shine {
    0% { transform: translateX(-100%); }
    50% { transform: translateX(100%); }
    100% { transform: translateX(100%); }
  }

  /* ==================== COLLECTION ==================== */
  .collection-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 10px;
  }
  .collection-grid .skin-card.unknown {
    background: #0d0d15;
    border-color: #1f1f2e;
    filter: brightness(0.4);
  }
  .collection-grid .skin-card.unknown .skin-pixel {
    filter: brightness(0) drop-shadow(0 0 4px #334155);
  }

  /* ==================== STATS ==================== */
  .stats-panel {
    background: var(--panel);
    border: 2px solid var(--line);
    padding: 20px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 14px;
  }
  .stat-row {
    display: flex;
    justify-content: space-between;
    border-bottom: 1px dashed var(--line);
    padding: 8px 0;
  }
  .stat-row .k { color: var(--muted); }
  .stat-row .v { color: var(--text); font-weight: bold; }

  /* ==================== LOG ==================== */
  .log {
    background: var(--panel);
    border: 2px solid var(--line);
    padding: 14px;
    max-height: 180px;
    overflow-y: auto;
    line-height: 1.9;
  }
  .log-entry { padding: 2px 0; font-size: 16px; animation: slideIn .3s ease; }
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-10px); }
    to { opacity: 1; transform: none; }
  }

  /* ==================== REVEAL OVERLAY ==================== */
  .reveal-overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at center, rgba(8,8,15,0.7), rgba(0,0,0,0.98));
    backdrop-filter: blur(4px);
    opacity: 1;
    transition: opacity .3s;
    overflow: hidden;
  }
  .reveal-overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .reveal-stage {
    position: relative;
    width: 360px;
    height: 460px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Flash */
  .flash {
    position: fixed;
    inset: 0;
    background: white;
    opacity: 0;
    pointer-events: none;
    z-index: 105;
  }
  .flash.go { animation: flashAnim .3s ease-out; }
  @keyframes flashAnim {
    0% { opacity: 0; }
    20% { opacity: 1; }
    100% { opacity: 0; }
  }

  /* Rays */
  .rays {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
  }
  .rays.go { animation: raysAppear .5s ease-out forwards; }
  .rays.grow { animation: raysGrow 1.6s ease-out forwards; }
  @keyframes raysAppear {
    from { opacity: 0; transform: scale(0.3); }
    to { opacity: 0.6; transform: scale(1); }
  }
  @keyframes raysGrow {
    0% { opacity: 0; transform: scale(0.3); }
    30% { opacity: 0.8; transform: scale(1); }
    100% { opacity: 0; transform: scale(2.5); }
  }
  .rays svg { width: 500px; height: 500px; }

  /* Box */
  .reveal-box {
    position: absolute;
    width: 160px;
    height: 160px;
    background: linear-gradient(160deg, var(--c1), var(--c2));
    border: 4px solid var(--glow);
    box-shadow: 0 0 60px var(--glow), inset 0 0 30px rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    image-rendering: pixelated;
    transform: translateY(-100vh) rotate(-20deg);
    opacity: 0;
  }
  .reveal-box svg { width: 100px; height: 100px; }
  .reveal-box.enter { animation: boxEnter .55s cubic-bezier(.34,1.56,.64,1) forwards; }
  @keyframes boxEnter {
    0% { transform: translateY(-100vh) rotate(-20deg); opacity: 0; }
    60% { opacity: 1; }
    100% { transform: translateY(0) rotate(0); opacity: 1; }
  }
  .reveal-box.shake { animation: boxShake .85s cubic-bezier(.36,.07,.19,.97) forwards; }
  @keyframes boxShake {
    0% { transform: translate(0, 0) rotate(0) scale(1); }
    10% { transform: translate(-8px, 4px) rotate(-6deg) scale(1.05); }
    20% { transform: translate(8px, -4px) rotate(6deg) scale(1.1); }
    30% { transform: translate(-10px, 6px) rotate(-8deg) scale(1.15); }
    40% { transform: translate(10px, -6px) rotate(8deg) scale(1.2); }
    50% { transform: translate(-12px, 8px) rotate(-10deg) scale(1.25); }
    60% { transform: translate(12px, -8px) rotate(10deg) scale(1.3); }
    70% { transform: translate(-14px, 10px) rotate(-12deg) scale(1.35); }
    80% { transform: translate(14px, -10px) rotate(12deg) scale(1.4); }
    90% { transform: translate(-8px, 6px) rotate(-8deg) scale(1.5); }
    100% { transform: translate(0, 0) rotate(0) scale(1.6); }
  }
  .reveal-box.burst { animation: boxBurst .35s ease-out forwards; }
  @keyframes boxBurst {
    0% { transform: scale(1.6); opacity: 1; filter: brightness(1); }
    50% { transform: scale(2.2); opacity: 0.8; filter: brightness(3); }
    100% { transform: scale(3); opacity: 0; filter: brightness(5); }
  }

  /* Card */
  .reveal-card {
    position: absolute;
    width: 260px;
    background: linear-gradient(160deg, var(--g1), var(--g2));
    border: 4px solid var(--rc);
    padding: 24px 16px;
    text-align: center;
    box-shadow: 0 0 60px var(--rc), inset 0 0 40px rgba(255,255,255,0.04);
    display: none;
    image-rendering: pixelated;
  }
  .reveal-card.show {
    display: block;
    animation: cardReveal .6s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  @keyframes cardReveal {
    0% {
      transform: perspective(800px) rotateY(180deg) scale(0.3);
      opacity: 0;
    }
    60% {
      transform: perspective(800px) rotateY(0deg) scale(1.08);
      opacity: 1;
    }
    100% {
      transform: perspective(800px) rotateY(0deg) scale(1);
      opacity: 1;
    }
  }
  .rc-pixel {
    width: 130px;
    height: 130px;
    margin: 0 auto 12px;
    image-rendering: pixelated;
    filter: drop-shadow(0 0 12px var(--rc));
    animation: floatPx 2.4s ease-in-out infinite;
  }
  @keyframes floatPx {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  .rc-rarity {
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    color: var(--rc);
    letter-spacing: 3px;
    margin-bottom: 8px;
    text-shadow: 0 0 12px var(--rc);
  }
  .rc-name {
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    color: #fff;
    letter-spacing: 1px;
    line-height: 1.7;
    margin-bottom: 10px;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.6);
  }
  .rc-cps {
    color: var(--green);
    font-size: 22px;
    font-weight: bold;
    text-shadow: 0 0 10px rgba(74, 222, 128, 0.5);
  }

  /* Particles */
  .particle {
    position: absolute;
    width: 8px;
    height: 8px;
    pointer-events: none;
    image-rendering: pixelated;
  }
  @keyframes particleFly {
    0% {
      opacity: 1;
      transform: translate(0, 0) scale(1) rotate(0deg);
    }
    100% {
      opacity: 0;
      transform: translate(var(--dx), var(--dy)) scale(0) rotate(var(--rot));
    }
  }

  /* Hint */
  .reveal-hint {
    position: absolute;
    bottom: 60px;
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 2px;
    opacity: 0;
    animation: hintBlink 1.4s ease-in-out infinite;
    transition: opacity .3s;
  }
  .reveal-hint.show { opacity: 1; }
  @keyframes hintBlink {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }

  /* Screen shake */
  .shake-screen {
    animation: screenShake .4s ease-out;
  }
  @keyframes screenShake {
    0% { transform: translate(0, 0); }
    20% { transform: translate(-6px, 4px); }
    40% { transform: translate(6px, -4px); }
    60% { transform: translate(-4px, 6px); }
    80% { transform: translate(4px, -6px); }
    100% { transform: translate(0, 0); }
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--panel2);
    color: var(--red);
    border: 2px solid var(--red);
    padding: 10px 20px;
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    letter-spacing: 1px;
    opacity: 0;
    pointer-events: none;
    transition: all .25s;
    z-index: 200;
    box-shadow: 0 0 20px rgba(248, 113, 113, 0.4);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Toggle */
  .toggle-row {
    display: flex;
    gap: 20px;
    margin-bottom: 12px;
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    color: var(--muted);
    letter-spacing: 1px;
  }
  .toggle-row label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .toggle-row input { accent-color: var(--gold); }

  /* Responsive */
  @media (max-width: 700px) {
    .logo { font-size: 10px; }
    .tab { font-size: 7px; padding: 8px 10px; }
    .stat-box { min-width: 80px; padding: 4px 8px; }
    .stat-value { font-size: 18px; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="logo">RNG <span>SKIN</span> IDLE</div>
  <nav class="tabs">
    <button class="tab active" data-tab="play">▶ SPIEL</button>
    <button class="tab" data-tab="collection">▣ SAMMLUNG</button>
    <button class="tab" data-tab="stats">▤ STATS</button>
  </nav>
  <div class="stats-bar">
    <div class="stat-box coins">
      <span class="stat-label">MÜNZEN</span>
      <span class="stat-value" id="coins">0</span>
    </div>
    <div class="stat-box cps">
      <span class="stat-label">MÜNZEN/S</span>
      <span class="stat-value" id="cps">0</span>
    </div>
  </div>
</header>

<main>
  <section id="view-play" class="view active">
    <div class="toggle-row">
      <label><input type="checkbox" id="skipAnim"> SCHNELLÖFFNEN</label>
      <label><input type="checkbox" id="soundToggle" checked> SOUND AN</label>
    </div>
    <div class="section-title">BOXEN</div>
    <div id="boxGrid" class="box-grid"></div>
    <div class="section-title">INVENTAR</div>
    <div id="invGrid" class="inv-grid"></div>
    <div class="section-title">LOG</div>
    <div id="log" class="log"></div>
  </section>

  <section id="view-collection" class="view">
    <div class="section-title">SAMMLUNG <span id="collectionCount" style="color:var(--gold)"></span></div>
    <div id="collectionGrid" class="collection-grid"></div>
  </section>

  <section id="view-stats" class="view">
    <div class="section-title">STATISTIKEN</div>
    <div id="statsPanel" class="stats-panel"></div>
  </section>
</main>

<div id="revealOverlay" class="reveal-overlay hidden">
  <div id="revealStage" class="reveal-stage">
    <div class="rays" id="revealRays"></div>
    <div class="reveal-box" id="revealBox"></div>
    <div class="reveal-card" id="revealCard"></div>
  </div>
  <div class="reveal-hint" id="revealHint">KLICKEN ZUM FORTFAHREN</div>
</div>

<div class="flash" id="flash"></div>
<div class="toast" id="toast">NICHT GENUG MÜNZEN!</div>
