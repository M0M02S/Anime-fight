<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a18">
<title>RNG SKIN IDLE — ULTIMATE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #0a0a18;
  --bg2: #13132a;
  --panel: #1a1a2e;
  --panel2: #252542;
  --line: #3a3a5c;
  --line2: #4a4a72;
  --text: #f1f5f9;
  --muted: #94a3b8;
  --gold: #fcd34d;
  --green: #4ade80;
  --red: #f87171;
  --purple: #a78bfa;
  --cyan: #22d3ee;
  --pink: #f472b6;
}
html, body { height: 100%; }
body {
  font-family: 'VT323', monospace;
  font-size: 18px;
  color: var(--text);
  background: var(--bg);
  overflow-x: hidden;
  overscroll-behavior: none;
  min-height: 100vh;
  position: relative;
}

/* ===== BACKGROUND LAYERS ===== */
#bgCanvas, #fgCanvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}
#bgCanvas { z-index: -3; }
#fgCanvas { z-index: -1; }

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse at 20% 15%, rgba(124, 58, 237, 0.35) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 70%, rgba(34, 211, 238, 0.28) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 100%, rgba(236, 72, 153, 0.25) 0%, transparent 55%),
    radial-gradient(ellipse at 10% 90%, rgba(251, 191, 36, 0.15) 0%, transparent 40%);
  animation: bgPulse 10s ease-in-out infinite;
  pointer-events: none;
  z-index: -2;
}
@keyframes bgPulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.65; transform: scale(1.05); }
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(167, 139, 250, 0.12) 1px, transparent 1px),
    linear-gradient(90deg, rgba(167, 139, 250, 0.12) 1px, transparent 1px);
  background-size: 40px 40px;
  animation: gridScroll 20s linear infinite;
  pointer-events: none;
  z-index: -1;
}
@keyframes gridScroll {
  from { background-position: 0 0, 0 0; }
  to { background-position: 40px 40px, 40px 40px; }
}

.scanlines {
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(0deg,
    rgba(0,0,0,0.12) 0px, rgba(0,0,0,0.12) 1px,
    transparent 1px, transparent 3px);
  pointer-events: none;
  z-index: 95;
  mix-blend-mode: multiply;
}
.vignette {
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at center, transparent 50%, rgba(0,0,0,0.45) 100%);
  pointer-events: none;
  z-index: 94;
}

/* ===== TOPBAR ===== */
.topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(10, 10, 24, 0.92);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 2px solid var(--line);
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.topbar::after {
  content: '';
  position: absolute;
  bottom: -2px; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, #7c3aed, #22d3ee, #ec4899, #fcd34d, #7c3aed);
  background-size: 300% 100%;
  animation: borderSlide 3s linear infinite;
}
@keyframes borderSlide {
  0% { background-position: 0% 0; }
  100% { background-position: 300% 0; }
}
.logo {
  font-family: 'Press Start 2P', monospace;
  font-size: 11px;
  letter-spacing: 1px;
  text-shadow: 0 0 12px var(--purple), 2px 2px 0 #000;
  white-space: nowrap;
}
.logo span {
  background: linear-gradient(90deg, #fcd34d, #f97316, #fcd34d);
  background-size: 200% auto;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: shineText 3s linear infinite;
}
@keyframes shineText {
  to { background-position: 200% center; }
}
.stats-bar { margin-left: auto; display: flex; gap: 6px; }
.stat-box {
  background: var(--panel);
  border: 2px solid var(--line);
  padding: 5px 10px;
  min-width: 90px;
  text-align: center;
  border-radius: 6px;
  transition: transform .15s;
}
.stat-box.bump { animation: statBump .3s ease; }
@keyframes statBump {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.15); }
}
.stat-label {
  font-family: 'Press Start 2P', monospace;
  font-size: 6px;
  color: var(--muted);
  letter-spacing: 1px;
  display: block;
  margin-bottom: 2px;
}
.stat-value {
  font-family: 'VT323', monospace;
  font-size: 20px;
  font-weight: bold;
  display: block;
  line-height: 1;
}
.stat-box.coins { border-color: var(--gold); box-shadow: 0 0 14px rgba(252,211,77,0.35); }
.stat-box.coins .stat-value { color: var(--gold); text-shadow: 0 0 8px rgba(252,211,77,0.6); }
.stat-box.cps { border-color: var(--green); box-shadow: 0 0 14px rgba(74,222,128,0.3); }
.stat-box.cps .stat-value { color: var(--green); text-shadow: 0 0 8px rgba(74,222,128,0.5); }

/* ===== TABS ===== */
.tabs {
  display: flex;
  gap: 4px;
  padding: 10px 14px;
  background: rgba(10, 10, 24, 0.85);
  border-bottom: 2px solid var(--line);
  overflow-x: auto;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  font-family: 'Press Start 2P', monospace;
  font-size: 8px;
  padding: 10px 14px;
  background: var(--panel);
  color: var(--muted);
  border: 2px solid var(--line);
  cursor: pointer;
  letter-spacing: 1px;
  transition: all .15s;
  white-space: nowrap;
  border-radius: 4px;
  min-height: 44px;
  touch-action: manipulation;
}
.tab:active { transform: scale(0.95); }
.tab.active {
  background: var(--panel2);
  color: var(--gold);
  border-color: var(--gold);
  box-shadow: 0 0 0 2px rgba(252,211,77,0.25), inset 0 0 15px rgba(252,211,77,0.15);
}

/* ===== MAIN ===== */
main { max-width: 1200px; margin: 0 auto; padding: 14px 12px 100px; }
.view { display: none; }
.view.active { display: block; animation: fadeUp .3s ease; }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}
.section-title {
  font-family: 'Press Start 2P', monospace;
  font-size: 10px;
  color: var(--text);
  letter-spacing: 2px;
  margin: 22px 0 12px;
  padding-left: 10px;
  border-left: 4px solid var(--gold);
  display: flex;
  justify-content: space-between;
  align-items: center;
  text-shadow: 0 0 8px rgba(252,211,77,0.4);
}
.section-title:first-child { margin-top: 0; }
.section-title .hint {
  font-family: 'VT323', monospace;
  font-size: 14px;
  color: var(--gold);
  letter-spacing: 0;
}

/* ===== TOGGLE ROW ===== */
.toggle-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 14px;
  align-items: center;
}
.toggle-row label {
  font-family: 'Press Start 2P', monospace;
  font-size: 8px;
  color: var(--text);
  letter-spacing: 1px;
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  min-height: 40px;
  padding: 6px 10px;
  background: var(--panel);
  border: 2px solid var(--line);
  border-radius: 4px;
  touch-action: manipulation;
}
.toggle-row label:active { transform: scale(0.96); }
.toggle-row input { accent-color: var(--gold); width: 16px; height: 16px; }
.reset-btn {
  font-family: 'Press Start 2P', monospace;
  font-size: 8px;
  padding: 10px 14px;
  background: #4a1010;
  color: var(--red);
  border: 2px solid var(--red);
  border-radius: 4px;
  cursor: pointer;
  letter-spacing: 1px;
  min-height: 40px;
  touch-action: manipulation;
  margin-left: auto;
}
.reset-btn:active { transform: scale(0.95); }

/* ===== BOXES ===== */
.box-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 14px;
}
.box {
  position: relative;
  background: linear-gradient(160deg, var(--c1), var(--c2));
  border: 3px solid var(--glow);
  padding: 16px 10px 12px;
  text-align: center;
  cursor: pointer;
  transition: transform .18s, box-shadow .18s, filter .18s;
  overflow: hidden;
  border-radius: 8px;
  touch-action: manipulation;
  min-height: 230px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  box-shadow: 0 6px 0 rgba(0,0,0,0.45), 0 0 20px var(--glow), inset 0 0 30px rgba(255,255,255,0.1);
}
.box::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.3) 50%, transparent 70%);
  transform: translateX(-100%);
  transition: transform .7s;
  pointer-events: none;
}
.box:hover:not(.locked) { transform: translateY(-5px) scale(1.02); box-shadow: 0 10px 0 rgba(0,0,0,0.45), 0 0 35px var(--glow), inset 0 0 40px rgba(255,255,255,0.15); }
.box:hover:not(.locked)::before { transform: translateX(100%); }
.box.affordable { animation: boxGlowPulse 2.4s ease-in-out infinite; }
@keyframes boxGlowPulse {
  0%, 100% { box-shadow: 0 6px 0 rgba(0,0,0,0.45), 0 0 18px var(--glow), inset 0 0 30px rgba(255,255,255,0.1); }
  50% { box-shadow: 0 6px 0 rgba(0,0,0,0.45), 0 0 40px var(--glow), inset 0 0 45px rgba(255,255,255,0.2); }
}
.box:active:not(.locked) {
  transform: translateY(4px) scale(0.98);
  box-shadow: 0 2px 0 rgba(0,0,0,0.45), inset 0 0 30px rgba(255,255,255,0.1);
}
.box.locked { filter: grayscale(0.85) brightness(0.5); cursor: not-allowed; }
.box.locked::after {
  content: "🔒";
  position: absolute;
  top: 8px; right: 8px;
  font-size: 18px;
  opacity: 0.9;
}
.box-pixel {
  width: 88px;
  height: 88px;
  margin: 0 auto 8px;
  image-rendering: pixelated;
  filter: drop-shadow(0 4px 10px rgba(0,0,0,0.8));
  animation: boxFloat 4s ease-in-out infinite;
}
@keyframes boxFloat {
  0%, 100% { transform: translateY(0) rotate(-1deg); }
  50% { transform: translateY(-6px) rotate(1deg); }
}
.box-name {
  font-family: 'Press Start 2P', monospace;
  font-size: 9px;
  color: #fff;
  letter-spacing: 1px;
  margin-bottom: 8px;
  text-shadow: 2px 2px 0 rgba(0,0,0,0.9);
  line-height: 1.6;
}
.box-cost {
  color: var(--gold);
  font-size: 22px;
  font-weight: bold;
  text-shadow: 0 0 12px rgba(252,211,77,0.7), 2px 2px 0 rgba(0,0,0,0.8);
  line-height: 1;
}
.box-luck {
  display: inline-block;
  background: rgba(0,0,0,0.6);
  padding: 3px 10px;
  margin-top: 8px;
  font-size: 14px;
  color: #fff;
  border: 1px solid rgba(255,255,255,0.35);
  border-radius: 3px;
  letter-spacing: 1px;
}
.box-minRarity {
  font-family: 'Press Start 2P', monospace;
  font-size: 6px;
  color: var(--glow);
  margin-top: 6px;
  letter-spacing: 1px;
  text-shadow: 0 0 8px var(--glow);
}
.box-info {
  position: absolute;
  top: 6px; left: 6px;
  width: 26px; height: 26px;
  border-radius: 50%;
  background: rgba(0,0,0,0.7);
  border: 2px solid rgba(255,255,255,0.5);
  color: #fff;
  font-family: 'Press Start 2P', monospace;
  font-size: 9px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2;
  transition: all .15s;
}
.box-info:active { transform: scale(0.9); background: var(--gold); color: #000; border-color: var(--gold); }

/* ===== INVENTORY / COLLECTION ===== */
.inv-grid, .collection-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 10px;
}
.skin-card {
  position: relative;
  background: linear-gradient(160deg, var(--g1), var(--g2));
  border: 2px solid var(--rc);
  padding: 10px 6px;
  text-align: center;
  overflow: hidden;
  border-radius: 6px;
  transition: transform .15s, box-shadow .15s;
  box-shadow: 0 0 14px rgba(0,0,0,0.6);
}
.skin-card:active { transform: scale(0.97); }
.skin-card.shiny { box-shadow: 0 0 24px var(--rc), inset 0 0 0 1px var(--rc); }
.skin-pixel {
  width: 64px;
  height: 64px;
  margin: 0 auto 6px;
  image-rendering: pixelated;
  filter: drop-shadow(0 3px 6px rgba(0,0,0,0.8));
}
.skin-name {
  font-family: 'Press Start 2P', monospace;
  font-size: 6px;
  color: #fff;
  letter-spacing: .5px;
  line-height: 1.6;
  margin-bottom: 4px;
  min-height: 20px;
  text-shadow: 1px 1px 0 rgba(0,0,0,0.9);
}
.skin-rarity {
  font-family: 'Press Start 2P', monospace;
  font-size: 6px;
  color: var(--rc);
  letter-spacing: .5px;
  margin-bottom: 4px;
  text-shadow: 0 0 8px var(--rc);
}
.skin-cps {
  color: var(--green);
  font-size: 15px;
  font-weight: bold;
  text-shadow: 0 0 8px rgba(74,222,128,0.6);
}
.skin-count {
  position: absolute;
  top: 3px; right: 3px;
  background: rgba(0,0,0,0.85);
  color: #fff;
  font-size: 10px;
  padding: 1px 5px;
  border: 1px solid var(--rc);
  font-family: 'Press Start 2P', monospace;
  border-radius: 2px;
}
.skin-card.shiny::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(120deg, transparent 40%, rgba(255,255,255,0.5) 50%, transparent 60%);
  transform: translateX(-100%);
  animation: shine 2.5s infinite;
  pointer-events: none;
}
@keyframes shine {
  0% { transform: translateX(-100%); }
  50% { transform: translateX(100%); }
  100% { transform: translateX(100%); }
}
.collection-grid .skin-card.unknown {
  background: #1a1a2e;
  border-color: #2a2a42;
  box-shadow: none;
}
.collection-grid .skin-card.unknown .skin-pixel { filter: brightness(0) opacity(0.3); }
.collection-grid .skin-card.unknown .skin-name,
.collection-grid .skin-card.unknown .skin-rarity,
.collection-grid .skin-card.unknown .skin-cps { color: #3a3a5c; text-shadow: none; }

/* ===== STATS ===== */
.stats-panel {
  background: var(--panel);
  border: 2px solid var(--line);
  padding: 16px;
  border-radius: 6px;
}
.stat-row {
  display: flex;
  justify-content: space-between;
  border-bottom: 1px dashed var(--line);
  padding: 10px 0;
  font-size: 18px;
}
.stat-row:last-child { border-bottom: none; }
.stat-row .k { color: var(--muted); }
.stat-row .v { color: var(--text); font-weight: bold; }
.stat-row .v.gold { color: var(--gold); }
.stat-row .v.green { color: var(--green); }

/* ===== LOG ===== */
.log {
  background: var(--panel);
  border: 2px solid var(--line);
  padding: 12px;
  max-height: 200px;
  overflow-y: auto;
  line-height: 1.8;
  border-radius: 6px;
}
.log-entry {
  padding: 3px 0;
  font-size: 16px;
  animation: slideIn .3s ease;
  border-bottom: 1px solid rgba(58,58,92,0.5);
}
.log-entry:last-child { border-bottom: none; }
@keyframes slideIn {
  from { opacity: 0; transform: translateX(-8px); }
  to { opacity: 1; transform: none; }
}
.log-entry .time { color: var(--muted); margin-right: 6px; font-size: 14px; }

/* ===== REVEAL OVERLAY ===== */
.reveal-overlay {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at center, rgba(10,10,24,0.9), rgba(0,0,0,0.99));
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  opacity: 1;
  transition: opacity .25s;
}
.reveal-overlay.hidden { opacity: 0; pointer-events: none; }
.reveal-stage {
  position: relative;
  width: 96vw;
  max-width: 500px;
  height: 540px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.flash {
  position: fixed;
  inset: 0;
  background: #fff;
  opacity: 0;
  pointer-events: none;
  z-index: 210;
}
.flash.go { animation: flashAnim .45s ease-out; }
@keyframes flashAnim {
  0% { opacity: 0; }
  12% { opacity: 1; }
  100% { opacity: 0; }
}
.shake-screen { animation: screenShake .55s ease-out; }
@keyframes screenShake {
  0%, 100% { transform: translate(0,0); }
  12% { transform: translate(-12px, 8px); }
  28% { transform: translate(12px, -8px); }
  44% { transform: translate(-10px, 10px); }
  60% { transform: translate(10px, -10px); }
  76% { transform: translate(-5px, 5px); }
}

/* Reveal Box */
.reveal-box {
  position: absolute;
  width: 170px;
  height: 170px;
  background: linear-gradient(160deg, var(--c1), var(--c2));
  border: 4px solid var(--glow);
  border-radius: 16px;
  box-shadow: 0 0 90px var(--glow), inset 0 0 40px rgba(255,255,255,0.15);
  display: flex;
  align-items: center;
  justify-content: center;
  transform: translateY(-100vh) rotate(-25deg);
  opacity: 0;
  z-index: 5;
  transition: opacity .4s;
}
.reveal-box img { width: 130px; height: 130px; image-rendering: pixelated; }
.reveal-box.enter { animation: boxEnter .55s cubic-bezier(.34,1.56,.64,1) forwards; }
@keyframes boxEnter {
  0% { transform: translateY(-100vh) rotate(-25deg); opacity: 0; }
  60% { opacity: 1; }
  100% { transform: translateY(0) rotate(0) scale(1); opacity: 1; }
}
.reveal-box.shake { animation: boxShake .7s cubic-bezier(.36,.07,.19,.97) forwards; }
@keyframes boxShake {
  0% { transform: translate(0,0) rotate(0) scale(1); }
  15% { transform: translate(-8px, 4px) rotate(-6deg) scale(1.08); }
  30% { transform: translate(8px, -4px) rotate(6deg) scale(1.16); }
  45% { transform: translate(-10px, 6px) rotate(-9deg) scale(1.24); }
  60% { transform: translate(10px, -6px) rotate(9deg) scale(1.32); }
  75% { transform: translate(-12px, 8px) rotate(-12deg) scale(1.4); }
  90% { transform: translate(8px, -4px) rotate(6deg) scale(1.45); }
  100% { transform: translate(0,0) rotate(0) scale(1.5); }
}
.reveal-box.fade { animation: boxFade .5s ease-out forwards; }
@keyframes boxFade {
  0% { transform: scale(1.5); opacity: 1; filter: brightness(1); }
  40% { filter: brightness(4); }
  100% { transform: scale(2.5); opacity: 0; filter: brightness(8); }
}

/* Roulette */
.roulette-wrap {
  position: absolute;
  width: 100%;
  max-width: 480px;
  height: 220px;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity .35s;
  z-index: 4;
}
.roulette-wrap.show { opacity: 1; }
.roulette-window {
  width: 100%;
  height: 180px;
  overflow: hidden;
  position: relative;
  background: linear-gradient(180deg, #0a0a18, #1a1a2e, #0a0a18);
  border: 3px solid #3a3a5c;
  border-radius: 10px;
  box-shadow: inset 0 0 40px rgba(0,0,0,0.9), 0 0 50px rgba(124,58,237,0.4);
}
.roulette-window::before,
.roulette-window::after {
  content: '';
  position: absolute;
  top: 0; bottom: 0;
  width: 80px;
  z-index: 2;
  pointer-events: none;
}
.roulette-window::before { left: 0; background: linear-gradient(90deg, #0a0a18 15%, transparent); }
.roulette-window::after { right: 0; background: linear-gradient(270deg, #0a0a18 15%, transparent); }
.roulette-strip {
  display: flex;
  height: 100%;
  position: absolute;
  left: 0;
  top: 0;
  will-change: transform;
}
.roulette-item {
  width: 120px;
  height: 100%;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 8px 4px;
  border-right: 1px solid rgba(58,58,92,0.7);
  background: linear-gradient(180deg, var(--g1), var(--g2));
  position: relative;
  transition: transform .15s;
}
.roulette-item img {
  width: 64px;
  height: 64px;
  image-rendering: pixelated;
  filter: drop-shadow(0 3px 6px rgba(0,0,0,0.9)) drop-shadow(0 0 8px var(--rc));
}
.roulette-item .ri-name {
  font-family: 'Press Start 2P', monospace;
  font-size: 5px;
  color: #fff;
  text-align: center;
  margin-top: 6px;
  text-shadow: 1px 1px 0 #000;
  line-height: 1.5;
  height: 18px;
  overflow: hidden;
  width: 100%;
}
.roulette-item .ri-rarity {
  font-family: 'Press Start 2P', monospace;
  font-size: 5px;
  color: var(--rc);
  margin-top: 2px;
  text-shadow: 0 0 6px var(--rc);
  letter-spacing: .5px;
}
.roulette-item.tick { animation: itemTick .15s ease; }
@keyframes itemTick {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.08); }
}
.roulette-item.winner {
  animation: winnerPulse 1s ease-in-out infinite;
  z-index: 3;
}
@keyframes winnerPulse {
  0%,100% { transform: scale(1); filter: brightness(1); }
  50% { transform: scale(1.08); filter: brightness(1.3); }
}
.roulette-pointer {
  position: absolute;
  top: -8px; bottom: -8px;
  left: 50%;
  width: 4px;
  background: linear-gradient(180deg, transparent, var(--gold) 20%, #fff 50%, var(--gold) 80%, transparent);
  transform: translateX(-50%);
  z-index: 3;
  box-shadow: 0 0 25px var(--gold), 0 0 10px #fff;
  pointer-events: none;
}
.roulette-pointer::before,
.roulette-pointer::after {
  content: '';
  position: absolute;
  left: 50%;
  width: 18px;
  height: 18px;
  background: var(--gold);
  transform: translateX(-50%) rotate(45deg);
  box-shadow: 0 0 16px var(--gold), 0 0 6px #fff;
}
.roulette-pointer::before { top: -10px; }
.roulette-pointer::after { bottom: -10px; }

/* Reveal Card */
.reveal-card {
  position: absolute;
  width: 88vw;
  max-width: 280px;
  background: linear-gradient(160deg, var(--g1), var(--g2));
  border: 4px solid var(--rc);
  border-radius: 12px;
  padding: 24px 16px;
  text-align: center;
  box-shadow: 0 0 90px var(--rc), inset 0 0 50px rgba(255,255,255,0.08);
  display: none;
  z-index: 4;
}
.reveal-card.show {
  display: block;
  animation: cardReveal .7s cubic-bezier(.34,1.56,.64,1) forwards;
}
@keyframes cardReveal {
  0% { transform: perspective(800px) rotateY(180deg) scale(0.2); opacity: 0; }
  60% { transform: perspective(800px) rotateY(0deg) scale(1.1); opacity: 1; }
  100% { transform: perspective(800px) rotateY(0deg) scale(1); opacity: 1; }
}
.rc-pixel {
  width: 150px;
  height: 150px;
  margin: 0 auto 12px;
  image-rendering: pixelated;
  filter: drop-shadow(0 0 20px var(--rc)) drop-shadow(0 4px 8px rgba(0,0,0,0.8));
  animation: floatPx 2.5s ease-in-out infinite;
}
@keyframes floatPx {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}
.rc-rarity {
  font-family: 'Press Start 2P', monospace;
  font-size: 11px;
  color: var(--rc);
  letter-spacing: 3px;
  margin-bottom: 10px;
  text-shadow: 0 0 18px var(--rc);
  animation: pulseRarity 1s ease-in-out infinite;
}
@keyframes pulseRarity {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.65; }
}
.rc-name {
  font-family: 'Press Start 2P', monospace;
  font-size: 12px;
  color: #fff;
  letter-spacing: 1px;
  line-height: 1.8;
  margin-bottom: 12px;
  text-shadow: 2px 2px 0 rgba(0,0,0,0.9);
}
.rc-cps {
  color: var(--green);
  font-size: 26px;
  font-weight: bold;
  text-shadow: 0 0 14px rgba(74,222,128,0.7);
}

/* Particles */
.particle {
  position: absolute;
  width: 10px;
  height: 10px;
  pointer-events: none;
  z-index: 205;
  border-radius: 2px;
}
@keyframes particleFly {
  0% { opacity: 1; transform: translate(0,0) scale(1) rotate(0); }
  100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0) rotate(var(--rot)); }
}

/* Hint */
.reveal-hint {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  font-family: 'Press Start 2P', monospace;
  font-size: 8px;
  color: var(--muted);
  letter-spacing: 2px;
  text-align: center;
  opacity: 0;
  transition: opacity .3s;
  white-space: nowrap;
  z-index: 6;
}
.reveal-hint.show {
  opacity: 1;
  animation: hintBlink 1.4s ease-in-out infinite;
}
@keyframes hintBlink {
  0%, 100% { opacity: 0.5; }
  50% { opacity: 1; }
}

/* Pool Modal */
.pool-modal {
  position: fixed;
  inset: 0;
  z-index: 180;
  background: rgba(0,0,0,0.92);
  backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  opacity: 1;
  transition: opacity .25s;
}
.pool-modal.hidden { opacity: 0; pointer-events: none; }
.pool-content {
  background: var(--panel);
  border: 3px solid var(--line);
  border-radius: 10px;
  width: 100%;
  max-width: 620px;
  max-height: 88vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 0 60px rgba(124,58,237,0.5);
}
.pool-header {
  padding: 14px 16px;
  border-bottom: 2px solid var(--line);
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--panel2);
}
.pool-title {
  font-family: 'Press Start 2P', monospace;
  font-size: 11px;
  color: var(--gold);
  letter-spacing: 1px;
}
.pool-close {
  background: none;
  border: 2px solid var(--line);
  color: var(--text);
  font-size: 20px;
  width: 36px; height: 36px;
  border-radius: 4px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: monospace;
  touch-action: manipulation;
}
.pool-close:active { background: var(--red); border-color: var(--red); }
.pool-body { padding: 14px; overflow-y: auto; flex: 1; }
.pool-rarity { margin-bottom: 16px; }
.pool-rarity-head {
  font-family: 'Press Start 2P', monospace;
  font-size: 9px;
  letter-spacing: 1px;
  padding: 6px 0 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px dashed var(--line);
}
.pool-rarity-prob { color: var(--muted); font-size: 8px; }
.pool-skins {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
  gap: 8px;
  margin-top: 10px;
}
.pool-skin {
  background: var(--panel2);
  border: 1.5px solid var(--rc);
  border-radius: 4px;
  padding: 6px 4px;
  text-align: center;
}
.pool-skin img { width: 44px; height: 44px; image-rendering: pixelated; }
.pool-skin .psn {
  font-family: 'Press Start 2P', monospace;
  font-size: 5px;
  color: #fff;
  margin-top: 4px;
  line-height: 1.4;
}

/* Toast */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--panel2);
  color: var(--red);
  border: 2px solid var(--red);
  padding: 12px 18px;
  font-family: 'Press Start 2P', monospace;
  font-size: 8px;
  letter-spacing: 1px;
  opacity: 0;
  pointer-events: none;
  transition: all .25s;
  z-index: 250;
  border-radius: 4px;
  box-shadow: 0 0 30px rgba(248,113,113,0.5);
  max-width: 90vw;
  text-align: center;
  line-height: 1.6;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.empty-msg {
  grid-column: 1/-1;
  color: var(--muted);
  padding: 30px 20px;
  text-align: center;
  font-size: 18px;
}

/* Responsive */
@media (max-width: 600px) {
  .logo { font-size: 9px; }
  .stat-box { min-width: 75px; padding: 3px 8px; }
  .stat-value { font-size: 18px; }
  .tab { font-size: 7px; padding: 8px 10px; }
  .box-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .inv-grid, .collection-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
  .box-name { font-size: 7px; }
  .box-pixel { width: 70px; height: 70px; }
  .box { min-height: 200px; padding: 12px 8px; }
  .box-cost { font-size: 18px; }
  .skin-pixel { width: 52px; height: 52px; }
  .skin-name { font-size: 5px; }
  .rc-pixel { width: 110px; height: 110px; }
  .roulette-item { width: 100px; }
  .roulette-item img { width: 56px; height: 56px; }
}
@media (max-width: 380px) {
  .box-grid { grid-template-columns: repeat(2, 1fr); }
  .inv-grid, .collection-grid { grid-template-columns: repeat(3, 1fr); }
}
</style>
</head>

<script>
'use strict';

/* ============================================================
   SPRITE SYSTEM — 64x64 procedural pixel art
============================================================ */
const SPRITE_CACHE = {};

// Drawing primitives (pixel-perfect)
function spRect(ctx, x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x | 0, y | 0, w | 0, h | 0);
}
function spEllipse(ctx, cx, cy, rx, ry, color) {
  ctx.fillStyle = color;
  for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++) {
    for (let x = Math.floor(cx - rx); x <= Math.ceil(cx + rx); x++) {
      const dx = (x + 0.5 - cx) / (rx + 0.1);
      const dy = (y + 0.5 - cy) / (ry + 0.1);
      if (dx * dx + dy * dy <= 1) ctx.fillRect(x, y, 1, 1);
    }
  }
}
function spCircle(ctx, cx, cy, r, color) {
  spEllipse(ctx, cx, cy, r, r, color);
}
function spTriangle(ctx, x1, y1, x2, y2, x3, y3, color) {
  ctx.fillStyle = color;
  const minY = Math.floor(Math.min(y1, y2, y3));
  const maxY = Math.ceil(Math.max(y1, y2, y3));
  const edges = [[x1,y1,x2,y2],[x2,y2,x3,y3],[x3,y3,x1,y1]];
  for (let y = minY; y <= maxY; y++) {
    const hits = [];
    for (const [ax, ay, bx, by] of edges) {
      if ((ay <= y && by > y) || (by <= y && ay > y)) {
        hits.push(ax + ((y - ay) / (by - ay)) * (bx - ax));
      }
    }
    if (hits.length >= 2) {
      hits.sort((a, b) => a - b);
      const xs = Math.ceil(hits[0]);
      const xe = Math.floor(hits[hits.length - 1]);
      for (let x = xs; x <= xe; x++) ctx.fillRect(x, y, 1, 1);
    }
  }
}

// ============ TEMPLATES ============

// Blob (rock slime)
function drawBlob(ctx, c) {
  spEllipse(ctx, 32, 42, 26, 20, c.outline);
  spEllipse(ctx, 32, 42, 24, 18, c.dark);
  spEllipse(ctx, 32, 40, 22, 16, c.mid);
  spEllipse(ctx, 30, 36, 16, 11, c.light);
  spEllipse(ctx, 26, 32, 6, 4, c.shine);
  // Eyes
  spCircle(ctx, 24, 40, 4, c.outline);
  spCircle(ctx, 40, 40, 4, c.outline);
  spCircle(ctx, 24, 40, 3, c.eye);
  spCircle(ctx, 40, 40, 3, c.eye);
  spCircle(ctx, 25, 39, 1, '#fff');
  spCircle(ctx, 41, 39, 1, '#fff');
  // Mouth
  spRect(ctx, 30, 46, 4, 1, c.outline);
  spRect(ctx, 29, 47, 6, 1, c.outline);
  // Texture
  spRect(ctx, 16, 38, 2, 2, c.dark);
  spRect(ctx, 46, 44, 2, 2, c.dark);
  spRect(ctx, 32, 32, 1, 1, c.shine);
}

// Quadruped (fox, wolf, tiger)
function drawQuadruped(ctx, c, opts) {
  // Tail
  if (opts.tail) {
    spEllipse(ctx, 52, 46, 8, 5, c.outline);
    spEllipse(ctx, 52, 46, 6, 4, c.mid);
    spEllipse(ctx, 54, 44, 3, 2, c.light);
  }
  // Body
  spEllipse(ctx, 32, 46, 18, 11, c.outline);
  spEllipse(ctx, 32, 46, 16, 9, c.mid);
  spEllipse(ctx, 28, 42, 9, 5, c.light);
  // Legs
  spRect(ctx, 18, 52, 5, 10, c.outline);
  spRect(ctx, 18, 52, 4, 9, c.dark);
  spRect(ctx, 42, 52, 5, 10, c.outline);
  spRect(ctx, 42, 52, 4, 9, c.dark);
  spRect(ctx, 24, 54, 4, 8, c.outline);
  spRect(ctx, 24, 54, 3, 7, c.dark);
  spRect(ctx, 38, 54, 4, 8, c.outline);
  spRect(ctx, 38, 54, 3, 7, c.dark);
  // Head
  spEllipse(ctx, 32, 26, 15, 14, c.outline);
  spEllipse(ctx, 32, 26, 13, 12, c.mid);
  spEllipse(ctx, 28, 22, 8, 6, c.light);
  // Ears
  if (opts.ears === 'pointy') {
    spTriangle(ctx, 18, 22, 14, 8, 26, 18, c.outline);
    spTriangle(ctx, 19, 20, 16, 10, 25, 18, c.mid);
    spTriangle(ctx, 18, 20, 16, 12, 23, 18, c.accent);
    spTriangle(ctx, 46, 22, 50, 8, 38, 18, c.outline);
    spTriangle(ctx, 45, 20, 48, 10, 39, 18, c.mid);
    spTriangle(ctx, 46, 20, 48, 12, 41, 18, c.accent);
  }
  // Face
  spEllipse(ctx, 32, 32, 10, 7, c.light);
  spEllipse(ctx, 32, 34, 6, 4, c.shine);
  spCircle(ctx, 24, 28, 4, c.outline);
  spCircle(ctx, 40, 28, 4, c.outline);
  spCircle(ctx, 24, 28, 3, c.eye);
  spCircle(ctx, 40, 28, 3, c.eye);
  spCircle(ctx, 25, 27, 1, '#fff');
  spCircle(ctx, 41, 27, 1, '#fff');
  // Nose
  spRect(ctx, 30, 34, 4, 2, c.nose);
  spRect(ctx, 31, 36, 2, 1, c.outline);
  // Stripes
  if (opts.stripes) {
    for (let i = 0; i < 3; i++) {
      spRect(ctx, 16 + i * 3, 22 + i, 2, 3, c.accent);
      spRect(ctx, 46 - i * 3, 22 + i, 2, 3, c.accent);
    }
    for (let i = 0; i < 2; i++) {
      spRect(ctx, 24 + i * 8, 42, 3, 6, c.accent);
      spRect(ctx, 22 + i * 10, 48, 3, 5, c.accent);
    }
  }
}

// Bird (owl, eagle)
function drawBird(ctx, c, opts) {
  // Wings
  spTriangle(ctx, 4, 40, 16, 30, 16, 52, c.outline);
  spTriangle(ctx, 6, 40, 16, 32, 16, 50, c.dark);
  spTriangle(ctx, 60, 40, 48, 30, 48, 52, c.outline);
  spTriangle(ctx, 58, 40, 48, 32, 48, 50, c.dark);
  // Body
  spEllipse(ctx, 32, 42, 16, 14, c.outline);
  spEllipse(ctx, 32, 42, 14, 12, c.mid);
  spEllipse(ctx, 30, 40, 9, 8, c.light);
  spEllipse(ctx, 26, 36, 4, 3, c.shine);
  // Chest pattern
  for (let i = 0; i < 3; i++) {
    for (let j = 0; j < 2; j++) {
      spRect(ctx, 24 + i * 6, 44 + j * 4, 3, 2, c.dark);
    }
  }
  // Head
  spEllipse(ctx, 32, 22, 14, 13, c.outline);
  spEllipse(ctx, 32, 22, 12, 11, c.mid);
  spEllipse(ctx, 28, 18, 7, 5, c.light);
  // Ear tufts
  spTriangle(ctx, 20, 14, 18, 4, 26, 12, c.outline);
  spTriangle(ctx, 20, 13, 19, 6, 25, 12, c.mid);
  spTriangle(ctx, 44, 14, 46, 4, 38, 12, c.outline);
  spTriangle(ctx, 44, 13, 45, 6, 39, 12, c.mid);
  // Eyes
  spCircle(ctx, 24, 22, 6, c.outline);
  spCircle(ctx, 40, 22, 6, c.outline);
  spCircle(ctx, 24, 22, 5, '#fff');
  spCircle(ctx, 40, 22, 5, '#fff');
  spCircle(ctx, 24, 22, 3, c.eye);
  spCircle(ctx, 40, 22, 3, c.eye);
  spCircle(ctx, 25, 21, 1, '#fff');
  spCircle(ctx, 41, 21, 1, '#fff');
  // Beak
  if (opts.beak === 'hooked') {
    spTriangle(ctx, 29, 30, 35, 30, 32, 38, c.accent);
    spTriangle(ctx, 31, 32, 33, 32, 32, 36, c.dark);
  } else {
    spTriangle(ctx, 30, 30, 34, 30, 32, 34, c.accent);
  }
  // Feet
  spRect(ctx, 24, 56, 3, 4, c.accent);
  spRect(ctx, 37, 56, 3, 4, c.accent);
}

// Bunny
function drawBunny(ctx, c) {
  // Body
  spEllipse(ctx, 32, 44, 16, 14, c.outline);
  spEllipse(ctx, 32, 44, 14, 12, c.mid);
  spEllipse(ctx, 30, 40, 9, 7, c.light);
  // Tail
  spCircle(ctx, 48, 46, 6, c.outline);
  spCircle(ctx, 48, 46, 5, c.shine);
  // Legs
  spEllipse(ctx, 24, 54, 4, 3, c.dark);
  spEllipse(ctx, 40, 54, 4, 3, c.dark);
  // Head
  spEllipse(ctx, 32, 26, 14, 13, c.outline);
  spEllipse(ctx, 32, 26, 12, 11, c.mid);
  spEllipse(ctx, 28, 22, 7, 5, c.light);
  // Ears
  spEllipse(ctx, 22, 12, 3, 10, c.outline);
  spEllipse(ctx, 22, 12, 2, 8, c.mid);
  spEllipse(ctx, 22, 12, 1, 6, c.shine);
  spEllipse(ctx, 42, 12, 3, 10, c.outline);
  spEllipse(ctx, 42, 12, 2, 8, c.mid);
  spEllipse(ctx, 42, 12, 1, 6, c.shine);
  // Face
  spEllipse(ctx, 32, 32, 8, 5, c.shine);
  spCircle(ctx, 25, 26, 3, c.outline);
  spCircle(ctx, 39, 26, 3, c.outline);
  spCircle(ctx, 25, 26, 2, c.eye);
  spCircle(ctx, 39, 26, 2, c.eye);
  spCircle(ctx, 26, 25, 1, '#fff');
  spCircle(ctx, 40, 25, 1, '#fff');
  spRect(ctx, 30, 32, 4, 2, c.accent);
}

// Beetle
function drawBeetle(ctx, c) {
  // Antennae
  spRect(ctx, 20, 8, 1, 8, c.outline);
  spRect(ctx, 20, 8, 4, 2, c.outline);
  spRect(ctx, 43, 8, 1, 8, c.outline);
  spRect(ctx, 40, 8, 4, 2, c.outline);
  spCircle(ctx, 24, 8, 2, c.accent);
  spCircle(ctx, 40, 8, 2, c.accent);
  // Legs
  for (let side = 0; side < 2; side++) {
    const sx = side ? 46 : 18;
    const dir = side ? 1 : -1;
    spRect(ctx, sx, 30, 4 * dir > 0 ? 4 : -4, 3, c.outline);
    spRect(ctx, sx, 40, 4 * dir > 0 ? 4 : -4, 3, c.outline);
    spRect(ctx, sx, 50, 4 * dir > 0 ? 4 : -4, 3, c.outline);
  }
  // Body
  spEllipse(ctx, 32, 36, 18, 22, c.outline);
  spEllipse(ctx, 32, 36, 16, 20, c.dark);
  spEllipse(ctx, 32, 34, 14, 16, c.mid);
  spEllipse(ctx, 30, 30, 9, 10, c.light);
  // Wing line
  spRect(ctx, 31, 20, 2, 30, c.outline);
  // Spots
