<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Klangformer – Rainbow Rush</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', system-ui, sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 0; left: 0; right: 0; padding: 20px 24px;
    display: flex; justify-content: space-between; align-items: flex-start;
    pointer-events: none; z-index: 10;
  }
  .box {
    background: rgba(15,0,30,0.7);
    border: 2px solid;
    border-image: linear-gradient(135deg, #ff00cc, #00ffff, #ffff00) 1;
    border-radius: 14px;
    padding: 8px 18px;
    backdrop-filter: blur(10px);
    box-shadow: 0 0 35px rgba(255,0,255,0.5), inset 0 0 15px rgba(0,255,255,0.2);
  }
  .label { font-size: 10px; letter-spacing: 3px; color: #ffee88; margin-bottom: 2px; font-weight: 700; }
  #score { font-size: 28px; font-weight: 900; background: linear-gradient(90deg, #ff00cc, #ffff00, #00ffff); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  #combo { font-size: 28px; font-weight: 900; color: #ff66ff; text-shadow: 0 0 15px #ff00ff; }
  #lives { font-size: 22px; letter-spacing: 3px; color: #ff2266; text-shadow: 0 0 12px #ff0055; }
  #combo-box { opacity: 0; transition: opacity 0.2s; }
  #combo-box.active { opacity: 1; }
  #pattern-tag {
    position: fixed; top: 88px; left: 50%; transform: translateX(-50%);
    font-size: 12px; letter-spacing: 4px; color: #00ffff; font-weight: 800;
    text-shadow: 0 0 12px #00ffff; pointer-events: none; z-index: 10;
    opacity: 0.85;
  }
  #flash {
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background: radial-gradient(circle, transparent 30%, rgba(255,40,120,0.7) 100%);
    opacity: 0; transition: opacity 0.15s;
  }
  #perfect-flash {
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background: radial-gradient(circle, rgba(255,255,255,0.9), rgba(255,240,100,0.6) 30%, rgba(255,0,220,0.4) 70%, transparent 90%);
    opacity: 0; transition: opacity 0.1s;
  }
  #start-screen, #game-over {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    background: radial-gradient(circle at 50% 50%, #330066, #000011 70%);
    color: #fff; z-index: 20; text-align: center; padding: 20px;
  }
  #start-screen h1, #game-over h1 {
    font-size: 56px; font-weight: 900; letter-spacing: 6px;
    background: linear-gradient(135deg, #ff00cc, #ffff00, #00ffcc, #00aaff, #ff00cc);
    background-size: 300% 300%;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 12px;
    animation: rainbowShift 3s linear infinite;
    filter: drop-shadow(0 0 35px rgba(255,0,200,0.8));
  }
  @keyframes rainbowShift {
    0% { background-position: 0% 50%; }

  }
  #start-screen p, #game-over p { color: #ddbbff; margin: 6px 0; font-size: 15px; }
  .key { display: inline-block; background: linear-gradient(135deg, #4422aa, #ff00cc); padding: 4px 12px; border-radius: 8px; font-family: monospace; color: #fff; margin: 0 3px; font-weight: 700; box-shadow: 0 0 15px rgba(255,0,200,0.6); }

    background-size: 300% 300%;

    letter-spacing: 4px; box-shadow: 0 0 45px rgba(255,0,200,0.8), 0 0 90px rgba(0,200,255,0.5);
    transition: transform 0.15s; font-family: inherit;

  button:hover { transform: scale(1.08); }

  .hidden { display: none !important; }
  #combo-popup {

    filter: drop-shadow(0 0 30px currentColor);
    letter-spacing: 4px;
  }
  #miss-popup {
    position: fixed; top: 35%; left: 50%; transform: translate(-50%, -50%);
    font-size: 64px; font-weight: 900; font-style: italic;
    pointer-events: none; z-index: 6; opacity: 0;
    color: #ff2244; -webkit-text-stroke: 2px #fff;
    filter: drop-shadow(0 0 35px #ff0055);

<script type="module">
import * as THREE from 'three';

// ============ TIMING / CONFIG ============
const BPM = 138;
const BEAT_DUR = 60 / BPM;           // ~0.434s
const STEP_DUR = BEAT_DUR / 4;       // 16th note
const APPROACH_BEATS = 2.5;
const APPROACH_SEC = BEAT_DUR * APPROACH_BEATS;
const HIT_WINDOW_SEC = 0.22;
const PERFECT_WINDOW_SEC = 0.09;
const MISS_WINDOW_SEC = 0.18;
const RING_START_STEP = 16;          // 1 bar intro
const SPAWN_Z = -52;
const ONE = new THREE.Vector3(1, 1, 1);

const CHORDS = [
  [64, 67, 71],  // Em
  [60, 64, 67],  // C
  [67, 71, 74],  // G
  [62, 66, 69],  // D
];
const BASS_ROOTS = [40, 36, 43, 38];

const BAR_PATTERNS = [
  ['M', null, null, null, 'M', null, null, null, 'M', null, null, null, 'M', null, 'S', null],
  ['M', null, null, 'S',  null, null, 'M', null, 'M', null, 'S', null,  'M', null, null, null],
  ['M', null, 'S', null,  'M', null, 'S', null,  'M', null, 'S', null,  'M', 'S', 'S', null],
  ['M', null, null, null, 'M', null, 'S', 'S',   'M', null, null, null, null, null, 'S', 'S'],
];

const PHASE_NAMES = [
  'PHASE 1 // STEADY PULSE',
  'PHASE 2 // OFFBEAT SYNC',
  'PHASE 3 // RUSH ARPEGGIO',
  'PHASE 4 // HYPER DROP'
];

// ============ STATE ============
let audioCtx = null;
let music = null;

const state = {
  score: 0, combo: 0, bestCombo: 0, lives: 5, beatsHit: 0,
  running: false,
  rings: [], particles: [], shockwaves: [],
  shakeAmount: 0,
  stepIndexToSpawn: 0,
  lastBeatIndex: -1,
};

// ============ SCENE ============
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0018);
scene.fog = new THREE.FogExp2(0x0b0018, 0.014);

const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 250);
const camBase = new THREE.Vector3(0, 4.3, 9.5);
camera.position.copy(camBase);
camera.lookAt(0, 1.05, -16);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

// Lights (disco rig)
scene.add(new THREE.AmbientLight(0x7744aa, 1.2));
const light1 = new THREE.PointLight(0xff00cc, 4.5, 90);
light1.position.set(8, 8, 4); scene.add(light1);
const light2 = new THREE.PointLight(0x00ffff, 4.5, 90);
light2.position.set(-8, 6, -4); scene.add(light2);
const light3 = new THREE.PointLight(0xffff00, 3.5, 90);
light3.position.set(0, 10, -10); scene.add(light3);
const light4 = new THREE.PointLight(0x00ff88, 3.5, 90);
light4.position.set(6, 5, -15); scene.add(light4);

// Track rails
const laneMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.3 });
const leftRail = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.05, 120), laneMat);
leftRail.position.set(-2.3, 0.02, -40);
scene.add(leftRail);
const rightRail = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.05, 120), laneMat);
rightRail.position.set(2.3, 0.02, -40);
scene.add(rightRail);

// Floor grid
const grid = new THREE.GridHelper(200, 100, 0xff00cc, 0x0055dd);
grid.material.opacity = 0.3;
grid.material.transparent = true;
scene.add(grid);

const floorGlow = new THREE.Mesh(
  new THREE.CircleGeometry(30, 64),
  new THREE.MeshBasicMaterial({ color: 0xff00aa, transparent: true, opacity: 0.16, blending: THREE.AdditiveBlending })
);
floorGlow.rotation.x = -Math.PI / 2;
floorGlow.position.y = 0.01;
scene.add(floorGlow);

const floorRing = new THREE.Mesh(
  new THREE.RingGeometry(3, 3.5, 64),
  new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8, side: THREE.DoubleSide, blending: THREE.AdditiveBlending })
);
floorRing.rotation.x = -Math.PI / 2;
floorRing.position.y = 0.02;
scene.add(floorRing);

// TARGET GATE
const targetGate = new THREE.Mesh(
  new THREE.TorusGeometry(2.15, 0.07, 12, 64),
  new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9 })
);
targetGate.position.set(0, 1.05, 0);
scene.add(targetGate);

const targetOuterHalo = new THREE.Mesh(
  new THREE.TorusGeometry(2.35, 0.035, 8, 64),
  new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending })
);
targetOuterHalo.position.set(0, 1.05, 0);
scene.add(targetOuterHalo);

// Player ball
const ball = new THREE.Mesh(
  new THREE.IcosahedronGeometry(0.9, 2),
  new THREE.MeshStandardMaterial({
    color: 0xffffff, emissive: 0xff00ff, emissiveIntensity: 2.8,
    metalness: 0.5, roughness: 0.15,
  })
);
ball.position.set(0, 1.05, 0);
scene.add(ball);

const ballGlow = new THREE.Mesh(
  new THREE.SphereGeometry(1.8, 20, 20),
  new THREE.MeshBasicMaterial({ color: 0xff44ff, transparent: true, opacity: 0.28, blending: THREE.AdditiveBlending })
);
ball.add(ballGlow);

// Star field
const starsGeo = new THREE.BufferGeometry();
const starCount = 1000;
const starPos = new Float32Array(starCount * 3);
const starCol = new Float32Array(starCount * 3);
for (let i = 0; i < starCount; i++) {
  starPos[i * 3]     = (Math.random() - 0.5) * 240;
  starPos[i * 3 + 1] = Math.random() * 60 + 4;
  starPos[i * 3 + 2] = (Math.random() - 0.5) * 240;
  const col = new THREE.Color().setHSL(Math.random(), 1, 0.7);
  starCol[i * 3]     = col.r;
  starCol[i * 3 + 1] = col.g;
  starCol[i * 3 + 2] = col.b;
}
starsGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
starsGeo.setAttribute('color', new THREE.BufferAttribute(starCol, 3));
const stars = new THREE.Points(starsGeo,
  new THREE.PointsMaterial({ size: 0.38, vertexColors: true, transparent: true, opacity: 0.85 }));
scene.add(stars);

// ============ MUSIC ENGINE ============
class Music {
  constructor(ctx) {
    this.ctx = ctx;
    this.master = ctx.createGain();
    this.master.gain.setValueAtTime(0.5, ctx.currentTime);

    const delay = ctx.createDelay(1);
    delay.delayTime.value = BEAT_DUR * 0.75;
    const fb = ctx.createGain();
    fb.gain.value = 0.28;
    const wet = ctx.createGain();
    wet.gain.value = 0.25;

    this.master.connect(ctx.destination);
    this.master.connect(delay);
    delay.connect(fb);
    fb.connect(delay);
    delay.connect(wet);
    wet.connect(ctx.destination);

    this.step = 0;
    this.startTime = 0;
    this.nextStepTime = 0;
    this.isPlaying = false;
    this.timer = null;
  }

  start() {
    this.startTime = this.ctx.currentTime + 0.15;
    this.nextStepTime = this.startTime;
    this.step = 0;
    this.isPlaying = true;
    this.schedule();
  }

  stop() {
    this.isPlaying = false;
    if (this.timer) clearTimeout(this.timer);
    const t = this.ctx.currentTime;
    this.master.gain.cancelScheduledValues(t);
    this.master.gain.setValueAtTime(this.master.gain.value, t);
    this.master.gain.linearRampToValueAtTime(0.0001, t + 0.35);
  }

  schedule() {
    if (!this.isPlaying) return;
    while (this.nextStepTime < this.ctx.currentTime + 0.25) {
      this.playStep(this.step, this.nextStepTime);
      this.nextStepTime += STEP_DUR;
      this.step++;
    }
    this.timer = setTimeout(() => this.schedule(), 25);
  }

  playStep(step, t) {
    const bar = Math.floor(step / 16) % 4;
    const s = step % 16;
    const chord = CHORDS[bar];
    const root = BASS_ROOTS[bar];
    const phrase = Math.floor(step / 64);

    if (s === 0 || s === 8) this.kick(t, 1.1);
    if (s === 6 || s === 14) this.kick(t, 0.8);
    if (s === 4 || s === 12) this.snare(t);
    if (s % 2 === 0) this.hihat(t, s % 4 === 0 ? 0.35 : 0.18);
    if (s === 10) this.hihat(t, 0.16, 0.16);

    if (s % 4 === 0) this.bass(root, t, 0.4);
    if (s === 6 || s === 14) this.bass(root + 12, t, 0.25);

    const arpPattern = [0, 1, 2, 1];
    const arpNote = chord[arpPattern[s % 4]] + 12 + (phrase % 2 === 0 ? 0 : 12);
    this.lead(arpNote, t, 0.12, 'triangle');

    if (s === 0) this.lead(chord[0] + 24, t, 0.16, 'sawtooth');
    if (s === 3 || s === 10 || s === 14) this.lead(chord[2] + 24, t, 0.13, 'sawtooth');
    if (s === 8 && (phrase % 2 === 1)) this.lead(chord[1] + 24, t, 0.14, 'sawtooth');
    if (s === 0 && phrase % 2 === 0) this.lead(chord[0] + 36, t, 0.07, 'sine');
  }

  kick(t, vol = 1) {
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.frequency.setValueAtTime(170, t);
    o.frequency.exponentialRampToValueAtTime(40, t + 0.1);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
    o.connect(g).connect(this.master);
    o.start(t);
    o.stop(t + 0.22);
  }

  snare(t) {
    const buf = this.ctx.createBuffer(1, Math.floor(this.ctx.sampleRate * 0.16), this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    const f = this.ctx.createBiquadFilter();
    f.type = 'highpass';
    f.frequency.value = 1200;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.45, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
    src.connect(f).connect(g).connect(this.master);
    src.start(t);
    src.stop(t + 0.16);
  }

  hihat(t, vol, decay = 0.045) {
    const buf = this.ctx.createBuffer(1, Math.floor(this.ctx.sampleRate * decay), this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    const f = this.ctx.createBiquadFilter();
    f.type = 'highpass';
    f.frequency.value = 7000;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + decay);
    src.connect(f).connect(g).connect(this.master);
    src.start(t);
  }

  bass(midi, t, vol) {
    const freq = 440 * Math.pow(2, (midi - 69) / 12);
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    const f = this.ctx.createBiquadFilter();
    o.type = 'sawtooth';
    o.frequency.value = freq;
    f.type = 'lowpass';
    f.frequency.value = 700;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
    o.connect(f).connect(g).connect(this.master);
    o.start(t);
    o.stop(t + 0.22);
  }

  lead(midi, t, vol, type = 'triangle') {
    const freq = 440 * Math.pow(2, (midi - 69) / 12);
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
    o.connect(g).connect(this.master);
    o.start(t);
    o.stop(t + 0.12);
  }

  stepTimeOf(stepIndex) {
    return this.startTime + stepIndex * STEP_DUR;
  }
}

// ============ UI ============
const ui = {
  score: document.getElementById('score'),
  combo: document.getElementById('combo'),
  comboBox: document.getElementById('combo-box'),
  lives: document.getElementById('lives'),
  patternTag: document.getElementById('pattern-tag'),
  flash: document.getElementById('flash'),
  perfectFlash: document.getElementById('perfect-flash'),
  comboPopup: document.getElementById('combo-popup'),
  missPopup: document.getElementById('miss-popup'),
  startScreen: document.getElementById('start-screen'),
  gameOver: document.getElementById('game-over'),
  finalScore: document.getElementById('final-score'),
  finalCombo: document.getElementById('final-combo'),
  finalBeat: document.getElementById('final-beat'),
};

function updateUI() {
  ui.score.textContent = state.score;
  ui.combo.textContent = 'x' + state.combo;
  ui.comboBox.classList.toggle('active', state.combo > 1);
  ui.lives.textContent = '♥'.repeat(Math.max(0, state.lives)) || '—';
}
function flash(kind) {
  if (kind === 'perfect') {
    ui.perfectFlash.style.opacity = '0.95';
    setTimeout(() => ui.perfectFlash.style.opacity = '0', 130);
  } else {
    ui.flash.style.opacity = '0.95';
    setTimeout(() => ui.flash.style.opacity = '0', 200);
  }
}
function showPopup(el, text, color) {
  el.textContent = text;
  el.style.color = color;
  el.style.transition = 'none';
  el.style.opacity = '1';
  el.style.transform = 'translate(-50%, -50%) scale(0.6)';
  void el.offsetHeight;
  el.style.transition = 'all 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28)';
  el.style.transform = 'translate(-50%, -150%) scale(1.4)';
  el.style.opacity = '0';
}

// ============ SPAWN & EFFECTS ============
function spawnRing(crossTime, stepIndex, noteType) {
  const isSync = noteType === 'S';
  const hue = (stepIndex * 19 + (isSync ? 140 : 0)) % 360;
  const color = new THREE.Color().setHSL(hue / 360, 1, 0.6);

  const radialSegs = isSync ? 4 : 48;
  const radius = isSync ? 1.85 : 2.15;
  const tube = isSync ? 0.17 : 0.22;

  const geo = new THREE.TorusGeometry(radius, tube, 12, radialSegs);
  const mat = new THREE.MeshStandardMaterial({
    color, emissive: color, emissiveIntensity: 2.2,
    transparent: true, opacity: 1,
  });
  const ring = new THREE.Mesh(geo, mat);

  const outlineGeo = new THREE.TorusGeometry(radius, tube + 0.08, 8, radialSegs);
  const outlineMat = new THREE.MeshBasicMaterial({
    color: 0x050010, transparent: true, opacity: 0.8, side: THREE.BackSide
  });
  const outline = new THREE.Mesh(outlineGeo, outlineMat);
  ring.add(outline);

  if (isSync) ring.rotation.z = Math.PI / 4;

  ring.position.set(0, 1.05, SPAWN_Z);
  ring.userData = {
    crossTime, stepIndex, noteType, resolved: false, fadeTime: 0,
    baseColor: color.clone(), hue, outlineMat
  };
  scene.add(ring);
  state.rings.push(ring);
}

function burst(pos, colorHex, count, speed, size = 0.32) {
  const geo = new THREE.BufferGeometry();
  const posArr = new Float32Array(count * 3);
  const vel = [];
  for (let i = 0; i < count; i++) {
    posArr[i * 3] = pos.x;
    posArr[i * 3 + 1] = pos.y;
    posArr[i * 3 + 2] = pos.z;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const v = speed * (0.5 + Math.random() * 0.8);
    vel.push({
      vx: Math.sin(phi) * Math.cos(theta) * v * 1.4,
      vy: Math.cos(phi) * v + 5,
      vz: Math.sin(phi) * Math.sin(theta) * v * 0.8,
    });
  }
  geo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
  const mat = new THREE.PointsMaterial({
    color: colorHex, size, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending,
  });
  const points = new THREE.Points(geo, mat);
  scene.add(points);
  state.particles.push({ points, velocities: vel, life: 1, positions: posArr });
}

function shockwave(colorHex, radiusStart = 1.5, radiusEnd = 16, dur = 0.5) {
  const geo = new THREE.RingGeometry(radiusStart, radiusStart + 0.6, 48);
  const mat = new THREE.MeshBasicMaterial({
    color: colorHex, transparent: true, opacity: 0.9, side: THREE.DoubleSide, blending: THREE.AdditiveBlending,
  });
  const m = new THREE.Mesh(geo, mat);
  m.position.set(0, 1.05, 0);
  m.rotation.x = -Math.PI / 2;
  scene.add(m);
  state.shockwaves.push({ mesh: m, life: 1, dur, radiusEnd, radiusStart });
}

function resolveRing(ring, quality) {
  if (ring.userData.resolved) return;
  ring.userData.resolved = true;
  const pos = ring.position.clone();
  const col = ring.userData.baseColor;

  if (quality === 'perfect') {
    state.combo++;
    state.bestCombo = Math.max(state.bestCombo, state.combo);
    state.score += 100 * state.combo;
    state.beatsHit++;
    playHit(true, state.combo);
    flash('perfect');
    showPopup(ui.comboPopup, 'PERFECT!', '#ffff44');
    
    // Dopamine overload: multiple particle bursts & dual shockwaves
    for (let i = 0; i < 6; i++) {
      const hue = (performance.now() / 4 + i * 60) % 360;
      const c = new THREE.Color().setHSL(hue / 360, 1, 0.65).getHex();
      burst(pos, c, 18, 35, 0.38);
    }
    shockwave(0xffffff, 1.5, 22, 0.55);
    shockwave(col.getHex(), 1.5, 32, 0.75);
    targetGate.scale.setScalar(1.35);
    state.shakeAmount = 14; // High dopamine screen rumble
    ball.material.emissiveIntensity = 8.5;
  } else if (quality === 'good') {
    state.combo++;
    state.bestCombo = Math.max(state.bestCombo, state.combo);
    state.score += 50 * state.combo;
    state.beatsHit++;
    playHit(false, state.combo);
    showPopup(ui.comboPopup, 'GOOD', '#44ffff');
    burst(pos, col.getHex(), 28, 22, 0.32);
    shockwave(col.getHex(), 1.5, 15, 0.45);
    targetGate.scale.setScalar(1.2);
    state.shakeAmount = 6;
    ball.material.emissiveIntensity = 5.5;
  } else if (quality === 'miss') {
    state.combo = 0;
    state.lives--;
    playMiss();
    flash('miss');
    showPopup(ui.missPopup, 'MISS!', '#ff2244');
    state.shakeAmount = 20;
    if (state.lives <= 0) gameOver();
  }
  updateUI();
}

// ============ AUDIO SFX ============
function initAudio() {
  const AudioContextClass = window.AudioContext || window.webkitAudioContext;
  if (!audioCtx) {
    audioCtx = new AudioContextClass();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  // Unlock audio context for mobile/desktop browsers
  const buffer = audioCtx.createBuffer(1, 1, 22050);
  const source = audioCtx.createBufferSource();
  source.buffer = buffer;
  source.connect(audioCtx.destination);
  source.start(0);
}

function playHit(perfect, combo) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const base = perfect ? 920 : 680;
  const freq = base * Math.pow(2, Math.min(combo, 12) / 12);
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = perfect ? 'triangle' : 'sine';
  o.frequency.setValueAtTime(freq, t);
  o.frequency.exponentialRampToValueAtTime(freq * 1.6, t + 0.09);
  g.gain.setValueAtTime(perfect ? 0.16 : 0.12, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
  o.connect(g).connect(audioCtx.destination);
  o.start(t);
  o.stop(t + 0.2);

  if (perfect) {
    const o2 = audioCtx.createOscillator();
    const g2 = audioCtx.createGain();
    o2.type = 'sine';
    o2.frequency.value = freq * 1.5;
    g2.gain.setValueAtTime(0.13, t + 0.04);
    g2.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
    o2.connect(g2).connect(audioCtx.destination);
    o2.start(t + 0.04);
    o2.stop(t + 0.24);
  }
}

function playMiss() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain(); // Bug fixed: audioCtx instead of this.audioCtx
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(180, t);
  o.frequency.exponentialRampToValueAtTime(50, t + 0.35);
  g.gain.setValueAtTime(0.2, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
  o.connect(g).connect(audioCtx.destination);
  o.start(t);
  o.stop(t + 0.42);
}

// ============ INPUT ============
function handlePress() {
  if (!state.running) return;
  initAudio();
  const t = audioCtx.currentTime;
  let best = null, bestDist = Infinity;
  for (const ring of state.rings) {
    if (ring.userData.resolved) continue;
    const d = Math.abs(t - ring.userData.crossTime);
    if (d < HIT_WINDOW_SEC && d < bestDist) { best = ring; bestDist = d; }
  }
  if (best) {
    resolveRing(best, bestDist < PERFECT_WINDOW_SEC ? 'perfect' : 'good');
  } else {
    state.shakeAmount = Math.max(state.shakeAmount, 2.5);
  }
}

// ============ GAME FLOW ============
function startGame() {
  initAudio();
  if (music) music.stop();
  music = new Music(audioCtx);

  // Cleanup old entities
  for (const r of state.rings) { scene.remove(r); r.geometry.dispose(); r.material.dispose(); }
  state.rings = [];
  for (const p of state.particles) { scene.remove(p.points); p.points.geometry.dispose(); p.points.material.dispose(); }
  state.particles = [];
  for (const s of state.shockwaves) { scene.remove(s.mesh); s.mesh.geometry.dispose(); s.mesh.material.dispose(); }
  state.shockwaves = [];

  Object.assign(state, {
    score: 0, combo: 0, bestCombo: 0, lives: 5, beatsHit: 0,
    running: true, shakeAmount: 0,
    stepIndexToSpawn: RING_START_STEP,
    lastBeatIndex: -1,
  });
  camera.position.copy(camBase);

  music.start();
  ui.startScreen.classList.add('hidden');
  ui.gameOver.classList.add('hidden');
  updateUI();
}

function gameOver() {
  state.running = false;
  if (music) music.stop();
  ui.finalScore.textContent = state.score;
  ui.finalCombo.textContent = 'Best combo: x' + state.bestCombo;
  ui.finalBeat.textContent = 'Beats hit: ' + state.beatsHit;
  setTimeout(() => ui.gameOver.classList.remove('hidden'), 500);
}

// ============ EVENTS ============
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    if (state.running) handlePress();
    else startGame();
  }
});
window.addEventListener('pointerdown', (e) => {
  // If game over screen or start screen is active, let buttons handle it
  if (!state.running) return;
  handlePress();
});

document.getElementById('start-btn').addEventListener('click', (e) => {
  e.stopPropagation();
  startGame();
});
document.getElementById('restart-btn').addEventListener('click', (e) => {
  e.stopPropagation();
  startGame();
});

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ============ BEAT VISUALS ============
function onBeat(beatIndex) {
  const bar = Math.floor(beatIndex / 4) % 4;
  ui.patternTag.textContent = PHASE_NAMES[bar];

  const hue = (beatIndex * 32 + bar * 45) % 360;

  scene.background.setHSL(hue / 360, 0.8, 0.04);
  scene.fog.color.copy(scene.background);

  ball.scale.setScalar(1.45);
  ball.material.emissive.setHSL(hue / 360, 1, 0.55);
  ballGlow.material.color.setHSL(hue / 360, 1, 0.6);

  floorRing.scale.setScalar(1.35);
  floorRing.material.opacity = 0.9;
  floorRing.material.color.setHSL(hue / 360, 1, 0.7);
  floorGlow.material.color.setHSL(hue / 360, 0.95, 0.45);
  laneMat.color.setHSL(hue / 360, 1, 0.65);

  light1.color.setHSL(((hue + 0) % 360) / 360, 1, 0.6);
  light2.color.setHSL(((hue + 120) % 360) / 360, 1, 0.6);
  light3.color.setHSL(((hue + 240) % 360) / 360, 1, 0.6);
  light4.color.setHSL(((hue + 60) % 360) / 360, 1, 0.6);

  if (beatIndex % 4 === 0) {
    ui.perfectFlash.style.opacity = '0.22';
    setTimeout(() => ui.perfectFlash.style.opacity = '0', 90);
  }
}

// ============ MAIN LOOP ============
let lastFrame = performance.now();
function tick() {
  requestAnimationFrame(tick);
  const nowMs = performance.now();
  const dt = Math.min(0.05, (nowMs - lastFrame) / 1000);
  lastFrame = nowMs;

  if (state.running && audioCtx && music && music.isPlaying) {
    const t = audioCtx.currentTime;

    while (music.stepTimeOf(state.stepIndexToSpawn) < t + APPROACH_SEC) {
      const sIdx = state.stepIndexToSpawn;
      const bar = Math.floor(sIdx / 16) % 4;
      const stepInBar = sIdx % 16;
      const noteType = BAR_PATTERNS[bar][stepInBar];

      if (noteType) {
        const crossTime = music.stepTimeOf(sIdx);
        spawnRing(crossTime, sIdx, noteType);
      }
      state.stepIndexToSpawn++;
    }

    const currentBeat = Math.floor((t - music.startTime) / BEAT_DUR);
    if (currentBeat > state.lastBeatIndex && currentBeat >= 0) {
      state.lastBeatIndex = currentBeat;
      onBeat(currentBeat);
    }

    for (let i = state.rings.length - 1; i >= 0; i--) {
      const ring = state.rings[i];
      const ud = ring.userData;

      if (!ud.resolved) {
        const remaining = ud.crossTime - t;
        const progress = 1 - (remaining / APPROACH_SEC);
        ring.position.z = SPAWN_Z * (remaining / APPROACH_SEC);

        const entryAlpha = Math.min(1, Math.max(0.2, progress * 3));
        ring.material.opacity = entryAlpha;
        ud.outlineMat.opacity = entryAlpha * 0.85;

        const diff = Math.abs(remaining);
        if (diff < PERFECT_WINDOW_SEC) {
          ring.material.emissive.setHex(0xffffff);
          ring.material.emissiveIntensity = 4;
          ring.scale.setScalar(1.22);
          targetGate.material.color.setHex(0xffff44);
        } else if (diff < HIT_WINDOW_SEC) {
          ring.material.emissive.copy(ud.baseColor);
          ring.material.emissiveIntensity = 3.2;
          ring.scale.setScalar(1.1);
          targetGate.material.color.setHex(0x00ffff);
        } else {
          ring.material.emissive.copy(ud.baseColor);
          ring.material.emissiveIntensity = 2.2;
          ring.scale.setScalar(1);
        }

        if (ud.noteType === 'S') {
          ring.rotation.z = Math.PI / 4 + Math.sin(nowMs * 0.009) * 0.2;
        }

        const hueShift = (ud.hue + Math.sin(nowMs * 0.005 + ud.stepIndex) * 20 + 360) % 360;
        ring.material.color.setHSL(hueShift / 360, 1, 0.65);

        if (t > ud.crossTime + MISS_WINDOW_SEC) {
          resolveRing(ring, 'miss');
          if (!state.running) break;
        }
      } else {
        ud.fadeTime += dt;
        const prog = ud.fadeTime / 0.45;
        if (prog >= 1) {
          scene.remove(ring);
          ring.geometry.dispose();
          ring.material.dispose();
          state.rings.splice(i, 1);
          continue;
        }
        const s = 1 + prog * 2.8;
        ring.scale.setScalar(s);
        ring.material.opacity = 1 - prog;
        ud.outlineMat.opacity = (1 - prog) * 0.6;
        ring.material.emissiveIntensity = 2.5 * (1 - prog);
      }
    }
  }

  for (let i = state.particles.length - 1; i >= 0; i--) {
    const p = state.particles[i];
    p.life -= dt / 0.65;
    if (p.life <= 0) {
      scene.remove(p.points);
      p.points.geometry.dispose();
      p.points.material.dispose();
      state.particles.splice(i, 1);
      continue;
    }
    for (let j = 0; j < p.velocities.length; j++) {
      p.positions[j * 3]     += p.velocities[j].vx * dt;
      p.positions[j * 3 + 1] += p.velocities[j].vy * dt;
      p.positions[j * 3 + 2] += p.velocities[j].vz * dt;
      p.velocities[j].vy -= 24 * dt;
      p.velocities[j].vx *= 0.95;
      p.velocities[j].vz *= 0.95;
    }
    p.points.geometry.attributes.position.needsUpdate = true;
    p.points.material.opacity = p.life;
  }

  for (let i = state.shockwaves.length - 1; i >= 0; i--) {
    const s = state.shockwaves[i];
    s.life -= dt / s.dur;
    if (s.life <= 0) {
      scene.remove(s.mesh);
      s.mesh.geometry.dispose();
      s.mesh.material.dispose();
      state.shockwaves.splice(i, 1);
      continue;
    }
    const prog = 1 - s.life;
    const radius = s.radiusStart + (s.radiusEnd - s.radiusStart) * prog;
    s.mesh.scale.setScalar(radius / s.radiusStart);
    s.mesh.material.opacity = s.life;
  }

  ball.scale.lerp(ONE, dt * 10);
  targetGate.scale.lerp(ONE, dt * 12);
  targetGate.material.color.lerp(new THREE.Color(0xffffff), dt * 9);
  ball.rotation.x += dt * 0.8;
  ball.rotation.y += dt * 1.0;
  ball.material.emissiveIntensity = Math.max(2.5, ball.material.emissiveIntensity - dt * 16);
  const hueNow = (nowMs * 0.09) % 360;
  ballGlow.material.color.setHSL(hueNow / 360, 1, 0.65);
  const pulse = 1 + Math.sin(nowMs * 0.007) * 0.09;
  ballGlow.scale.setScalar(pulse);

  floorRing.scale.lerp(ONE, dt * 8);
  floorRing.material.opacity *= Math.pow(0.015, dt);

  if (state.shakeAmount > 0.1) {
    state.shakeAmount *= Math.pow(0.002, dt);
    camera.position.x = camBase.x + (Math.random() - 0.5) * state.shakeAmount * 0.07;
    camera.position.y = camBase.y + (Math.random() - 0.5) * state.shakeAmount * 0.07;
    camera.position.z = camBase.z + (Math.random() - 0.5) * state.shakeAmount * 0.04;
  } else {
    state.shakeAmount = 0;
    camera.position.lerp(camBase, dt * 7);
  }
  camera.lookAt(0, 1.05, -16);

  stars.rotation.y += dt * 0.035;

  renderer.render(scene, camera);
}

tick();
</script>
