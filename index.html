<!DOCTYPE html>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', system-ui, sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 0; left: 0; right: 0; padding: 20px 24px;
    display: flex; justify-content: space-between; align-items: flex-start;
    pointer-events: none; z-index: 10;
  }
  .box {
    background: rgba(20,0,40,0.5);
    border: 2px solid;
    border-image: linear-gradient(135deg, #ff00cc, #00ffff, #ffff00) 1;
    border-radius: 14px;
    padding: 8px 18px;
    backdrop-filter: blur(10px);
    box-shadow: 0 0 30px rgba(255,0,255,0.4), inset 0 0 15px rgba(0,255,255,0.15);

  .label { font-size: 10px; letter-spacing: 3px; color: #ffee88; margin-bottom: 2px; font-weight: 700; }

    background: radial-gradient(circle, transparent 20%, rgba(255,60,120,0.75) 100%);
    opacity: 0; transition: opacity 0.18s;
  }
  #perfect-flash {
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background: radial-gradient(circle, rgba(255,255,255,0.7), rgba(255,240,100,0.5) 30%, rgba(255,0,200,0.3) 60%, transparent 80%);
    opacity: 0; transition: opacity 0.14s;
  }
  #start-screen, #game-over {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    background: radial-gradient(circle at 50% 50%, #330066, #000011 70%);
    color: #fff; z-index: 20; text-align: center; padding: 20px;

    font-size: 56px; font-weight: 900; letter-spacing: 6px;

<script type="module">
import * as THREE from 'three';

// ============ TIMING / CONFIG ============
const BPM = 140;
const BEAT_DUR = 60 / BPM;           // ~0.4286s
const STEP_DUR = BEAT_DUR / 4;       // 16th note
const APPROACH_BEATS = 2;
const APPROACH_SEC = BEAT_DUR * APPROACH_BEATS;
const HIT_WINDOW_SEC = 0.20;
const PERFECT_WINDOW_SEC = 0.08;
const MISS_WINDOW_SEC = 0.16;
const RING_START_BEAT = 8;           // 2 bars intro
const SPAWN_Z = -45;
const ONE = new THREE.Vector3(1, 1, 1);

const CHORDS = [
  [64, 67, 71],  // Em
  [60, 64, 67],  // C
  [67, 71, 74],  // G
  [62, 66, 69],  // D
];
const BASS_ROOTS = [40, 36, 43, 38];

// ============ STATE ============
let audioCtx = null;
let music = null;

const state = {
  score: 0, combo: 0, bestCombo: 0, lives: 5, beatsHit: 0,
  running: false,
  rings: [], particles: [], shockwaves: [],
  shakeAmount: 0,
  beatIndexToSpawn: 0,
  lastBeatIndex: -1,
};

// ============ SCENE ============
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x110022);
scene.fog = new THREE.FogExp2(0x110022, 0.012);

const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.1, 250);
const camBase = new THREE.Vector3(0, 4, 9);
camera.position.copy(camBase);
camera.lookAt(0, 1, -15);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

// Lights (disco rig)
scene.add(new THREE.AmbientLight(0x664488, 1.1));
const light1 = new THREE.PointLight(0xff00cc, 4, 80);
light1.position.set(8, 8, 4); scene.add(light1);
const light2 = new THREE.PointLight(0x00ffff, 4, 80);
light2.position.set(-8, 6, -4); scene.add(light2);
const light3 = new THREE.PointLight(0xffff00, 3, 80);
light3.position.set(0, 10, -10); scene.add(light3);
const light4 = new THREE.PointLight(0x00ff88, 3, 80);
light4.position.set(6, 5, -15); scene.add(light4);

// Floor grid (rainbow-ish)
const grid = new THREE.GridHelper(200, 100, 0xff00cc, 0x0066ff);
grid.material.opacity = 0.35;
grid.material.transparent = true;
scene.add(grid);

// Floor glow circle
const floorGlow = new THREE.Mesh(
  new THREE.CircleGeometry(30, 64),
  new THREE.MeshBasicMaterial({ color: 0xff00aa, transparent: true, opacity: 0.15, blending: THREE.AdditiveBlending })
);
floorGlow.rotation.x = -Math.PI / 2;
floorGlow.position.y = 0.01;
scene.add(floorGlow);

// Pulsing floor ring (beat reactive)
const floorRing = new THREE.Mesh(
  new THREE.RingGeometry(3, 3.5, 64),
  new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.7, side: THREE.DoubleSide, blending: THREE.AdditiveBlending })
);
floorRing.rotation.x = -Math.PI / 2;
floorRing.position.y = 0.02;
scene.add(floorRing);

// Player ball (rainbow)
const ball = new THREE.Mesh(
  new THREE.IcosahedronGeometry(0.95, 2),
  new THREE.MeshStandardMaterial({
    color: 0xffffff, emissive: 0xff00ff, emissiveIntensity: 2.8,
    metalness: 0.5, roughness: 0.15,
  })
);
ball.position.set(0, 1.05, 0);
scene.add(ball);

const ballGlow = new THREE.Mesh(
  new THREE.SphereGeometry(1.9, 20, 20),
  new THREE.MeshBasicMaterial({ color: 0xff44ff, transparent: true, opacity: 0.28, blending: THREE.AdditiveBlending })
);
ball.add(ballGlow);

// Star field (rainbow colors)
const starsGeo = new THREE.BufferGeometry();
const starCount = 900;
const starPos = new Float32Array(starCount * 3);
const starCol = new Float32Array(starCount * 3);
for (let i = 0; i < starCount; i++) {
  starPos[i * 3]     = (Math.random() - 0.5) * 240;
  starPos[i * 3 + 1] = Math.random() * 60 - 5;
  starPos[i * 3 + 2] = (Math.random() - 0.5) * 240;
  const col = new THREE.Color().setHSL(Math.random(), 1, 0.65);
  starCol[i * 3]     = col.r;
  starCol[i * 3 + 1] = col.g;
  starCol[i * 3 + 2] = col.b;
}
starsGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
starsGeo.setAttribute('color', new THREE.BufferAttribute(starCol, 3));
const stars = new THREE.Points(starsGeo,
  new THREE.PointsMaterial({ size: 0.35, vertexColors: true, transparent: true, opacity: 0.85 }));
scene.add(stars);

// ============ MUSIC ENGINE ============
class Music {
  constructor(ctx) {
    this.ctx = ctx;
    this.master = ctx.createGain();
    this.master.gain.value = 0.32;

    // Ping-pong-ish echo for sparkle
    const delay = ctx.createDelay(1);
    delay.delayTime.value = BEAT_DUR * 0.75;
    const fb = ctx.createGain();
    fb.gain.value = 0.28;
    const wet = ctx.createGain();
    wet.gain.value = 0.25;
    this.master.connect(ctx.destination);
    this.master.connect(delay).connect(fb).connect(delay);
    delay.connect(wet).connect(ctx.destination);

    this.step = 0;
    this.startTime = 0;
    this.nextStepTime = 0;
    this.isPlaying = false;
    this.timer = null;
  }

  start() {
    this.startTime = this.ctx.currentTime + 0.4;
    this.nextStepTime = this.startTime;
    this.step = 0;
    this.isPlaying = true;
    this.schedule();
  }

  stop() {
    this.isPlaying = false;
    if (this.timer) clearTimeout(this.timer);
    // Fade out
    const t = this.ctx.currentTime;
    this.master.gain.cancelScheduledValues(t);
    this.master.gain.setValueAtTime(this.master.gain.value, t);
    this.master.gain.linearRampToValueAtTime(0, t + 0.4);
  }

  schedule() {
    while (this.nextStepTime < this.ctx.currentTime + 0.25) {
      this.playStep(this.step, this.nextStepTime);
      this.nextStepTime += STEP_DUR;
      this.step++;
    }
    if (this.isPlaying) {
      this.timer = setTimeout(() => this.schedule(), 25);
    }
  }

  playStep(step, t) {
    const bar = Math.floor(step / 16) % 4;
    const s = step % 16;
    const chord = CHORDS[bar];
    const root = BASS_ROOTS[bar];
    const phrase = Math.floor(step / 64); // Every 4 bars = new phrase variation

    // === DRUMS ===
    if (s === 0 || s === 8) this.kick(t, 1.0);
    if (s === 6 || s === 14) this.kick(t, 0.7);
    if (s === 4 || s === 12) this.snare(t);
    if (s % 2 === 0) this.hihat(t, s % 4 === 0 ? 0.28 : 0.14);

    // Open hat accent
    if (s === 10) this.hihat(t, 0.10, 0.15);

    // === BASS ===
    if (s % 4 === 0) this.bass(root, t, 0.28);
    // Extra bass note on 6 and 14 for drive
    if (s === 6 || s === 14) this.bass(root + 12, t, 0.15);

    // === FAST ARP (Rush-E style) ===
    // 16th note oscillation through chord tones
    const arpPattern = [0, 1, 2, 1];
    const arpNote = chord[arpPattern[s % 4]] + 12 + (phrase % 2 === 0 ? 0 : 12);
    this.lead(arpNote, t, 0.055, 'triangle');

    // === ACCENT LEAD ===
    if (s === 0) this.lead(chord[0] + 24, t, 0.09, 'sawtooth');
    if (s === 8 && (phrase % 2 === 1)) this.lead(chord[2] + 24, t, 0.08, 'sawtooth');

    // === SPARKLE (high pitched, echoes via delay) ===
    if (s === 0 && phrase % 2 === 0) this.lead(chord[0] + 36, t, 0.04, 'sine');
  }

  kick(t, vol = 1) {
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.frequency.setValueAtTime(160, t);
    o.frequency.exponentialRampToValueAtTime(45, t + 0.09);
    g.gain.setValueAtTime(vol * 0.85, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
    o.connect(g).connect(this.master);
    o.start(t);
    o.stop(t + 0.22);
  }

  snare(t) {
    const buf = this.ctx.createBuffer(1, Math.floor(this.ctx.sampleRate * 0.16), this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    const f = this.ctx.createBiquadFilter();
    f.type = 'highpass';
    f.frequency.value = 1400;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.32, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
    src.connect(f).connect(g).connect(this.master);
    src.start(t);
    src.stop(t + 0.16);
  }

  hihat(t, vol, decay = 0.045) {
    const buf = this.ctx.createBuffer(1, Math.floor(this.ctx.sampleRate * decay), this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    const f = this.ctx.createBiquadFilter();
    f.type = 'highpass';
    f.frequency.value = 7500;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + decay);
    src.connect(f).connect(g).connect(this.master);
    src.start(t);
  }

  bass(midi, t, vol) {
    const freq = 440 * Math.pow(2, (midi - 69) / 12);
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    const f = this.ctx.createBiquadFilter();
    o.type = 'sawtooth';
    o.frequency.value = freq;
    f.type = 'lowpass';
    f.frequency.value = 600;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
    o.connect(f).connect(g).connect(this.master);
    o.start(t);
    o.stop(t + 0.22);
  }

  lead(midi, t, vol, type = 'triangle') {
    const freq = 440 * Math.pow(2, (midi - 69) / 12);
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
    o.connect(g).connect(this.master);
    o.start(t);
    o.stop(t + 0.11);
  }

  beatTimeOf(index) {
    return this.startTime + index * BEAT_DUR;
  }
}

// ============ UI ============
const ui = {
  score: document.getElementById('score'),
  combo: document.getElementById('combo'),
  comboBox: document.getElementById('combo-box'),
  lives: document.getElementById('lives'),
  flash: document.getElementById('flash'),
  perfectFlash: document.getElementById('perfect-flash'),
  comboPopup: document.getElementById('combo-popup'),
  missPopup: document.getElementById('miss-popup'),
  startScreen: document.getElementById('start-screen'),
  gameOver: document.getElementById('game-over'),
  finalScore: document.getElementById('final-score'),
  finalCombo: document.getElementById('final-combo'),
  finalBeat: document.getElementById('final-beat'),
};

function updateUI() {
  ui.score.textContent = state.score;
  ui.combo.textContent = 'x' + state.combo;
  ui.comboBox.classList.toggle('active', state.combo > 1);
  ui.lives.textContent = '♥'.repeat(Math.max(0, state.lives)) || '—';
}
function flash(kind) {
  if (kind === 'perfect') {
    ui.perfectFlash.style.opacity = '1';
    setTimeout(() => ui.perfectFlash.style.opacity = '0', 140);
  } else {
    ui.flash.style.opacity = '1';
    setTimeout(() => ui.flash.style.opacity = '0', 220);
  }
}
function showPopup(el, text, color) {
  el.textContent = text;
  el.style.color = color;
  el.style.transition = 'none';
  el.style.opacity = '1';
  el.style.transform = 'translate(-50%, -50%) scale(0.6)';
  void el.offsetHeight;
  el.style.transition = 'all 0.5s cubic-bezier(0.2, 0.9, 0.3, 1)';
  el.style.transform = 'translate(-50%, -150%) scale(1.5)';
  el.style.opacity = '0';
}

// ============ SPAWN & EFFECTS ============
function spawnRing(crossTime, beatIndex) {
  const hue = (beatIndex * 37) % 360; // golden-angle rainbow spread
  const color = new THREE.Color().setHSL(hue / 360, 1, 0.6);

  const geo = new THREE.TorusGeometry(2.1, 0.18, 10, 48);
  const mat = new THREE.MeshStandardMaterial({
    color, emissive: color, emissiveIntensity: 2.2,
    transparent: true, opacity: 1,
  });
  const ring = new THREE.Mesh(geo, mat);
  ring.position.set(0, 1.05, SPAWN_Z);
  ring.userData = {
    crossTime, beatIndex, resolved: false, fadeTime: 0,
    baseColor: color.clone(), hue,
  };
  scene.add(ring);
  state.rings.push(ring);
}

function burst(pos, colorHex, count, speed, size = 0.32) {
  const geo = new THREE.BufferGeometry();
  const posArr = new Float32Array(count * 3);
  const vel = [];
  for (let i = 0; i < count; i++) {
    posArr[i * 3] = pos.x;
    posArr[i * 3 + 1] = pos.y;
    posArr[i * 3 + 2] = pos.z;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const v = speed * (0.4 + Math.random());
    vel.push({
      vx: Math.sin(phi) * Math.cos(theta) * v,
      vy: Math.cos(phi) * v + 4,
      vz: Math.sin(phi) * Math.sin(theta) * v,
    });
  }
  geo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
  const mat = new THREE.PointsMaterial({
    color: colorHex, size, transparent: true, opacity: 1, blending: THREE.AdditiveBlending,
  });
  const points = new THREE.Points(geo, mat);
  scene.add(points);
  state.particles.push({ points, velocities: vel, life: 1, positions: posArr });
}

function shockwave(colorHex, radiusStart = 1, radiusEnd = 12, dur = 0.55) {
  const geo = new THREE.RingGeometry(radiusStart, radiusStart + 0.6, 48);
  const mat = new THREE.MeshBasicMaterial({
    color: colorHex, transparent: true, opacity: 1, side: THREE.DoubleSide, blending: THREE.AdditiveBlending,
  });
  const m = new THREE.Mesh(geo, mat);
  m.position.set(0, 1.05, 0);
  m.rotation.x = -Math.PI / 2;
  scene.add(m);
  state.shockwaves.push({ mesh: m, life: 1, dur, radiusEnd, radiusStart });
}

function resolveRing(ring, quality) {
  if (ring.userData.resolved) return;
  ring.userData.resolved = true;
  const pos = ring.position.clone();
  const col = ring.userData.baseColor;

  if (quality === 'perfect') {
    state.combo++;
    state.bestCombo = Math.max(state.bestCombo, state.combo);
    state.score += 100 * state.combo;
    state.beatsHit++;
    playHit(true, state.combo);
    flash('perfect');
    showPopup(ui.comboPopup, 'PERFECT', '#ffff44');
    // RAINBOW burst
    for (let i = 0; i < 5; i++) {
      const hue = (performance.now() / 5 + i * 72) % 360;
      const c = new THREE.Color().setHSL(hue / 360, 1, 0.6).getHex();
      burst(pos, c, 14, 32, 0.36);
    }
    shockwave(0xffffff, 1, 20, 0.55);
    shockwave(col.getHex(), 1, 30, 0.7);
    state.shakeAmount = 12;
    // ball explosion visual
    ball.material.emissiveIntensity = 8;
  } else if (quality === 'good') {
    state.combo++;
    state.bestCombo = Math.max(state.bestCombo, state.combo);
    state.score += 50 * state.combo;
    state.beatsHit++;
    playHit(false, state.combo);
    showPopup(ui.comboPopup, 'GOOD', '#44ffff');
    burst(pos, col.getHex(), 26, 20, 0.3);
    shockwave(col.getHex(), 1, 14, 0.5);
    state.shakeAmount = 5;
    ball.material.emissiveIntensity = 5;
  } else if (quality === 'miss') {
    state.combo = 0;
    state.lives--;
    playMiss();
    flash('miss');
    showPopup(ui.missPopup, 'MISS', '#ff2244');
    state.shakeAmount = 18;
    if (state.lives <= 0) gameOver();
  }
  updateUI();
}

// ============ AUDIO SFX ============
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function playHit(perfect, combo) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const base = perfect ? 880 : 660;
  const freq = base * Math.pow(2, Math.min(combo, 12) / 12);
  // Hit tone
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = perfect ? 'triangle' : 'square';
  o.frequency.setValueAtTime(freq, t);
  o.frequency.exponentialRampToValueAtTime(freq * 1.5, t + 0.08);
  g.gain.setValueAtTime(perfect ? 0.12 : 0.08, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
  o.connect(g).connect(audioCtx.destination);
  o.start(t);
  o.stop(t + 0.16);

  if (perfect) {
    // Second harmony
    setTimeout(() => {
      const o2 = audioCtx.createOscillator();
      const g2 = audioCtx.createGain();
      o2.type = 'sine';
      o2.frequency.value = freq * 1.5;
      g2.gain.setValueAtTime(0.1, t + 0.05);
      g2.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
      o2.connect(g2).connect(audioCtx.destination);
      o2.start(t + 0.05);
      o2.stop(t + 0.22);
    }, 30);
  }
}
function playMiss() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(180, t);
  o.frequency.exponentialRampToValueAtTime(60, t + 0.3);
  g.gain.setValueAtTime(0.15, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
  o.connect(g).connect(audioCtx.destination);
  o.start(t);
  o.stop(t + 0.36);
}

// ============ INPUT ============
function handlePress() {
  if (!state.running || !audioCtx) return;
  const t = audioCtx.currentTime;
  let best = null, bestDist = Infinity;
  for (const ring of state.rings) {
    if (ring.userData.resolved) continue;
    const d = Math.abs(t - ring.userData.crossTime);
    if (d < HIT_WINDOW_SEC && d < bestDist) { best = ring; bestDist = d; }
  }
  if (best) {
    resolveRing(best, bestDist < PERFECT_WINDOW_SEC ? 'perfect' : 'good');
  } else {
    // harmless empty tap - just tiny visual
    state.shakeAmount = Math.max(state.shakeAmount, 2);
  }
}

// ============ GAME FLOW ============
function startGame() {
  initAudio();
  if (music) music.stop();
  music = new Music(audioCtx);

  // Cleanup
  for (const r of state.rings) { scene.remove(r); r.geometry.dispose(); r.material.dispose(); }
  state.rings = [];
  for (const p of state.particles) { scene.remove(p.points); p.points.geometry.dispose(); p.points.material.dispose(); }
  state.particles = [];
  for (const s of state.shockwaves) { scene.remove(s.mesh); s.mesh.geometry.dispose(); s.mesh.material.dispose(); }
  state.shockwaves = [];

  Object.assign(state, {
    score: 0, combo: 0, bestCombo: 0, lives: 5, beatsHit: 0,
    running: true, shakeAmount: 0,
    beatIndexToSpawn: RING_START_BEAT,
    lastBeatIndex: -1,
  });
  camera.position.copy(camBase);

  music.start();
  ui.startScreen.classList.add('hidden');
  ui.gameOver.classList.add('hidden');
  updateUI();
}

function gameOver() {
  state.running = false;
  if (music) music.stop();
  ui.finalScore.textContent = state.score;
  ui.finalCombo.textContent = 'Best combo: x' + state.bestCombo;
  ui.finalBeat.textContent = 'Beats hit: ' + state.beatsHit;
  setTimeout(() => ui.gameOver.classList.remove('hidden'), 500);
}

// ============ EVENTS ============
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    if (state.running) handlePress();
    else startGame();
  }
});
window.addEventListener('pointerdown', () => { if (state.running) handlePress(); });
document.getElementById('start-btn').addEventListener('click', (e) => { e.stopPropagation(); startGame(); });
document.getElementById('restart-btn').addEventListener('click', (e) => { e.stopPropagation(); startGame(); });
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ============ BEAT VISUALS ============
function onBeat(beatIndex) {
  // Hue cycle per beat
  const hue = (beatIndex * 30) % 360;
  const col = new THREE.Color().setHSL(hue / 360, 0.85, 0.5);

  // Background pulse
  scene.background.setHSL(hue / 360, 0.7, 0.045);
  scene.fog.color.copy(scene.background);

  // Ball pulse
  ball.scale.setScalar(1.45);
  ball.material.emissive.setHSL(hue / 360, 1, 0.5);
  ballGlow.material.color.setHSL(hue / 360, 1, 0.55);

  // Floor pulse
  floorRing.scale.setScalar(1.35);
  floorRing.material.opacity = 0.9;
  floorRing.material.color.setHSL(hue / 360, 1, 0.65);
  floorGlow.material.color.setHSL(hue / 360, 0.9, 0.4);

  // Lights shift
  light1.color.setHSL(((hue + 0) % 360) / 360, 1, 0.55);
  light2.color.setHSL(((hue + 120) % 360) / 360, 1, 0.55);
  light3.color.setHSL(((hue + 240) % 360) / 360, 1, 0.55);
  light4.color.setHSL(((hue + 60) % 360) / 360, 1, 0.55);

  // Every 4th beat - bigger flash
  if (beatIndex % 4 === 0) {
    ui.perfectFlash.style.opacity = '0.25';
    setTimeout(() => ui.perfectFlash.style.opacity = '0', 90);
  }
}

// ============ MAIN LOOP ============
let lastFrame = performance.now();
function tick() {
  requestAnimationFrame(tick);
  const nowMs = performance.now();
  const dt = Math.min(0.05, (nowMs - lastFrame) / 1000);
  lastFrame = nowMs;

  if (state.running && audioCtx && music && music.isPlaying) {
    const t = audioCtx.currentTime;

    // === Schedule ring spawns ===
    while (music.beatTimeOf(state.beatIndexToSpawn) < t + APPROACH_SEC) {
      const bt = music.beatTimeOf(state.beatIndexToSpawn);
      spawnRing(bt, state.beatIndexToSpawn);
      state.beatIndexToSpawn++;
    }

    // === Beat pulse detection ===
    const currentBeat = Math.floor((t - music.startTime) / BEAT_DUR);
    if (currentBeat > state.lastBeatIndex && currentBeat >= 0) {
      state.lastBeatIndex = currentBeat;
      onBeat(currentBeat);
    }

    // === Update rings ===
    for (let i = state.rings.length - 1; i >= 0; i--) {
      const ring = state.rings[i];
      const ud = ring.userData;

      if (!ud.resolved) {
        const remaining = ud.crossTime - t;
        // z from SPAWN_Z (at spawn) to 0 (at cross)
        ring.position.z = SPAWN_Z * (remaining / APPROACH_SEC);

        // Color feedback
        const diff = Math.abs(remaining);
        if (diff < PERFECT_WINDOW_SEC) {
          ring.material.emissive.setHex(0xffffff);
          ring.material.emissiveIntensity = 4;
          ring.scale.setScalar(1.25);
        } else if (diff < HIT_WINDOW_SEC) {
          ring.material.emissive.copy(ud.baseColor);
          ring.material.emissiveIntensity = 3.5;
          ring.scale.setScalar(1.12);
        } else {
          ring.material.emissive.copy(ud.baseColor);
          ring.material.emissiveIntensity = 2.2;
          ring.scale.setScalar(1);
        }
        // Hue-rotate slightly for shimmer
        const hueShift = (ud.hue + Math.sin(nowMs * 0.005 + ud.beatIndex) * 20 + 360) % 360;
        ring.material.color.setHSL(hueShift / 360, 1, 0.6);

        // Miss check
        if (t > ud.crossTime + MISS_WINDOW_SEC) {
          resolveRing(ring, 'miss');
          if (!state.running) break;
        }
      } else {
        // Fade out
        ud.fadeTime += dt;
        const prog = ud.fadeTime / 0.5;
        if (prog >= 1) {
          scene.remove(ring);
          ring.geometry.dispose();
          ring.material.dispose();
          state.rings.splice(i, 1);
          continue;
        }
        const s = 1 + prog * 3;
        ring.scale.setScalar(s);
        ring.material.opacity = 1 - prog;
        ring.material.emissiveIntensity = 2.2 * (1 - prog);
      }
    }
  }

  // === Particles (always update) ===
  for (let i = state.particles.length - 1; i >= 0; i--) {
    const p = state.particles[i];
    p.life -= dt / 0.75;
    if (p.life <= 0) {
      scene.remove(p.points);
      p.points.geometry.dispose();
      p.points.material.dispose();
      state.particles.splice(i, 1);
      continue;
    }
    for (let j = 0; j < p.velocities.length; j++) {
      p.positions[j * 3]     += p.velocities[j].vx * dt;
      p.positions[j * 3 + 1] += p.velocities[j].vy * dt;
      p.positions[j * 3 + 2] += p.velocities[j].vz * dt;
      p.velocities[j].vy -= 22 * dt;
      p.velocities[j].vx *= 0.96;
      p.velocities[j].vz *= 0.96;
    }
    p.points.geometry.attributes.position.needsUpdate = true;
    p.points.material.opacity = p.life;
  }

  // === Shockwaves ===
  for (let i = state.shockwaves.length - 1; i >= 0; i--) {
    const s = state.shockwaves[i];
    s.life -= dt / s.dur;
    if (s.life <= 0) {
      scene.remove(s.mesh);
      s.mesh.geometry.dispose();
      s.mesh.material.dispose();
      state.shockwaves.splice(i, 1);
      continue;
    }
    const prog = 1 - s.life;
    const radius = s.radiusStart + (s.radiusEnd - s.radiusStart) * prog;
    s.mesh.scale.setScalar(radius / s.radiusStart);
    s.mesh.material.opacity = s.life;
  }

  // === Ball idle ===
  ball.scale.lerp(ONE, dt * 9);
  ball.rotation.x += dt * 0.7;
  ball.rotation.y += dt * 0.9;
  ball.material.emissiveIntensity = Math.max(2.5, ball.material.emissiveIntensity - dt * 15);
  const hueNow = (nowMs * 0.08) % 360;
  ballGlow.material.color.setHSL(hueNow / 360, 1, 0.6);
  const pulse = 1 + Math.sin(nowMs * 0.006) * 0.08;
  ballGlow.scale.setScalar(pulse);

  // === Floor ring idle ===
  floorRing.scale.lerp(ONE, dt * 7);
  floorRing.material.opacity *= Math.pow(0.02, dt);

  // === Camera shake ===
  if (state.shakeAmount > 0.1) {
    state.shakeAmount *= Math.pow(0.003, dt);
    camera.position.x = camBase.x + (Math.random() - 0.5) * state.shakeAmount * 0.07;
    camera.position.y = camBase.y + (Math.random() - 0.5) * state.shakeAmount * 0.07;
    camera.position.z = camBase.z + (Math.random() - 0.5) * state.shakeAmount * 0.04;
  } else {
    state.shakeAmount = 0;
    camera.position.lerp(camBase, dt * 6);
  }
  camera.lookAt(0, 1.05, -15);

  // === Stars drift ===
  stars.rotation.y += dt * 0.03;

  renderer.render(scene, camera);
}

tick();
</script>
