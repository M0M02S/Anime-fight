<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RNG Skin Idle</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    background: #111827;
    color: #f9fafb;
    margin: 0;
    padding: 20px;
  }
  h1, h2 { margin-top: 0; }
  .stats {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    background: #1f2937;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 20px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .box {
    background: #1f2937;
    color: #f9fafb;
    border: 2px solid #374151;
    border-radius: 12px;
    padding: 14px;
    cursor: pointer;
    text-align: left;
    font-size: 14px;
  }
  .box:hover { background: #374151; }
  .inventory {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 10px;
    margin-bottom: 20px;
  }
  .skin {
    background: #1f2937;
    border: 2px solid #374151;
    border-radius: 10px;
    padding: 10px;
  }
  .log {
    background: #0f172a;
    border-radius: 10px;
    padding: 10px;
    min-height: 100px;
    font-size: 14px;
    line-height: 1.6;
  }
</style>
</head>
<body>

<h1>RNG Skin Idle</h1>

<div class="stats">
  <div>Münzen: <b id="coins">0</b></div>
  <div>Münzen/Sek: <b id="cps">0</b></div>
  <div>Skins: <b id="skinCount">0</b></div>
</div>

<h2>Boxen</h2>
<div id="boxes" class="grid"></div>

<h2>Inventar</h2>
<div id="inventory" class="inventory"></div>

<h2>Log</h2>
<div id="log" class="log"></div>

<script>
const rarities = [
  { name: "Common",    weight: 1000, color: "#9ca3af" },
  { name: "Uncommon",  weight: 500,  color: "#22c55e" },
  { name: "Rare",      weight: 200,  color: "#3b82f6" },
  { name: "Epic",      weight: 50,   color: "#a855f7" },
  { name: "Legendary", weight: 10,   color: "#f59e0b" },
  { name: "Mythic",    weight: 1,    color: "#ef4444" }
];

const skins = [
  // Common
  { id: "stein_slime",      name: "Stein-Slime",      rarity: 0, cps: 1 },
  { id: "holz_fuchs",       name: "Holz-Fuchs",       rarity: 0, cps: 2 },
  { id: "grass_kaefer",     name: "Gras-Käfer",       rarity: 0, cps: 3 },

  // Uncommon
  { id: "bronze_wolf",      name: "Bronze-Wolf",      rarity: 1, cps: 6 },
  { id: "silber_eule",      name: "Silber-Eule",      rarity: 1, cps: 8 },
  { id: "kristall_hase",    name: "Kristall-Hase",    rarity: 1, cps: 10 },

  // Rare
  { id: "gold_drache",      name: "Gold-Drache",      rarity: 2, cps: 25 },
  { id: "regenbogen_frosch",name: "Regenbogen-Frosch",rarity: 2, cps: 30 },
  { id: "lava_golem",       name: "Lava-Golem",       rarity: 2, cps: 35 },

  // Epic
  { id: "diamant_phoenix",  name: "Diamant-Phönix",   rarity: 3, cps: 90 },
  { id: "schatten_tiger",   name: "Schatten-Tiger",   rarity: 3, cps: 110 },
  { id: "plasma_roboter",   name: "Plasma-Roboter",   rarity: 3, cps: 130 },

  // Legendary
  { id: "galaxy_drache",    name: "Galaxy-Drache",    rarity: 4, cps: 400 },
  { id: "zeit_waechter",    name: "Zeit-Wächter",     rarity: 4, cps: 500 },
  { id: "traum_koenigin",   name: "Traum-Königin",    rarity: 4, cps: 600 },

  // Mythic
  { id: "omega_gott",       name: "Omega-Gott",       rarity: 5, cps: 2500 },
  { id: "unendlichkeits_kern", name: "Unendlichkeits-Kern", rarity: 5, cps: 3000 }
];

const boxes = [
  { name: "Holzbox",    cost: 50,   luck: 1,   color: "#a16207" },
  { name: "Silberbox",  cost: 250,  luck: 1.5, color: "#94a3b8" },
  { name: "Goldbox",    cost: 1000, luck: 2.5, color: "#f59e0b" },
  { name: "Glücksbox",  cost: 5000, luck: 5,   color: "#ef4444" }
];

let coins = 100;
let owned = {};
let logEntries = [];

function getCps() {
  return skins.reduce((sum, skin) => {
    return sum + (owned[skin.id] || 0) * skin.cps;
  }, 0);
}

function getSkinCount() {
  return Object.values(owned).reduce((a, b) => a + b, 0);
}

function updateStats() {
  document.getElementById("coins").textContent = Math.floor(coins);
  document.getElementById("cps").textContent = getCps();
  document.getElementById("skinCount").textContent = getSkinCount();
}

function renderBoxes() {
  const el = document.getElementById("boxes");
  el.innerHTML = "";

  boxes.forEach((box, index) => {
    const btn = document.createElement("button");
    btn.className = "box";
    btn.style.borderColor = box.color;
    btn.innerHTML = `
      <strong>${box.name}</strong><br>
      Kosten: ${box.cost} Münzen<br>
      Glück: x${box.luck}
    `;
    btn.onclick = () => openBox(index);
    el.appendChild(btn);
  });
}

function renderInventory() {
  const el = document.getElementById("inventory");
  const entries = Object.entries(owned).filter(([, count]) => count > 0);

  if (entries.length === 0) {
    el.innerHTML = "<div>Noch keine Skins. Öffne eine Box!</div>";
    return;
  }

  entries.sort((a, b) => {
    const skinA = skins.find(s => s.id === a[0]);
    const skinB = skins.find(s => s.id === b[0]);
    return skinB.rarity - skinA.rarity || skinB.cps - skinA.cps;
  });

  el.innerHTML = entries.map(([id, count]) => {
    const skin = skins.find(s => s.id === id);
    const rarity = rarities[skin.rarity];

    return `
      <div class="skin" style="border-color:${rarity.color}">
        <b>${skin.name}</b> x${count}<br>
        <span style="color:${rarity.color}">${rarity.name}</span><br>
        +${skin.cps} Münzen/s pro Stück
      </div>
    `;
  }).join("");
}

function chooseRarity(luck) {
  const weights = rarities.map((rarity, index) => {
    return rarity.weight * Math.pow(luck, index);
  });

  const total = weights.reduce((a, b) => a + b, 0);
  let roll = Math.random() * total;

  for (let i = 0; i < weights.length; i++) {
    roll -= weights[i];
    if (roll <= 0) return i;
  }

  return 0;
}

function openBox(index) {
  const box = boxes[index];

  if (coins < box.cost) {
    addLog(`Nicht genug Münzen für ${box.name}.`);
    return;
  }

  coins -= box.cost;

  const rarityIndex = chooseRarity(box.luck);
  const pool = skins.filter(skin => skin.rarity === rarityIndex);
  const skin = pool[Math.floor(Math.random() * pool.length)];

  owned[skin.id] = (owned[skin.id] || 0) + 1;

  const rarity = rarities[rarityIndex];
  addLog(
    `<span style="color:${rarity.color}">${rarity.name}</span>: ` +
    `<b>${skin.name}</b> aus ${box.name}! ` +
    `(+${skin.cps} Münzen/s)`
  );

  updateAll();
}

function addLog(text) {
  logEntries.unshift(text);
  if (logEntries.length > 8) logEntries.pop();

  document.getElementById("log").innerHTML = logEntries
    .map(entry => `<div>${entry}</div>`)
    .join("");
}

function updateAll() {
  updateStats();
  renderInventory();
}

setInterval(() => {
  coins += getCps() / 10;
  updateStats();
}, 100);

renderBoxes();
updateAll();
addLog("Willkommen! Öffne eine Box und sammle Skins.");
</script>

</body>
</html>
