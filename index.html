<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Klangformer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', system-ui, sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; }
  body::after {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 4;
    background: radial-gradient(circle at 50% 50%, transparent 40%, rgba(0,0,0,0.7) 100%);
  }
  #hud {
    position: fixed; top: 0; left: 0; right: 0; padding: 20px 24px;
    display: flex; justify-content: space-between; align-items: flex-start;
    pointer-events: none; z-index: 10;
    text-shadow: 0 0 12px rgba(100,200,255,0.8);
  }
  .box {
    background: rgba(0,20,40,0.45);
    border: 1px solid rgba(100,200,255,0.4);
    border-radius: 12px;
    padding: 8px 16px;
    backdrop-filter: blur(10px);
    box-shadow: 0 0 20px rgba(50,150,255,0.3);
  }
  .label { font-size: 10px; letter-spacing: 3px; color: #88aacc; margin-bottom: 2px; }
  #score { font-size: 26px; font-weight: 700; color: #66ccff; }
  #combo { font-size: 26px; font-weight: 700; color: #ff66cc; }
  #lives { font-size: 22px; color: #ff4466; letter-spacing: 2px; }
  #combo-box { opacity: 0; transition: opacity 0.2s; }
  #combo-box.active { opacity: 1; }
  #flash {
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background: radial-gradient(circle, transparent 30%, rgba(255,60,80,0.7) 100%);
    opacity: 0; transition: opacity 0.15s;
  }
  #perfect-flash {
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background: radial-gradient(circle, rgba(255,220,100,0.35), transparent 60%);
    opacity: 0; transition: opacity 0.15s;
  }
  #start-screen, #game-over {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    background: rgba(0,5,15,0.85);
    color: #fff; z-index: 20; text-align: center; padding: 20px;
    backdrop-filter: blur(20px);
  }
  #start-screen h1, #game-over h1 {
    font-size: 48px; font-weight: 900; letter-spacing: 4px;
    background: linear-gradient(135deg, #66ffff, #ff66cc);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 10px;
    filter: drop-shadow(0 0 20px rgba(100,200,255,0.5));
  }
  #start-screen p, #game-over p { color: #aaccee; margin: 6px 0; font-size: 15px; }
  .key { display: inline-block; background: #223344; border: 1px solid #445566; padding: 3px 10px; border-radius: 6px; font-family: monospace; color: #88ddff; margin: 0 3px; }
  #game-over .final { font-size: 42px; color: #66ccff; margin: 16px 0; font-weight: 700; }
  button {
    margin-top: 24px; padding: 14px 44px; font-size: 17px; font-weight: 700;
    background: linear-gradient(135deg, #3399ff, #ff66cc);
    border: none; border-radius: 12px; color: #fff; cursor: pointer;
    letter-spacing: 3px; box-shadow: 0 0 30px rgba(100,150,255,0.5);
    transition: transform 0.15s; font-family: inherit;
  }
  button:hover { transform: scale(1.05); }
  button:active { transform: scale(0.98); }
  .hidden { display: none !important; }
  #combo-popup {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    font-size: 64px; font-weight: 900; color: #ffdd44; font-style: italic;
    text-shadow: 0 0 40px rgba(255,200,50,0.9);
    pointer-events: none; z-index: 6; opacity: 0;
  }
</style>
</head>
<body>

<div id="hud">
  <div class="box">
    <div class="label">SCORE</div>
    <div id="score">0</div>
  </div>
  <div class="box" id="combo-box">
    <div class="label">COMBO</div>
    <div id="combo">x0</div>
  </div>
  <div class="box">
    <div class="label">LIVES</div>
    <div id="lives">♥♥♥</div>
  </div>
</div>

<div id="flash"></div>
<div id="perfect-flash"></div>
<div id="combo-popup"></div>

<div id="start-screen">
  <h1>KLANGFORMER</h1>
  <p>Shape sound. Ride the wave. Feel the beat.</p>
  <p style="margin-top: 26px; font-size: 13px; color: #88aacc;">
    Press <span class="key">SPACE</span> <span class="key">CLICK</span> <span class="key">TAP</span><br>
    when a wave hits you
  </p>
  <button id="start-btn">START</button>
</div>

<div id="game-over" class="hidden">
  <h1>WAVE CRASHED</h1>
  <div class="final" id="final-score">0</div>
  <p id="final-combo">Best combo: x0</p>
  <button id="restart-btn">PLAY AGAIN</button>
</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

// ============ CONFIG ============
const BPM = 120;
const BEAT_MS = 60000 / BPM;          // 500ms
const APPROACH_MS = BEAT_MS * 3;      // 1500ms travel time
const SPAWN_Z = -45;
const RING_SPEED = -SPAWN_Z / (APPROACH_MS / 1000); // 30 u/s
const HIT_WINDOW = 160;               // ±ms for "good"
const PERFECT_WINDOW = 60;            // ±ms for "perfect"
const ONE = new THREE.Vector3(1, 1, 1);

// ============ STATE ============
const state = {
  score: 0, combo: 0, bestCombo: 0, lives: 3,
  running: false,
  rings: [], particles: [],
  lastBeatTime: 0,
  shakeAmount: 0,
  cameraBase: new THREE.Vector3(0, 4, 8),
};

// ============ SCENE ============
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000814);
scene.fog = new THREE.Fog(0x000814, 12, 80);

const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 200);
camera.position.copy(state.cameraBase);
camera.lookAt(0, 1, -15);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

// Lights
scene.add(new THREE.AmbientLight(0x335588, 1.3));
const keyLight = new THREE.PointLight(0xff44cc, 3, 60);
keyLight.position.set(6, 8, 4);
scene.add(keyLight);
const rimLight = new THREE.PointLight(0x44aaff, 3, 60);
rimLight.position.set(-6, 5, -8);
scene.add(rimLight);

// Ground grid
const grid = new THREE.GridHelper(200, 100, 0x0088ff, 0x004488);
grid.material.opacity = 0.35;
grid.material.transparent = true;
scene.add(grid);

// Ground glow
const floorGlow = new THREE.Mesh(
  new THREE.CircleGeometry(28, 48),
  new THREE.MeshBasicMaterial({ color: 0x0044aa, transparent: true, opacity: 0.12, blending: THREE.AdditiveBlending })
);
floorGlow.rotation.x = -Math.PI / 2;
floorGlow.position.y = 0.01;
scene.add(floorGlow);

// Player ball
const ball = new THREE.Mesh(
  new THREE.IcosahedronGeometry(0.9, 2),
  new THREE.MeshStandardMaterial({
    color: 0x66ffff, emissive: 0x22aaff, emissiveIntensity: 2.5,
    metalness: 0.4, roughness: 0.15,
  })
);
ball.position.set(0, 1, 0);
scene.add(ball);

const ballGlow = new THREE.Mesh(
  new THREE.SphereGeometry(1.6, 16, 16),
  new THREE.MeshBasicMaterial({ color: 0x44aaff, transparent: true, opacity: 0.22, blending: THREE.AdditiveBlending })
);
ball.add(ballGlow);

// Stars
const starsGeo = new THREE.BufferGeometry();
const starArr = new Float32Array(500 * 3);
for (let i = 0; i < 500 * 3; i++) starArr[i] = (Math.random() - 0.5) * 200;
starsGeo.setAttribute('position', new THREE.BufferAttribute(starArr, 3));
const stars = new THREE.Points(starsGeo,
  new THREE.PointsMaterial({ color: 0x88ccff, size: 0.2, transparent: true, opacity: 0.55 }));
scene.add(stars);

// ============ AUDIO ============
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function playTone(freq, dur, type = 'sine', vol = 0.08) {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type;
  o.frequency.value = freq;
  g.gain.setValueAtTime(vol, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  o.connect(g).connect(audioCtx.destination);
  o.start();
  o.stop(audioCtx.currentTime + dur);
}
const playBeat = () => playTone(110, 0.08, 'sine', 0.05);
function playHit(perfect, combo) {
  if (perfect) {
    playTone(660 + combo * 12, 0.14, 'triangle', 0.13);
    setTimeout(() => playTone(990 + combo * 18, 0.14, 'triangle', 0.1), 35);
  } else {
    playTone(440 + combo * 8, 0.1, 'square', 0.09);
  }
}
function playMiss() {
  playTone(140, 0.35, 'sawtooth', 0.14);
  setTimeout(() => playTone(80, 0.35, 'sawtooth', 0.09), 50);
}

// ============ UI ============
const ui = {
  score: document.getElementById('score'),
  combo: document.getElementById('combo'),
  comboBox: document.getElementById('combo-box'),
  lives: document.getElementById('lives'),
  flash: document.getElementById('flash'),
  perfectFlash: document.getElementById('perfect-flash'),
  comboPopup: document.getElementById('combo-popup'),
  startScreen: document.getElementById('start-screen'),
  gameOver: document.getElementById('game-over'),
  finalScore: document.getElementById('final-score'),
  finalCombo: document.getElementById('final-combo'),
};

function updateUI() {
  ui.score.textContent = state.score;
  ui.combo.textContent = 'x' + state.combo;
  ui.comboBox.classList.toggle('active', state.combo > 1);
  ui.lives.textContent = '♥'.repeat(Math.max(0, state.lives)) || '—';
}
function flash(kind) {
  if (kind === 'perfect') {
    ui.perfectFlash.style.opacity = '1';
    setTimeout(() => ui.perfectFlash.style.opacity = '0', 130);
  } else {
    ui.flash.style.opacity = '1';
    setTimeout(() => ui.flash.style.opacity = '0', 200);
  }
}
function showComboPopup(text, color) {
  ui.comboPopup.textContent = text;
  ui.comboPopup.style.color = color;
  ui.comboPopup.style.transition = 'none';
  ui.comboPopup.style.opacity = '1';
  ui.comboPopup.style.transform = 'translate(-50%, -50%) scale(1)';
  void ui.comboPopup.offsetHeight;
  ui.comboPopup.style.transition = 'all 0.55s ease-out';
  ui.comboPopup.style.transform = 'translate(-50%, -140%) scale(1.6)';
  ui.comboPopup.style.opacity = '0';
}

// ============ SPAWN & RESOLVE ============
function spawnRing(spawnTime) {
  const geo = new THREE.TorusGeometry(2, 0.12, 8, 40);
  const mat = new THREE.MeshStandardMaterial({
    color: 0xff44aa, emissive: 0xff44aa, emissiveIntensity: 1.8,
    transparent: true, opacity: 0.95,
  });
  const ring = new THREE.Mesh(geo, mat);
  ring.position.set(0, 1, SPAWN_Z);
  ring.userData = {
    spawnTime,
    crossTime: spawnTime + APPROACH_MS,
    resolved: false,
    fadeTime: 0,
  };
  scene.add(ring);
  state.rings.push(ring);
}

function burst(pos, color, count, speed) {
  const geo = new THREE.BufferGeometry();
  const posArr = new Float32Array(count * 3);
  const vel = [];
  for (let i = 0; i < count; i++) {
    posArr[i * 3] = pos.x;
    posArr[i * 3 + 1] = pos.y;
    posArr[i * 3 + 2] = pos.z;
    const t = Math.random() * Math.PI * 2;
    const p = Math.random() * Math.PI * 2;
    const v = speed * (0.5 + Math.random());
    vel.push({
      vx: Math.cos(t) * Math.cos(p) * v,
      vy: Math.sin(p) * v,
      vz: Math.sin(t) * Math.cos(p) * v,
    });
  }
  geo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
  const mat = new THREE.PointsMaterial({
    color, size: 0.28, transparent: true, opacity: 1, blending: THREE.AdditiveBlending,
  });
  const points = new THREE.Points(geo, mat);
  scene.add(points);
  state.particles.push({ points, velocities: vel, life: 1, positions: posArr });
}

function resolveRing(ring, quality) {
  if (ring.userData.resolved) return;
  ring.userData.resolved = true;
  const pos = ring.position.clone();

  if (quality === 'perfect') {
    state.combo++;
    state.bestCombo = Math.max(state.bestCombo, state.combo);
    state.score += 100 * state.combo;
    playHit(true, state.combo);
    flash('perfect');
    showComboPopup('PERFECT', '#ffdd44');
    burst(pos, 0xffdd44, 44, 28);
    state.shakeAmount = 9;
  } else if (quality === 'good') {
    state.combo++;
    state.bestCombo = Math.max(state.bestCombo, state.combo);
    state.score += 50 * state.combo;
    playHit(false, state.combo);
    showComboPopup('GOOD', '#44ddff');
    burst(pos, 0x44ddff, 22, 16);
    state.shakeAmount = 4;
  } else if (quality === 'miss') {
    state.combo = 0;
    state.lives--;
    playMiss();
    flash('miss');
    showComboPopup('MISS', '#ff4466');
    state.shakeAmount = 16;
    if (state.lives <= 0) gameOver();
  }
  updateUI();
}

// ============ INPUT ============
function handlePress() {
  if (!state.running) return;
  const now = performance.now();
  let best = null, bestDist = Infinity;
  for (const ring of state.rings) {
    if (ring.userData.resolved) continue;
    const d = Math.abs(now - ring.userData.crossTime);
    if (d < HIT_WINDOW && d < bestDist) {
      best = ring;
      bestDist = d;
    }
  }
  if (best) {
    resolveRing(best, bestDist < PERFECT_WINDOW ? 'perfect' : 'good');
  } else {
    state.score = Math.max(0, state.score - 10);
    state.shakeAmount = 5;
    updateUI();
  }
}

// ============ GAME FLOW ============
function startGame() {
  initAudio();
  // Cleanup
  for (const r of state.rings) { scene.remove(r); r.geometry.dispose(); r.material.dispose(); }
  state.rings = [];
  for (const p of state.particles) { scene.remove(p.points); p.points.geometry.dispose(); p.points.material.dispose(); }
  state.particles = [];

  state.score = 0; state.combo = 0; state.bestCombo = 0; state.lives = 3;
  state.running = true;
  state.lastBeatTime = performance.now();
  state.shakeAmount = 0;
  camera.position.copy(state.cameraBase);

  ui.startScreen.classList.add('hidden');
  ui.gameOver.classList.add('hidden');
  updateUI();
}

function gameOver() {
  state.running = false;
  ui.finalScore.textContent = state.score;
  ui.finalCombo.textContent = 'Best combo: x' + state.bestCombo;
  setTimeout(() => ui.gameOver.classList.remove('hidden'), 400);
}

// ============ EVENTS ============
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'KeyR') {
    e.preventDefault();
    if (state.running && e.code === 'Space') handlePress();
    else if (!state.running) startGame();
  }
});
window.addEventListener('pointerdown', () => { if (state.running) handlePress(); });
document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('restart-btn').addEventListener('click', startGame);
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ============ LOOP ============
let lastFrame = performance.now();
function tick() {
  requestAnimationFrame(tick);
  const now = performance.now();
  const dt = Math.min(0.05, (now - lastFrame) / 1000);
  lastFrame = now;

  if (state.running) {
    // Beat scheduler (sub-frame accurate)
    while (now - state.lastBeatTime >= BEAT_MS) {
      state.lastBeatTime += BEAT_MS;
      spawnRing(state.lastBeatTime);
      playBeat();
      ball.scale.setScalar(1.35);
    }

    // Rings
    for (let i = state.rings.length - 1; i >= 0; i--) {
      const ring = state.rings[i];
      const ud = ring.userData;

      if (!ud.resolved) {
        const elapsed = (now - ud.spawnTime) / 1000;
        ring.position.z = SPAWN_Z + RING_SPEED * elapsed;

        // Color feedback by proximity
        const diff = Math.abs(now - ud.crossTime);
        let col = 0xff44aa;
        if (diff < PERFECT_WINDOW) col = 0xffdd44;
        else if (diff < HIT_WINDOW) col = 0x44ffaa;
        ring.material.color.setHex(col);
        ring.material.emissive.setHex(col);

        if (now > ud.crossTime + HIT_WINDOW) {
          resolveRing(ring, 'miss');
          if (!state.running) break;
        }
      } else {
        ud.fadeTime += dt;
        const t = ud.fadeTime / 0.45;
        if (t >= 1) {
          scene.remove(ring);
          ring.geometry.dispose();
          ring.material.dispose();
          state.rings.splice(i, 1);
          continue;
        }
        ring.scale.setScalar(1 + t * 2.5);
        ring.material.opacity = 1 - t;
        ring.material.emissiveIntensity = 1.8 * (1 - t);
      }
    }

    // Particles
    for (let i = state.particles.length - 1; i >= 0; i--) {
      const p = state.particles[i];
      p.life -= dt / 0.7;
      if (p.life <= 0) {
        scene.remove(p.points);
        p.points.geometry.dispose();
        p.points.material.dispose();
        state.particles.splice(i, 1);
        continue;
      }
      for (let j = 0; j < p.velocities.length; j++) {
        p.positions[j * 3]     += p.velocities[j].vx * dt;
        p.positions[j * 3 + 1] += p.velocities[j].vy * dt;
        p.positions[j * 3 + 2] += p.velocities[j].vz * dt;
        p.velocities[j].vy -= 18 * dt;
        p.velocities[j].vx *= 0.97;
        p.velocities[j].vz *= 0.97;
      }
      p.points.geometry.attributes.position.needsUpdate = true;
      p.points.material.opacity = p.life;
    }
  }

  // Ball idle animation
  ball.scale.lerp(ONE, dt * 10);
  ball.rotation.x += dt * 0.6;
  ball.rotation.y += dt * 0.8;
  const pulse = 1 + Math.sin(now * 0.005) * 0.06;
  ballGlow.scale.setScalar(pulse);

  // Camera shake
  if (state.shakeAmount > 0.1) {
    state.shakeAmount *= Math.pow(0.005, dt);
    camera.position.x = state.cameraBase.x + (Math.random() - 0.5) * state.shakeAmount * 0.06;
    camera.position.y = state.cameraBase.y + (Math.random() - 0.5) * state.shakeAmount * 0.06;
  } else {
    state.shakeAmount = 0;
    camera.position.x += (state.cameraBase.x - camera.position.x) * dt * 6;
    camera.position.y += (state.cameraBase.y - camera.position.y) * dt * 6;
  }
  camera.lookAt(0, 1, -15);

  stars.rotation.y += dt * 0.02;

  renderer.render(scene, camera);
}

tick();
</script>
</body>
</html>
