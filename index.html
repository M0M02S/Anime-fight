<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#08080f">
<title>RNG SKIN IDLE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #08080f;
  --panel: #12121c;
  --panel2: #1a1a26;
  --line: #2a2a3d;
  --line2: #3a3a55;
  --text: #e2e8f0;
  --muted: #64748b;
  --gold: #fbbf24;
  --green: #4ade80;
  --red: #f87171;
  --purple: #a78bfa;
  --cyan: #22d3ee;
}

html, body { height: 100%; }

body {
  font-family: 'VT323', monospace;
  font-size: 18px;
  color: var(--text);
  background: var(--bg);
  overflow-x: hidden;
  overscroll-behavior: none;
  min-height: 100vh;
  position: relative;
}

/* === ANIMATED BACKGROUND === */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 15% 20%, rgba(124, 58, 237, 0.18) 0%, transparent 40%),
    radial-gradient(circle at 85% 75%, rgba(34, 211, 238, 0.15) 0%, transparent 40%),
    radial-gradient(circle at 50% 100%, rgba(236, 72, 153, 0.12) 0%, transparent 50%);
  animation: bgPulse 10s ease-in-out infinite;
  pointer-events: none;
  z-index: -2;
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(124, 58, 237, 0.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(124, 58, 237, 0.06) 1px, transparent 1px);
  background-size: 48px 48px;
  animation: gridScroll 20s linear infinite;
  pointer-events: none;
  z-index: -1;
}

@keyframes bgPulse {
  0%, 100% { opacity: 0.9; }
  50% { opacity: 0.6; }
}

@keyframes gridScroll {
  from { background-position: 0 0, 0 0; }
  to { background-position: 48px 48px, 48px 48px; }
}

/* Scanlines overlay */
.scanlines {
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    rgba(0, 0, 0, 0.15) 0px,
    rgba(0, 0, 0, 0.15) 1px,
    transparent 1px,
    transparent 3px
  );
  pointer-events: none;
  z-index: 90;
  mix-blend-mode: multiply;
}

/* === TOPBAR === */
.topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(8, 8, 15, 0.92);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--line);
  padding: 8px 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.logo {
  font-family: 'Press Start 2P', monospace;
  font-size: 11px;
  color: var(--text);
  letter-spacing: 1px;
  text-shadow: 0 0 8px var(--purple), 2px 2px 0 #000;
  white-space: nowrap;
}
.logo span { color: var(--gold); }

.stats-bar {
  margin-left: auto;
  display: flex;
  gap: 6px;
}

.stat-box {
  background: var(--panel);
  border: 2px solid var(--line);
  padding: 4px 10px;
  min-width: 90px;
  text-align: center;
  border-radius: 4px;
}
.stat-label {
  font-family: 'Press Start 2P', monospace;
  font-size: 6px;
  color: var(--muted);
  letter-spacing: 1px;
  display: block;
  margin-bottom: 2px;
}
.stat-value {
  font-family: 'VT323', monospace;
  font-size: 20px;
  font-weight: bold;
  display: block;
  line-height: 1;
}
.stat-box.coins { border-color: var(--gold); box-shadow: 0 0 12px rgba(251,191,36,0.2); }
.stat-box.coins .stat-value { color: var(--gold); text-shadow: 0 0 6px rgba(251,191,36,0.5); }
.stat-box.cps { border-color: var(--green); }
.stat-box.cps .stat-value { color: var(--green); text-shadow: 0 0 6px rgba(74,222,128,0.5); }

/* === TABS === */
.tabs {
  display: flex;
  gap: 4px;
  padding: 10px 12px;
  background: rgba(8, 8, 15, 0.85);
  border-bottom: 2px solid var(--line);
  overflow-x: auto;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }

.tab {
  font-family: 'Press Start 2P', monospace;
  font-size: 8px;
  padding: 10px 14px;
  background: var(--panel);
  color: var(--muted);
  border: 2px solid var(--line);
  cursor: pointer;
  letter-spacing: 1px;
  transition: all .15s;
  white-space: nowrap;
  border-radius: 4px;
  min-height: 44px;
  touch-action: manipulation;
}
.tab:active { transform: scale(0.95); }
.tab.active {
  background: var(--panel2);
  color: var(--gold);
  border-color: var(--gold);
  box-shadow: 0 0 0 2px rgba(251,191,36,0.2), inset 0 0 12px rgba(251,191,36,0.1);
}

/* === MAIN === */
main {
  max-width: 1200px;
  margin: 0 auto;
  padding: 14px 12px 80px;
}

.view { display: none; }
.view.active { display: block; animation: fadeUp .3s ease; }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}

.section-title {
  font-family: 'Press Start 2P', monospace;
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 2px;
  margin: 20px 0 12px;
  padding-left: 10px;
  border-left: 4px solid var(--gold);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.section-title:first-child { margin-top: 0; }
.section-title .hint {
  font-family: 'VT323', monospace;
  font-size: 14px;
  color: var(--gold);
  letter-spacing: 0;
}

/* Toggle row */
.toggle-row {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  margin-bottom: 14px;
  font-family: 'Press Start 2P', monospace;
  font-size: 8px;
  color: var(--muted);
  letter-spacing: 1px;
  align-items: center;
}
.toggle-row label {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  min-height: 40px;
  padding: 6px 10px;
  background: var(--panel);
  border: 2px solid var(--line);
  border-radius: 4px;
  touch-action: manipulation;
}
.toggle-row label:active { transform: scale(0.96); }
.toggle-row input { accent-color: var(--gold); width: 16px; height: 16px; }

.reset-btn {
  font-family: 'Press Start 2P', monospace;
  font-size: 8px;
  padding: 10px 14px;
  background: #3b0a0a;
  color: var(--red);
  border: 2px solid var(--red);
  border-radius: 4px;
  cursor: pointer;
  letter-spacing: 1px;
  min-height: 40px;
  touch-action: manipulation;
  margin-left: auto;
}
.reset-btn:active { transform: scale(0.95); }

/* === BOXES === */
.box-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 12px;
}

.box {
  position: relative;
  background: linear-gradient(160deg, var(--c1), var(--c2));
  border: 3px solid var(--glow);
  padding: 16px 10px;
  text-align: center;
  cursor: pointer;
  transition: transform .15s, box-shadow .15s;
  overflow: hidden;
  border-radius: 6px;
  touch-action: manipulation;
  min-height: 200px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 0 rgba(0,0,0,0.4), inset 0 0 20px rgba(255,255,255,0.05);
}
.box::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.2) 50%, transparent 70%);
  transform: translateX(-100%);
  transition: transform .5s;
  pointer-events: none;
}
.box:active:not(.locked) {
  transform: translateY(3px);
  box-shadow: 0 1px 0 rgba(0,0,0,0.4), inset 0 0 20px rgba(255,255,255,0.05);
}
.box.locked { filter: grayscale(0.9) brightness(0.45); cursor: not-allowed; }
.box.locked::after {
  content: "🔒";
  position: absolute;
  top: 8px; right: 8px;
  font-size: 18px;
  filter: grayscale(1);
  opacity: 0.8;
}

.box-pixel {
  width: 80px;
  height: 80px;
  margin: 0 auto 10px;
  image-rendering: pixelated;
  filter: drop-shadow(0 3px 6px rgba(0,0,0,0.7));
  animation: boxFloat 3s ease-in-out infinite;
}
@keyframes boxFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}

.box-name {
  font-family: 'Press Start 2P', monospace;
  font-size: 8px;
  color: #fff;
  letter-spacing: 1px;
  margin-bottom: 8px;
  text-shadow: 2px 2px 0 rgba(0,0,0,0.7);
  line-height: 1.6;
}
.box-cost {
  color: var(--gold);
  font-size: 22px;
  font-weight: bold;
  text-shadow: 0 0 10px rgba(251,191,36,0.6), 2px 2px 0 rgba(0,0,0,0.6);
  line-height: 1;
}
.box-luck {
  display: inline-block;
  background: rgba(0,0,0,0.5);
  padding: 3px 10px;
  margin-top: 8px;
  font-size: 14px;
  color: #fff;
  border: 1px solid rgba(255,255,255,0.25);
  border-radius: 3px;
  letter-spacing: 1px;
}

/* === INVENTORY / COLLECTION === */
.inv-grid, .collection-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
  gap: 8px;
}

.skin-card {
  position: relative;
  background: linear-gradient(160deg, var(--g1), var(--g2));
  border: 2px solid var(--rc);
  padding: 10px 6px;
  text-align: center;
  overflow: hidden;
  border-radius: 4px;
  transition: transform .15s, box-shadow .15s;
  box-shadow: 0 0 10px rgba(0,0,0,0.5);
}
.skin-card:active { transform: scale(0.97); }

.skin-pixel {
  width: 56px;
  height: 56px;
  margin: 0 auto 6px;
  image-rendering: pixelated;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.7));
}
.skin-name {
  font-family: 'Press Start 2P', monospace;
  font-size: 6px;
  color: #fff;
  letter-spacing: .5px;
  line-height: 1.6;
  margin-bottom: 4px;
  min-height: 20px;
  text-shadow: 1px 1px 0 rgba(0,0,0,0.7);
}
.skin-rarity {
  font-family: 'Press Start 2P', monospace;
  font-size: 6px;
  color: var(--rc);
  letter-spacing: .5px;
  margin-bottom: 4px;
  text-shadow: 0 0 6px var(--rc);
}
.skin-cps {
  color: var(--green);
  font-size: 15px;
  font-weight: bold;
  text-shadow: 0 0 6px rgba(74,222,128,0.5);
}
.skin-count {
  position: absolute;
  top: 3px;
  right: 3px;
  background: rgba(0,0,0,0.75);
  color: #fff;
  font-size: 11px;
  padding: 1px 5px;
  border: 1px solid var(--rc);
  font-family: 'Press Start 2P', monospace;
  border-radius: 2px;
}
.skin-card.shiny::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(120deg, transparent 40%, rgba(255,255,255,0.35) 50%, transparent 60%);
  transform: translateX(-100%);
  animation: shine 2.5s infinite;
  pointer-events: none;
}
@keyframes shine {
  0% { transform: translateX(-100%); }
  50% { transform: translateX(100%); }
  100% { transform: translateX(100%); }
}

.collection-grid .skin-card.unknown {
  background: #0d0d15;
  border-color: #1f1f2e;
  box-shadow: none;
}
.collection-grid .skin-card.unknown .skin-pixel { filter: brightness(0) opacity(0.3); }
.collection-grid .skin-card.unknown .skin-name,
.collection-grid .skin-card.unknown .skin-rarity,
.collection-grid .skin-card.unknown .skin-cps { color: #2a2a3d; text-shadow: none; }

/* === STATS === */
.stats-panel {
  background: var(--panel);
  border: 2px solid var(--line);
  padding: 16px;
  border-radius: 4px;
}
.stat-row {
  display: flex;
  justify-content: space-between;
  border-bottom: 1px dashed var(--line);
  padding: 10px 0;
  font-size: 18px;
}
.stat-row:last-child { border-bottom: none; }
.stat-row .k { color: var(--muted); }
.stat-row .v { color: var(--text); font-weight: bold; }
.stat-row .v.gold { color: var(--gold); }
.stat-row .v.green { color: var(--green); }

/* === LOG === */
.log {
  background: var(--panel);
  border: 2px solid var(--line);
  padding: 12px;
  max-height: 180px;
  overflow-y: auto;
  line-height: 1.8;
  border-radius: 4px;
}
.log-entry {
  padding: 3px 0;
  font-size: 16px;
  animation: slideIn .3s ease;
  border-bottom: 1px solid rgba(42,42,61,0.4);
}
.log-entry:last-child { border-bottom: none; }
@keyframes slideIn {
  from { opacity: 0; transform: translateX(-8px); }
  to { opacity: 1; transform: none; }
}
.log-entry .time { color: var(--muted); margin-right: 6px; font-size: 14px; }

/* === REVEAL OVERLAY === */
.reveal-overlay {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at center, rgba(8,8,15,0.8), rgba(0,0,0,0.99));
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  opacity: 1;
  transition: opacity .25s;
}
.reveal-overlay.hidden { opacity: 0; pointer-events: none; }

.reveal-stage {
  position: relative;
  width: 90vw;
  max-width: 380px;
  height: 500px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Flash */
.flash {
  position: fixed;
  inset: 0;
  background: white;
  opacity: 0;
  pointer-events: none;
  z-index: 210;
}
.flash.go { animation: flashAnim .35s ease-out; }
@keyframes flashAnim {
  0% { opacity: 0; }
  15% { opacity: 1; }
  100% { opacity: 0; }
}

/* Screen shake */
.shake-screen { animation: screenShake .5s ease-out; }
@keyframes screenShake {
  0%, 100% { transform: translate(0,0); }
  15% { transform: translate(-8px, 6px); }
  30% { transform: translate(8px, -6px); }
  45% { transform: translate(-6px, 8px); }
  60% { transform: translate(6px, -8px); }
  75% { transform: translate(-3px, 4px); }
}

/* Rays */
.rays {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
}
.rays.grow { animation: raysGrow 2s ease-out forwards; }
@keyframes raysGrow {
  0% { opacity: 0; transform: scale(0.2) rotate(0deg); }
  30% { opacity: 0.8; }
  100% { opacity: 0; transform: scale(3) rotate(45deg); }
}
.rays svg { width: 100%; height: 100%; max-width: 500px; max-height: 500px; }

/* Reveal Box */
.reveal-box {
  position: absolute;
  width: 160px;
  height: 160px;
  background: linear-gradient(160deg, var(--c1), var(--c2));
  border: 4px solid var(--glow);
  border-radius: 12px;
  box-shadow: 0 0 60px var(--glow), inset 0 0 30px rgba(255,255,255,0.1);
  display: flex;
  align-items: center;
  justify-content: center;
  image-rendering: pixelated;
  transform: translateY(-100vh) rotate(-25deg);
  opacity: 0;
}
.reveal-box svg { width: 110px; height: 110px; image-rendering: pixelated; }
.reveal-box.enter { animation: boxEnter .6s cubic-bezier(.34,1.56,.64,1) forwards; }
@keyframes boxEnter {
  0% { transform: translateY(-100vh) rotate(-25deg); opacity: 0; }
  60% { opacity: 1; }
  100% { transform: translateY(0) rotate(0) scale(1); opacity: 1; }
}
.reveal-box.shake { animation: boxShake .9s cubic-bezier(.36,.07,.19,.97) forwards; }
@keyframes boxShake {
  0% { transform: translate(0,0) rotate(0) scale(1); }
  10% { transform: translate(-6px, 3px) rotate(-5deg) scale(1.05); }
  20% { transform: translate(6px, -3px) rotate(5deg) scale(1.1); }
  30% { transform: translate(-8px, 5px) rotate(-7deg) scale(1.15); }
  40% { transform: translate(8px, -5px) rotate(7deg) scale(1.2); }
  50% { transform: translate(-10px, 7px) rotate(-9deg) scale(1.25); }
  60% { transform: translate(10px, -7px) rotate(9deg) scale(1.3); }
  70% { transform: translate(-12px, 8px) rotate(-10deg) scale(1.35); }
  80% { transform: translate(12px, -8px) rotate(10deg) scale(1.4); }
  90% { transform: translate(-8px, 5px) rotate(-6deg) scale(1.45); }
  100% { transform: translate(0,0) rotate(0) scale(1.5); }
}
.reveal-box.burst { animation: boxBurst .4s ease-out forwards; }
@keyframes boxBurst {
  0% { transform: scale(1.5); opacity: 1; filter: brightness(1); }
  50% { transform: scale(2); opacity: 0.8; filter: brightness(3); }
  100% { transform: scale(2.5); opacity: 0; filter: brightness(5); }
}

/* Reveal Card */
.reveal-card {
  position: absolute;
  width: 88vw;
  max-width: 260px;
  background: linear-gradient(160deg, var(--g1), var(--g2));
  border: 4px solid var(--rc);
  border-radius: 8px;
  padding: 22px 14px;
  text-align: center;
  box-shadow: 0 0 70px var(--rc), inset 0 0 40px rgba(255,255,255,0.06);
  display: none;
}
.reveal-card.show {
  display: block;
  animation: cardReveal .7s cubic-bezier(.34,1.56,.64,1) forwards;
}
@keyframes cardReveal {
  0% { transform: perspective(800px) rotateY(180deg) scale(0.2); opacity: 0; }
  60% { transform: perspective(800px) rotateY(0deg) scale(1.1); opacity: 1; }
  100% { transform: perspective(800px) rotateY(0deg) scale(1); opacity: 1; }
}
.rc-pixel {
  width: 130px;
  height: 130px;
  margin: 0 auto 12px;
  image-rendering: pixelated;
  filter: drop-shadow(0 0 14px var(--rc));
  animation: floatPx 2.5s ease-in-out infinite;
}
@keyframes floatPx {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}
.rc-rarity {
  font-family: 'Press Start 2P', monospace;
  font-size: 11px;
  color: var(--rc);
  letter-spacing: 3px;
  margin-bottom: 10px;
  text-shadow: 0 0 14px var(--rc);
  animation: pulseRarity 1s ease-in-out infinite;
}
@keyframes pulseRarity {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.7; }
}
.rc-name {
  font-family: 'Press Start 2P', monospace;
  font-size: 11px;
  color: #fff;
  letter-spacing: 1px;
  line-height: 1.8;
  margin-bottom: 12px;
  text-shadow: 2px 2px 0 rgba(0,0,0,0.7);
}
.rc-cps {
  color: var(--green);
  font-size: 22px;
  font-weight: bold;
  text-shadow: 0 0 10px rgba(74,222,128,0.6);
}

/* Particles */
.particle {
  position: absolute;
  width: 8px;
  height: 8px;
  pointer-events: none;
  z-index: 205;
}
@keyframes particleFly {
  0% { opacity: 1; transform: translate(0,0) scale(1) rotate(0); }
  100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0) rotate(var(--rot)); }
}

/* Reveal Hint */
.reveal-hint {
  position: absolute;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  font-family: 'Press Start 2P', monospace;
  font-size: 8px;
  color: var(--muted);
  letter-spacing: 2px;
  text-align: center;
  opacity: 0;
  transition: opacity .3s;
  white-space: nowrap;
}
.reveal-hint.show {
  opacity: 1;
  animation: hintBlink 1.4s ease-in-out infinite;
}
@keyframes hintBlink {
  0%, 100% { opacity: 0.4; }
  50% { opacity: 1; }
}

/* === TOAST === */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--panel2);
  color: var(--red);
  border: 2px solid var(--red);
  padding: 12px 18px;
  font-family: 'Press Start 2P', monospace;
  font-size: 8px;
  letter-spacing: 1px;
  opacity: 0;
  pointer-events: none;
  transition: all .25s;
  z-index: 250;
  border-radius: 4px;
  box-shadow: 0 0 24px rgba(248,113,113,0.4);
  max-width: 90vw;
  text-align: center;
  line-height: 1.6;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* === FLOATING COIN === */
.float-coin {
  position: fixed;
  font-family: 'Press Start 2P', monospace;
  font-size: 10px;
  color: var(--gold);
  pointer-events: none;
  z-index: 150;
  text-shadow: 2px 2px 0 #000;
  animation: floatCoin 1s ease-out forwards;
}
@keyframes floatCoin {
  0% { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(-40px) scale(1.3); }
}

/* === EMPTY STATE === */
.empty-msg {
  grid-column: 1/-1;
  color: var(--muted);
  padding: 30px 20px;
  text-align: center;
  font-size: 18px;
}

/* === RESPONSIVE === */
@media (max-width: 600px) {
  .logo { font-size: 9px; }

/* ==========================================================
   PIXEL RENDERING
========================================================== */
function renderPixel(art, size) {
  const { p, g } = art;
  let rects = '';
  for (let y = 0; y < g.length; y++) {
    const row = g[y];
    for (let x = 0; x < row.length; x++) {
      const c = row[x];
      if (c !== '.' && p[c]) {
        rects += `<rect x="${x}" y="${y}" width="1" height="1" fill="${p[c]}"/>`;
      }
    }
  }
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 12" width="${size}" height="${size}" shape-rendering="crispEdges">${rects}</svg>`;
}

/* ==========================================================
   HELPERS
========================================================== */
function $(id) { return document.getElementById(id); }
function fmt(n) {
  n = Math.floor(n);
  if (n >= 1e12) return (n/1e12).toFixed(2) + 'T';
  if (n >= 1e9) return (n/1e9).toFixed(2) + 'B';
  if (n >= 1e6) return (n/1e6).toFixed(2) + 'M';
  if (n >= 1e3) return (n/1e3).toFixed(2) + 'K';
  return n.toString();
}

function getCps() {
  return SKINS.reduce((sum, s) => sum + (owned[s.id] || 0) * s.cps, 0);
}
function getSkinCount() {
  return Object.values(owned).reduce((a, b) => a + b, 0);
}
function getDiscovered() {
  return Object.values(owned).filter(v => v > 0).length;
}

/* ==========================================================
   SOUND (Web Audio)
========================================================== */
function initAudio() {
  if (!audioCtx) {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) { audioCtx = null; }
  }
}

function playTone(freq, dur, type) {
  if (!soundEnabled || !audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}

function playRarityChime(rarity) {
  const notes = [
    [220],
    [330, 440],
    [440, 550, 660],
    [550, 660, 880],
    [660, 880, 1100, 1320],
    [880, 1100, 1320, 1650, 1980]
  ][rarity];
  notes.forEach((f, i) => setTimeout(() => playTone(f, 0.25, 'triangle'), i * 90));
}

/* ==========================================================
   RENDERING
========================================================== */
function updateStats() {
  $('coinDisplay').textContent = fmt(coins);
  $('cpsDisplay').textContent = fmt(getCps());
}

function renderBoxes() {
  const grid = $('boxGrid');
  grid.innerHTML = '';
  BOXES.forEach((box, i) => {
    const locked = coins < box.cost;
    const el = document.createElement('div');
    el.className = 'box' + (locked ? ' locked' : '');
    el.style.setProperty('--c1', box.c1);
    el.style.setProperty('--c2', box.c2);
    el.style.setProperty('--glow', box.glow);
    el.innerHTML = `
      <div class="box-pixel">${renderPixel(BOX_ART[box.id], 80)}</div>
      <div class="box-name">${box.name}</div>
      <div class="box-cost">${fmt(box.cost)}</div>
      <div class="box-luck">🍀 ×${box.luck}</div>
    `;
    el.addEventListener('click', () => tryOpenBox(i));
    grid.appendChild(el);
  });
}

  if (entries.length === 0) {
    grid.innerHTML = '<div class="empty-msg">Noch keine Skins. Öffne eine Box!</div>';
    return;
  }
  entries.sort((a, b) => {
    const sa = SKINS.find(s => s.id === a[0]);
    const sb = SKINS.find(s => s.id === b[0]);
    return sb.rarity - sa.rarity || sb.cps - sa.cps;
  });
  grid.innerHTML = entries.map(([id, count]) => renderSkinCard(id, count, false)).join('');
}

function renderSkinCard(id, count, unknown) {
  const skin = SKINS.find(s => s.id === id);
  const r = RARITIES[skin.rarity];
  const shiny = skin.rarity >= 4 && !unknown;
  if (unknown) {
    return `
      <div class="skin-card unknown" style="--rc:${r.color};--g1:${r.g1};--g2:${r.g2}">
        <div class="skin-pixel">${renderPixel(ART[skin.id], 56)}</div>
        <div class="skin-name">???</div>
        <div class="skin-rarity">${r.name}</div>
        <div class="skin-cps">+${skin.cps}/s</div>
      </div>
    `;
  }
  return `
    <div class="skin-card${shiny ? ' shiny' : ''}" style="--rc:${r.color};--g1:${r.g1};--g2:${r.g2}">
      <div class="skin-count">×${count}</div>
      <div class="skin-pixel">${renderPixel(ART[skin.id], 56)}</div>
      <div class="skin-name">${skin.name}</div>
      <div class="skin-rarity">${r.name}</div>
      <div class="skin-cps">+${fmt(skin.cps)}/s</div>
    </div>
  `;
}

function renderCollection() {
  const grid = $('collectionGrid');
  grid.innerHTML = SKINS.map(skin => {
    const owned_count = owned[skin.id] || 0;
    return renderSkinCard(skin.id, owned_count, owned_count === 0);
  }).join('');
  $('collectionCount').textContent = `${getDiscovered()}/${SKINS.length}`;
}

function renderStats() {
  const totalSkins = getSkinCount();
  const discovered = getDiscovered();
  const cps = getCps();
  $('statsPanel').innerHTML = `
    <div class="stat-row"><span class="k">Münzen</span><span class="v gold">${fmt(coins)}</span></div>
    <div class="stat-row"><span class="k">Münzen/Sekunde</span><span class="v green">${fmt(cps)}</span></div>
    <div class="stat-row"><span class="k">Skins gesamt</span><span class="v">${totalSkins}</span></div>
    <div class="stat-row"><span class="k">Skins entdeckt</span><span class="v">${discovered}/${SKINS.length}</span></div>
    <div class="stat-row"><span class="k">Boxen geöffnet</span><span class="v">${totalOpened}</span></div>
    <div class="stat-row"><span class="k">Pity-Zähler</span><span class="v">${pityCounter}/15</span></div>
    <div class="stat-row"><span class="k">Münzen/Minute</span><span class="v green">${fmt(cps * 60)}</span></div>
    <div class="stat-row"><span class="k">Münzen/Stunde</span><span class="v green">${fmt(cps * 3600)}</span></div>
  `;
}

function addLog(html) {
  const now = new Date();
  const time = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
  logEntries.unshift({ time, html });
  if (logEntries.length > 20) logEntries.pop();
  $('log').innerHTML = logEntries.map(e => 
    `<div class="log-entry"><span class="time">${e.time}</span>${e.html}</div>`
  ).join('');
}

function updateBoxHint() {
  const cheapest = BOXES.find(b => coins >= b.cost);
  $('boxHint').textContent = cheapest ? '✓ kaufbar' : '';
}

function refreshUI() {
  updateStats();
  updateBoxHint();
  renderInventory();
}

/* ==========================================================
   RARITY ROLL
========================================================== */
function chooseRarity(luck) {
  const weights = RARITIES.map((r, i) => r.weight * Math.pow(luck, i));
  const total = weights.reduce((a, b) => a + b, 0);
  let roll = Math.random() * total;
  for (let i = 0; i < weights.length; i++) {
    roll -= weights[i];
    if (roll <= 0) return i;
  }
  return 0;
}

/* ==========================================================
   OPEN BOX
========================================================== */
function tryOpenBox(index) {
  if (animating) return;
  initAudio();

  const box = BOXES[index];
  if (coins < box.cost) {
    showToast('NICHT GENUG MÜNZEN!');
    playTone(110, 0.15, 'sawtooth');
    return;
  }

  coins -= box.cost;
  totalOpened++;
  pityCounter++;

  let rarityIndex = chooseRarity(box.luck);

  // Pity: nach 15 Boxen ohne Rare+ gibt's eine Rare
  if (pityCounter >= 15 && rarityIndex < 2) {
    rarityIndex = 2;
  }
  if (rarityIndex >= 2) pityCounter = 0;

  const pool = SKINS.filter(s => s.rarity === rarityIndex);
  const skin = pool[Math.floor(Math.random() * pool.length)];
  owned[skin.id] = (owned[skin.id] || 0) + 1;

  const r = RARITIES[rarityIndex];
  addLog(`<span style="color:${r.color};font-weight:bold">${r.name}</span> · ${skin.name} <span style="color:var(--green)">+${fmt(skin.cps)}/s</span>`);

  updateStats();
  renderBoxes();
  renderInventory();
  updateBoxHint();

  if ($('skipAnim').checked) {
    playRarityChime(rarityIndex);
    return;
  }

  playReveal(box, skin, rarityIndex);
}

/* ==========================================================
   REVEAL ANIMATION
========================================================== */
function playReveal(box, skin, rarityIndex) {
  animating = true;
  canCloseReveal = false;

  const overlay = $('revealOverlay');
  const stage = $('revealStage');
  const revealBox = $('revealBox');
  const revealCard = $('revealCard');
  const revealRays = $('revealRays');
  const hint = $('revealHint');
  const flash = $('flash');

  stage.querySelectorAll('.particle').forEach(p => p.remove());

  revealBox.style.display = 'flex';
  revealBox.style.setProperty('--c1', box.c1);
  revealBox.style.setProperty('--c2', box.c2);
  revealBox.style.setProperty('--glow', box.glow);
  revealBox.innerHTML = renderPixel(BOX_ART[box.id], 110);
  revealBox.className = 'reveal-box enter';

  revealCard.style.display = 'none';
  revealCard.className = 'reveal-card';
  revealCard.innerHTML = '';
  revealRays.className = 'rays';
  revealRays.innerHTML = '';
  hint.classList.remove('show');

  overlay.classList.remove('hidden');

  const r = RARITIES[rarityIndex];

  // Phase 1: Box landet (0.6s)
  setTimeout(() => {
    revealBox.className = 'reveal-box shake';
    playTone(180 + rarityIndex * 40, 0.1, 'square');
    setTimeout(() => playTone(200 + rarityIndex * 40, 0.1, 'square'), 120);
    setTimeout(() => playTone(220 + rarityIndex * 40, 0.1, 'square'), 240);
    setTimeout(() => playTone(240 + rarityIndex * 40, 0.1, 'square'), 360);
    setTimeout(() => playTone(260 + rarityIndex * 40, 0.1, 'square'), 500);
    setTimeout(() => playTone(280 + rarityIndex * 40, 0.1, 'square'), 640);
  }, 600);

  // Phase 2: Burst (1.5s)
  setTimeout(() => {
    revealBox.className = 'reveal-box burst';
    document.body.classList.add('shake-screen');
    flash.classList.remove('go');
    void flash.offsetWidth;
    flash.classList.add('go');

    // Rays
    revealRays.innerHTML = `<svg viewBox="0 0 200 200">
      <defs>
        <radialGradient id="rg">
          <stop offset="0%" stop-color="${r.color}" stop-opacity="0.6"/>
          <stop offset="100%" stop-color="${r.color}" stop-opacity="0"/>
        </radialGradient>
      </defs>
      ${[0, 30, 60, 90, 120, 150].map(a => 
        `<rect x="98" y="0" width="4" height="100" fill="url(#rg)" transform="rotate(${a} 100 100)"/>`
      ).join('')}
    </svg>`;
    revealRays.className = 'rays grow';

    playRarityChime(rarityIndex);
    spawnParticles(rarityIndex, r.color);

    setTimeout(() => document.body.classList.remove('shake-screen'), 500);
  }, 1500);

  // Phase 3: Card Reveal (1.95s)
  setTimeout(() => {
    revealBox.style.display = 'none';

    revealCard.style.setProperty('--rc', r.color);
    revealCard.style.setProperty('--g1', r.g1);
    revealCard.style.setProperty('--g2', r.g2);
    revealCard.innerHTML = `
      <div class="rc-pixel">${renderPixel(ART[skin.id], 130)}</div>
      <div class="rc-rarity">${r.name}</div>
      <div class="rc-name">${skin.name}</div>
      <div class="rc-cps">+${fmt(skin.cps)}/s</div>
    `;
    revealCard.style.display = 'block';
    revealCard.className = 'reveal-card show';

    if (rarityIndex >= 3) spawnParticles(rarityIndex, r.color, 20);
    if (rarityIndex >= 4) setTimeout(() => spawnParticles(rarityIndex, r.color, 20), 200);

    hint.classList.add('show');
    canCloseReveal = true;
  }, 1950);
}

function spawnParticles(rarity, color, count) {
  count = count || 14;
  const stage = $('revealStage');
  const cx = stage.offsetWidth / 2;
  const cy = stage.offsetHeight / 2;

  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const angle = Math.random() * Math.PI * 2;
    const dist = 100 + Math.random() * 200;
    p.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
    p.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
    p.style.setProperty('--rot', Math.random() * 720 + 'deg');
    p.style.left = cx + 'px';
    p.style.top = cy + 'px';
    p.style.background = color;
    p.style.boxShadow = `0 0 12px ${color}`;
    p.style.animation = `particleFly 1.2s ease-out ${Math.random() * 0.15}s forwards`;
    stage.appendChild(p);
    setTimeout(() => p.remove(), 1500);
  }
}

function closeReveal() {
  if (!canCloseReveal) return;
  $('revealOverlay').classList.add('hidden');
  animating = false;
  canCloseReveal = false;
}

/* ==========================================================
   TOAST
========================================================== */
let toastTimer;
function showToast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1500);
}

/* ==========================================================
   TAB SWITCHING
========================================================== */
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    tab.classList.add('active');
    $('view-' + tab.dataset.tab).classList.add('active');

    if (tab.dataset.tab === 'collection') renderCollection();
    if (tab.dataset.tab === 'stats') renderStats();
  });
});

/* ==========================================================
   EVENT LISTENERS
========================================================== */
$('revealOverlay').addEventListener('click', closeReveal);

$('soundOn').addEventListener('change', (e) => {
  soundEnabled = e.target.checked;
  if (soundEnabled) initAudio();
});

$('skipAnim').addEventListener('change', () => {
  initAudio();
});

$('resetBtn').addEventListener('click', () => {
  if (confirm('Wirklich ALLES zurücksetzen? Dein Fortschritt geht verloren.')) {
    coins = 500;
    owned = {};
    logEntries = [];
    pityCounter = 0;
    totalOpened = 0;
    refreshUI();
    renderBoxes();
    renderStats();
    renderCollection();
    addLog('Spiel zurückgesetzt.');
    showToast('ZURÜCKGESETZT');
  }
});

/* ==========================================================
   GAME LOOP
========================================================== */
let lastTick = performance.now();
let boxRefreshTimer = 0;

function tick(now) {
  const dt = (now - lastTick) / 1000;
  lastTick = now;

  const earned = getCps() * dt;
  if (earned > 0) {
    coins += earned;
    updateStats();
  }

  // Refresh boxes once per second
  boxRefreshTimer += dt;
  if (boxRefreshTimer >= 1) {
    boxRefreshTimer = 0;
    const needsRefresh = BOXES.some((b, i) => {
      const card = $('boxGrid').children[i];
      if (!card) return true;
      const wasLocked = card.classList.contains('locked');
      const nowLocked = coins < b.cost;
      return wasLocked !== nowLocked;
    });
    if (needsRefresh) renderBoxes();
    updateBoxHint();
  }

  requestAnimationFrame(tick);
}

/* ==========================================================
   INIT
========================================================== */
renderBoxes();
renderInventory();
updateStats();
updateBoxHint();
addLog('Willkommen! Du hast <span style="color:var(--gold)">500 Münzen</span> – kauf dir deine erste Holzbox!');
requestAnimationFrame(tick);
</script>
